<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Image to Text - OCR Urdu & English Free Pakistan | PakTools</title>
<meta name="description" content="Free Image to Text OCR Pakistan - Extract text from images, scanned notes, Urdu books, CNIC. English + Urdu supported. 100% working, secure.">
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdn.jsdelivr.net/npm/tesseract.js@4/dist/tesseract.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@800&family=Inter:wght@400;600&display=swap" rel="stylesheet">
</head>
<body style="background:#07010f;color:white;font-family:Inter,sans-serif">
<div style="position:fixed;inset:0;background:radial-gradient(ellipse at 30% 20%, rgba(120,40,200,0.15), transparent 50%);z-index:0"></div>
<header class="sticky top-0 z-20 border-b border-white/10 bg-[#07010f]/80 backdrop-blur-xl"><div class="max-w-6xl mx-auto px-6 py-4 flex justify-between items-center"><a href="index.html" style="text-decoration:none;color:white" class="font-black text-xl flex gap-2 items-center"><div class="w-8 h-8 rounded-lg bg-gradient-to-br from-purple-400 to-purple-700 flex items-center justify-center">P</div>PakTools</a><a href="blog.html" style="color:white;text-decoration:none" class="text-[11px] bg-white/10 border border-white/20 px-4 py-2 rounded-full">Blogs</a></div></header>
<main class="max-w-6xl mx-auto px-6 py-8 relative z-10 grid lg:grid-cols-2 gap-6">
<div>
<h1 style="font-family:'Plus Jakarta Sans'" class="text-3xl font-black">Image to Text OCR</h1>
<p class="text-gray-400 text-[12px] mt-2">English + Urdu • Scanned Notes, Books, CNIC, Assignments - 100% Secure (Browser OCR)</p>
<div id="drop" class="mt-6 border-2 border-dashed border-purple-500/40 bg-white/[0.04] rounded-[24px] p-10 text-center cursor-pointer"><div class="text-5xl">🖼️</div><h3 class="mt-3 font-bold text-[14px]">Drop Image or Click</h3><p class="text-[11px] text-gray-400 mt-1">JPG, PNG, WEBP • Urdu & English • Max 10MB</p><input id="file" type="file" accept="image/*" class="hidden"></div>
<div class="mt-4 flex gap-2"><select id="lang" class="bg-[#1a0f2e] border border-white/15 rounded-full px-4 py-2 text-[11px]"><option value="eng">English</option><option value="eng+urd">English + Urdu</option><option value="urd">Urdu Only</option></select><button id="clear" class="px-4 py-2 bg-white/10 rounded-full text-[11px]">Clear</button></div>
<div class="mt-4 bg-white/[0.03] border border-white/10 rounded-xl p-4"><img id="preview" class="hidden max-h-60 mx-auto rounded-lg"><div id="progress" class="hidden mt-3 text-[11px] text-purple-300">OCR Processing... <span id="pct">0%</span></div></div>
</div>
<div>
<div class="bg-white/[0.05] border border-white/10 rounded-2xl p-5"><div class="flex justify-between items-center"><h3 class="text-[12px] font-bold">Extracted Text</h3><div class="flex gap-2"><button id="copy" class="px-3 py-1 bg-white text-black rounded-full text-[11px] font-bold">Copy</button><button id="download" class="px-3 py-1 bg-purple-600 rounded-full text-[11px]">Download.txt</button></div></div><textarea id="output" placeholder="Text will appear here... 100% working OCR" class="w-full mt-4 h-[380px] bg-black/30 border border-white/10 rounded-xl p-4 text-[13px] outline-none resize-none"></textarea><div class="mt-3 text-[11px] text-gray-500">💡 Tip: For PPSC, scan clear image in good light for best Urdu result.</div></div>
</div>
</main>
<script>
const drop=document.getElementById('drop'), file=document.getElementById('file'), preview=document.getElementById('preview'), progress=document.getElementById('progress'), pct=document.getElementById('pct'), output=document.getElementById('output'), lang=document.getElementById('lang');
drop.onclick=()=>file.click();
drop.ondragover=e=>{e.preventDefault();drop.classList.add('border-purple-400')};
drop.ondragleave=()=>drop.classList.remove('border-purple-400');
drop.ondrop=e=>{e.preventDefault();handle(e.dataTransfer.files[0])};
file.onchange=e=>handle(e.target.files[0]);
async function handle(f){
if(!f) return;
preview.src=URL.createObjectURL(f); preview.classList.remove('hidden');
progress.classList.remove('hidden'); output.value='Processing...';
try{
const worker=await Tesseract.createWorker(lang.value,1,{logger:m=>{pct.textContent=Math.round(m.progress*100)+'%' }});
const {data:{text}}=await worker.recognize(f);
output.value=text;
await worker.terminate();
progress.classList.add('hidden');
}catch(e){output.value='Error: '+e.message+' - Try English only'; progress.classList.add('hidden')}
}
document.getElementById('copy').onclick=()=>{navigator.clipboard.writeText(output.value);alert('Copied!')};
document.getElementById('download').onclick=()=>{const b=new Blob([output.value],{type:'text/plain'});const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='ocr-text.txt';a.click()};
document.getElementById('clear').onclick=()=>{preview.classList.add('hidden');output.value='';progress.classList.add('hidden')};
</script>
</body>
</html>
