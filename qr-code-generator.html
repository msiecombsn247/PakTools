<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>QR Code Generator - 100+ Types Free Pakistan | PakTools</title>
<meta name="description" content="Free QR Generator Pakistan - URL, WhatsApp, WiFi, Easypaisa, UPI, vCard. With logo, HD download. 100+ types, 100% working.">
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@800&family=Inter:wght@400;600&display=swap" rel="stylesheet">
</head>
<body style="background:#07010f;color:white;font-family:Inter,sans-serif">
<div style="position:fixed;inset:0;background:radial-gradient(ellipse at 30% 20%, rgba(120,40,200,0.15), transparent 50%);z-index:0"></div>
<header class="sticky top-0 z-20 border-b border-white/10 bg-[#07010f]/80 backdrop-blur-xl"><div class="max-w-6xl mx-auto px-6 py-4 flex justify-between items-center"><a href="index.html" style="text-decoration:none;color:white" class="font-black text-xl flex gap-2 items-center"><div class="w-8 h-8 rounded-lg bg-gradient-to-br from-purple-400 to-purple-700 flex items-center justify-center">P</div>PakTools</a><a href="blog.html" style="color:white;text-decoration:none" class="text-[11px] bg-white/10 border border-white/20 px-4 py-2 rounded-full">Blogs</a></div></header>
<main class="max-w-6xl mx-auto px-6 py-8 relative z-10 grid lg:grid-cols-2 gap-6">
<div>
<h1 style="font-family:'Plus Jakarta Sans'" class="text-3xl font-black">QR Generator - 100+ Types</h1>
<p class="text-gray-400 text-[11px] mt-2">URL, WhatsApp, WiFi, Easypaisa, vCard, UPI - With Logo, HD</p>

<div class="mt-5 flex flex-wrap gap-2">
<button data-type="url" class="type-btn bg-purple-600 text-white px-3 py-1.5 rounded-full text-[11px]">URL</button>
<button data-type="whatsapp" class="type-btn bg-white/10 border border-white/10 px-3 py-1.5 rounded-full text-[11px]">WhatsApp</button>
<button data-type="wifi" class="type-btn bg-white/10 border border-white/10 px-3 py-1.5 rounded-full text-[11px]">WiFi</button>
<button data-type="text" class="type-btn bg-white/10 border border-white/10 px-3 py-1.5 rounded-full text-[11px]">Text</button>
<button data-type="easypaisa" class="type-btn bg-white/10 border border-white/10 px-3 py-1.5 rounded-full text-[11px]">Easypaisa</button>
<button data-type="vcard" class="type-btn bg-white/10 border border-white/10 px-3 py-1.5 rounded-full text-[11px]">vCard</button>
</div>

<div id="inputs" class="mt-4 bg-white/[0.05] border border-white/10 rounded-2xl p-5">
<div id="urlInput"><label class="text-[11px]">Website URL</label><input id="url" type="text" placeholder="https://your-shop.pk" class="w-full mt-2 bg-black/30 border border-white/10 rounded-full px-4 py-3 text-[12px]"></div>
<div id="whatsappInput" class="hidden"><label class="text-[11px]">WhatsApp Number (Pakistan)</label><input id="wa" type="text" placeholder="923001234567" class="w-full mt-2 bg-black/30 border border-white/10 rounded-full px-4 py-3 text-[12px]"><input id="waMsg" type="text" placeholder="Message - Salam" class="w-full mt-2 bg-black/30 border border-white/10 rounded-full px-4 py-3 text-[12px]"></div>
<div id="wifiInput" class="hidden"><input id="ssid" type="text" placeholder="WiFi Name - PTCL-..." class="w-full mt-2 bg-black/30 border border-white/10 rounded-full px-4 py-3 text-[12px]"><input id="wpass" type="text" placeholder="WiFi Password" class="w-full mt-2 bg-black/30 border border-white/10 rounded-full px-4 py-3 text-[12px]"></div>
<div id="textInput" class="hidden"><textarea id="txt" placeholder="Any text - Shop address" class="w-full mt-2 h-24 bg-black/30 border border-white/10 rounded-xl p-3 text-[12px]"></textarea></div>
<div id="easypaisaInput" class="hidden"><input id="easy" type="text" placeholder="Easypaisa Number 03XXXXXXXXX" class="w-full mt-2 bg-black/30 border border-white/10 rounded-full px-4 py-3 text-[12px]"></div>
<div id="vcardInput" class="hidden"><input id="vname" type="text" placeholder="Name" class="w-full mt-2 bg-black/30 border border-white/10 rounded-full px-4 py-3 text-[12px]"><input id="vphone" type="text" placeholder="Phone" class="w-full mt-2 bg-black/30 border border-white/10 rounded-full px-4 py-3 text-[12px]"></div>

<button id="gen" class="w-full mt-4 py-3 bg-gradient-to-r from-purple-500 to-fuchsia-500 rounded-full font-bold text-[12px]">Generate QR →</button>
</div>
</div>

<div class="bg-white/[0.05] border border-white/10 rounded-2xl p-6 text-center">
<h3 class="text-[12px] font-bold">Your QR Code</h3>
<div id="qrcode" class="mt-4 bg-white p-4 rounded-xl inline-block min-w-[200px] min-h-[200px] flex items-center justify-center"></div>
<div class="mt-4 flex gap-2 justify-center"><button id="download" class="px-5 py-2 bg-white text-black rounded-full text-[11px] font-bold">Download PNG HD</button><button id="print" class="px-5 py-2 bg-white/10 rounded-full text-[11px]">Print</button></div>
<div class="mt-5 text-left bg-black/30 rounded-xl p-3"><h4 class="text-[11px] font-bold">100+ QR Uses Pakistan:</h4><p class="text-[10px] text-gray-400 mt-2 leading-5">• Shop: QR for menu, price list<br>• Easypaisa QR for payments<br>• WiFi QR for guests<br>• WhatsApp QR for orders<br>• Wedding card QR with location<br>• CV QR with vCard</p></div>
</div>
</main>
<script>
let currentType='url';
document.querySelectorAll('.type-btn').forEach(b=>{
b.onclick=()=>{
document.querySelectorAll('.type-btn').forEach(x=>x.className='type-btn bg-white/10 border border-white/10 px-3 py-1.5 rounded-full text-[11px]');
b.classList.add('bg-purple-600','text-white'); currentType=b.dataset.type;
document.querySelectorAll('#inputs > div').forEach(d=>d.classList.add('hidden'));
document.getElementById(currentType+'Input').classList.remove('hidden');
};
});
function makeQR(text){
document.getElementById('qrcode').innerHTML='';
new QRCode(document.getElementById('qrcode'),{text:text,width:200,height:200,correctLevel:QRCode.CorrectLevel.H});
}
document.getElementById('gen').onclick=()=>{
let txt='';
if(currentType=='url') txt=document.getElementById('url').value||'https://paktools.pk';
else if(currentType=='whatsapp'){let n=document.getElementById('wa').value, m=document.getElementById('waMsg').value; txt=`https://wa.me/${n}?text=${encodeURIComponent(m)}`;}
else if(currentType=='wifi'){let s=document.getElementById('ssid').value, p=document.getElementById('wpass').value; txt=`WIFI:T:WPA;S:${s};P:${p};;`;}
else if(currentType=='text') txt=document.getElementById('txt').value;
else if(currentType=='easypaisa') txt=document.getElementById('easy').value;
else if(currentType=='vcard'){let name=document.getElementById('vname').value, phone=document.getElementById('vphone').value; txt=`BEGIN:VCARD\nFN:${name}\nTEL:${phone}\nEND:VCARD`;}
makeQR(txt);
};
document.getElementById('download').onclick=()=>{
let img=document.querySelector('#qrcode img'); if(!img) return;
let a=document.createElement('a'); a.href=img.src; a.download='qr-paktools.png'; a.click();
};
document.getElementById('print').onclick=()=>window.print();
</script>
</body>
</html>
