<!DOCTYPE html><html><head><meta charset='UTF-8'><meta name='viewport' content='width=device-width, initial-scale=1.0'><title>QR Code Generator - PakTools</title><script src='https://cdn.tailwindcss.com'></script><script src='https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js'></script></head><body class='bg-slate-50'><header class='bg-white p-4 shadow flex justify-between'><a href='index.html' class='font-black text-blue-600'>PakTools.pk</a><span class='bg-green-100 text-green-700 px-2 py-1 rounded-full text-xs'>REAL WORKING</span></header><main class='max-w-xl mx-auto mt-10 bg-white p-8 rounded-3xl shadow-2xl'><h1 class='text-3xl font-black text-center'>QR Code Generator</h1><input id='t' class='w-full mt-6 p-4 border-2 rounded-xl' placeholder='Enter URL or Text'><button onclick='make()' class='w-full mt-4 bg-blue-600 text-white py-3 rounded-xl font-bold'>Generate QR</button><div id='q' class='flex justify-center mt-6'></div></main><script>function make(){let v=document.getElementById('t').value;if(!v)return alert('Enter text');document.getElementById('q').innerHTML='';new QRCode(document.getElementById('q'),{text:v,width:200,height:200})}</script></body></html>
