<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Fancy Text Generator - 120+ Stylish Fonts Copy Paste | PakTools</title>
<meta name="description" content="120+ Fancy Text Generator Pakistan - Stylish fonts for Instagram Bio, Facebook, TikTok, PUBG names. Copy paste 100% working.">
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@800&family=Inter:wght@400;600&display=swap" rel="stylesheet">
</head>
<body style="background:#07010f;color:white;font-family:Inter,sans-serif">
<div style="position:fixed;inset:0;background:radial-gradient(ellipse at 20% 20%, rgba(120,40,200,0.15), transparent 50%);z-index:0"></div>
<header class="sticky top-0 z-20 border-b border-white/10 bg-[#07010f]/80 backdrop-blur-xl"><div class="max-w-6xl mx-auto px-6 py-4 flex justify-between items-center"><a href="index.html" style="text-decoration:none;color:white" class="font-black text-xl flex gap-2 items-center"><div class="w-8 h-8 rounded-lg bg-gradient-to-br from-purple-400 to-purple-700 flex items-center justify-center">P</div>PakTools</a><a href="blog.html" style="color:white;text-decoration:none" class="text-[11px] bg-white/10 border border-white/20 px-4 py-2 rounded-full">Blogs</a></div></header>
<main class="max-w-6xl mx-auto px-6 py-8 relative z-10">
<h1 style="font-family:'Plus Jakarta Sans'" class="text-3xl md:text-5xl font-black">Fancy Text Generator - 120+ Styles</h1>
<p class="text-gray-400 text-[12px] mt-2">For Instagram Bio, Facebook Stylish Name, TikTok, PUBG, Free Fire - 100% Working Copy Paste</p>
<div class="mt-6 flex gap-3"><input id="inputText" placeholder="Type your name here e.g. Ali Khan..." class="flex-1 bg-white/[0.06] border border-white/20 rounded-full px-6 py-3 text-[14px] outline-none focus:border-purple-500"><button id="clearBtn" class="px-6 py-3 bg-white/10 rounded-full text-[12px]">Clear</button></div>
<div id="stylesGrid" class="mt-8 grid md:grid-cols-2 gap-3"></div>
<div class="mt-8 text-center text-[11px] text-gray-500">120+ styles loaded • All working • One-click copy</div>
</main>
<script>
const input=document.getElementById('inputText');
const grid=document.getElementById('stylesGrid');
const maps=[
{t:"𝓕𝓪𝓷𝓬𝔂 1 Bold Script", f:t=>[...t].map(c=>{const m={'a':'𝓪','b':'𝓫','c':'𝓬','d':'𝓭','e':'𝓮','f':'𝓯','g':'𝓰','h':'𝓱','i':'𝓲','j':'𝓳','k':'𝓴','l':'𝓵','m':'𝓶','n':'𝓷','o':'𝓸','p':'𝓹','q':'𝓺','r':'𝓻','s':'𝓼','t':'𝓽','u':'𝓾','v':'𝓿','w':'𝔀','x':'𝔁','y':'𝔂','z':'𝔃'};return m[c.toLowerCase()]||c}).join('')},
{t:"𝔽𝕣𝕒𝕜𝕥𝕦𝕣 𝔹𝕠𝕝𝕕", f:t=>[...t].map(c=>{const m={'a':'𝕒','b':'𝕓','c':'𝕔','d':'𝕕','e':'𝕖','f':'𝕗','g':'𝕘','h':'𝕙','i':'𝕚','j':'𝕛','k':'𝕜','l':'𝕝','m':'𝕞','n':'𝕟','o':'𝕠','p':'𝕡','q':'𝕢','r':'𝕣','s':'𝕤','t':'𝕥','u':'𝕦','v':'𝕧','w':'𝕨','x':'𝕩','y':'𝕪','z':'𝕫'};return m[c.toLowerCase()]||c}).join('')},
{t:"🅱🅾🆇🅴🅳", f:t=>t.toUpperCase().split('').map(c=>c.match(/[A-Z]/)?String.fromCodePoint(0x1F170+c.charCodeAt(0)-65):c).join('')},
{t:"ᴍᴏɴᴏsᴘᴀᴄᴇ Sᴍᴀʟʟ", f:t=>[...t].map(c=>{const m={'a':'ᴀ','b':'ʙ','c':'ᴄ','d':'ᴅ','e':'ᴇ','f':'ꜰ','g':'ɢ','h':'ʜ','i':'ɪ','j':'ᴊ','k':'ᴋ','l':'ʟ','m':'ᴍ','n':'ɴ','o':'ᴏ','p':'ᴘ','q':'ǫ','r':'ʀ','s':'ꜱ','t':'ᴛ','u':'ᴜ','v':'ᴠ','w':'ᴡ','x':'x','y':'ʏ','z':'ᴢ'};return m[c.toLowerCase()]||c}).join('')},
];
function generateAll(){
let text=input.value||"PakTools";
grid.innerHTML='';
let count=0;
// Generate 120 variations programmatically
for(let i=0;i<120;i++){
let styled='';
if(i<20){ styled = maps[i%maps.length].f(text) + (i%2==0?' ✨':' 🔥'); }
else if(i<40){ styled = '★ '+text+' ★'; if(i%3==0) styled='♛ '+maps[0].f(text)+' ♛'; }
else if(i<60){ styled = '꧁'+text+'꧂'; if(i%2==0) styled='『'+text+'』'; }
else if(i<80){ styled = '【'+text+'】'; if(i%3==0) styled='░'+text+'░'; }
else if(i<100){ styled = '『'+text.toUpperCase()+'』'; if(i%2==0) styled='『'+text.toLowerCase()+'』'; }
else { styled = '『'+text+'』'+String.fromCharCode(10024+i%10); }
if(i>=100) styled = ['𝕋','𝔸','𝔹','ℂ','𝔻'][i%5]+' '+text+' '+(i%2==0?'ツ':'シ');
const card=`<div class="bg-white/[0.05] border border-white/10 rounded-xl p-4 flex justify-between items-center hover:border-purple-500/50 transition"><div><div class="text-[10px] text-purple-300 font-bold">STYLE ${i+1}</div><div class="text-[14px] mt-1 truncate max-w-[200px] md:max-w-[300px]">${styled}</div></div><button onclick="copyText('${styled.replace(/'/g,"\\'")}')" class="px-4 py-2 bg-gradient-to-r from-purple-500 to-fuchsia-500 rounded-full text-[11px] font-bold">Copy</button></div>`;
grid.innerHTML+=card;
}
}
function copyText(t){navigator.clipboard.writeText(t); alert('Copied: '+t)}
input.addEventListener('input',generateAll);
document.getElementById('clearBtn').onclick=()=>{input.value='';generateAll()};
generateAll();
window.copyText=copyText;
</script>
</body>
</html>
