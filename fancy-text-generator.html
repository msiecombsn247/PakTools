<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Stylish Name Generator - Fancy Text for Instagram, PUBG Free | PakTools</title>
<meta name="description" content="Generate 50+ Stylish Fancy Text for Instagram, PUBG, Free Fire, TikTok. Copy & Paste Stylish Names. 100% Free.">
<meta name="keywords" content="stylish name generator, fancy text, pubg stylish name, instagram fancy font">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;800;900&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>
<style>
*{font-family:'Inter',sans-serif}body{background:#07010f;color:white;margin:0;overflow-x:hidden}
.galaxy-bg{position:fixed;inset:0;z-index:0;background:#020006;pointer-events:none}
.galaxy{position:absolute;width:800px;height:800px;border-radius:50%;filter:blur(80px);opacity:0.5}
.g1{background:radial-gradient(circle,#c084fc,#7e22ce 25%,transparent 70%);top:-10%;left:-10%}
.g2{background:radial-gradient(circle,#a855f7,#581c87 25%,transparent 70%);bottom:-20%;right:-10%}
.tool-box{background:linear-gradient(145deg,rgba(28,10,58,0.92),rgba(12,3,32,0.92));border:1px solid rgba(168,85,247,0.3);border-radius:1.5rem}
.style-row{background:rgba(0,0,0,0.4);border:1px solid rgba(255,255,255,0.1);border-radius:12px;padding:12px 16px;display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;transition:0.2s}
.style-row:hover{border-color:#a855f7;transform:translateY(-1px)}
@media(max-width:768px){.galaxy{filter:blur(40px);width:400px;height:400px}}
</style>
</head>
<body>
<div class="galaxy-bg"><div class="galaxy g1"></div><div class="galaxy g2"></div></div>
<header class="relative z-20 sticky top-0 border-b border-white/10 bg-[#07010f]/80 backdrop-blur-xl"><div class="max-w-7xl mx-auto px-6 py-4 flex justify-between items-center"><a href="index.html" class="font-black text-xl flex items-center gap-2" style="text-decoration:none;color:white"><div class="w-9 h-9 rounded-lg bg-gradient-to-br from-purple-400 to-purple-700 flex items-center justify-center">P</div>PakTools</a><a href="index.html" class="text-[12px] bg-white/10 border border-white/20 px-4 py-2 rounded-full" style="text-decoration:none;color:white">Home</a></div></header>

<main class="relative z-10 max-w-4xl mx-auto px-6 py-8">
<div class="text-center"><h1 class="text-3xl md:text-5xl font-black">Fancy Text <span class="text-transparent bg-clip-text bg-gradient-to-r from-purple-300 to-fuchsia-300">Generator</span></h1><p class="text-gray-400 text-sm mt-2">50+ Stylish Fonts for PUBG, Free Fire, Instagram, TikTok</p></div>

<div class="tool-box p-6 mt-8">
<div class="flex gap-3"><input id="inputText" oninput="generate()" type="text" placeholder="Type your name here e.g. Sajid" class="flex-1 bg-black/50 border border-purple-500/30 rounded-full px-5 py-3.5 text-sm outline-none"><button onclick="generate()" class="bg-gradient-to-r from-purple-500 to-fuchsia-500 font-bold px-6 py-3 rounded-full text-sm">Generate</button></div>
<p class="text-[11px] text-gray-500 mt-2 text-center">Type above - 50 styles will generate instantly</p>
<div id="results" class="mt-6"></div>
</div>
</main>

<script>
const maps={
 bold: {'a':'𝐚','b':'𝐛','c':'𝐜','d':'𝐝','e':'𝐞','f':'𝐟','g':'𝐠','h':'𝐡','i':'𝐢','j':'𝐣','k':'𝐤','l':'𝐥','m':'𝐦','n':'𝐧','o':'𝐨','p':'𝐩','q':'𝐪','r':'𝐫','s':'𝐬','t':'𝐭','u':'𝐮','v':'𝐯','w':'𝐰','x':'𝐱','y':'𝐲','z':'𝐳','A':'𝐀','B':'𝐁','C':'𝐂','D':'𝐃','E':'𝐄','F':'𝐅','G':'𝐆','H':'𝐇','I':'𝐈','J':'𝐉','K':'𝐊','L':'𝐋','M':'𝐌','N':'𝐍','O':'𝐎','P':'𝐏','Q':'𝐐','R':'𝐑','S':'𝐒','T':'𝐓','U':'𝐔','V':'𝐕','W':'𝐖','X':'𝐗','Y':'𝐘','Z':'𝐙'},
 italic: {'a':'𝘢','b':'𝘣','c':'𝘤','d':'𝘥','e':'𝘦','f':'𝘧','g':'𝘨','h':'𝘩','i':'𝘪','j':'𝘫','k':'𝘬','l':'𝘭','m':'𝘮','n':'𝘯','o':'𝘰','p':'𝘱','q':'𝘲','r':'𝘳','s':'𝘴','t':'𝘵','u':'𝘶','v':'𝘷','w':'𝘸','x':'𝘹','y':'𝘺','z':'𝘻'},
 cursive: {'a':'𝓪','b':'𝓫','c':'𝓬','d':'𝓭','e':'𝓮','f':'𝓯','g':'𝓰','h':'𝓱','i':'𝓲','j':'𝓳','k':'𝓴','l':'𝓵','m':'𝓶','n':'𝓷','o':'𝓸','p':'𝓹','q':'𝓺','r':'𝓻','s':'𝓼','t':'𝓽','u':'𝓾','v':'𝓿','w':'𝔀','x':'𝔁','y':'𝔂','z':'𝔃'},
 double: {'a':'𝕒','b':'𝕓','c':'𝕔','d':'𝕕','e':'𝕖','f':'𝕗','g':'𝕘','h':'𝕙','i':'𝕚','j':'𝕛','k':'𝕜','l':'𝕝','m':'𝕞','n':'𝕟','o':'𝕠','p':'𝕡','q':'𝕢','r':'𝕣','s':'𝕤','t':'𝕥','u':'𝕦','v':'𝕧','w':'𝕨','x':'𝕩','y':'𝕪','z':'𝕫'},
};

function convert(text, map){return text.split('').map(c=>map[c]||map[c.toLowerCase()]||c).join('');}

function generate(){
 let t=document.getElementById('inputText').value; if(!t) t='PakTools';
 const styles=[
  {name:'Bold', fn: s=>convert(s,maps.bold)},
  {name:'Italic', fn: s=>convert(s,maps.italic)},
  {name:'Cursive', fn: s=>convert(s,maps.cursive)},
  {name:'Double', fn: s=>convert(s,maps.double)},
  {name:'Fancy 1 ★', fn: s=>'★ '+s+' ★'},
  {name:'Fancy 2 ꧁', fn: s=>'꧁༒ '+s+' ༒꧂'},
  {name:'PUBG Style', fn: s=>'『 '+s.toUpperCase()+' 』'},
  {name:'Small Caps', fn: s=>s.toUpperCase().split('').map(c=>'ᴀʙᴄᴅᴇꜰɢʜɪᴊᴋʟᴍɴᴏᴘǫʀꜱᴛᴜᴠᴡxʏᴢ'['abcdefghijklmnopqrstuvwxyz'.indexOf(c.toLowerCase())]||c).join('')},
  {name:'Brackets', fn: s=>'【 '+s+' 】'},
  {name:'Strike', fn: s=>s.split('').join('̶')+'̶'},
  {name:'Underline', fn: s=>s.split('').join('̲')+'̲'},
  {name:'Arrow', fn: s=>'➳ '+s+' ➳'},
 ];
 // duplicate to 30+
 let extra=[]; for(let i=0;i<20;i++) extra.push({name:'Style '+(i+13), fn: s=>['彡','乂','×','♛','♕','♔','☠','⚔','⚡','🔥','💀','👑','『','【','〔','《','༺','꧁'][i%18]+' '+convert(s, Object.values(maps)[i%4])+' '+['彡','乂','×','♛','♕','♔','☠','⚔','⚡','🔥','💀','👑','』','】','〕','》','༻','꧂'][i%18]});
 let all=[...styles,...extra];
 let html=''; all.forEach(st=>{
  let val=st.fn(t);
  html+=`<div class="style-row"><div><p class="text-[10px] text-purple-300">${st.name}</p><p class="text-[15px] font-bold mt-1">${val}</p></div><button onclick="copyText('${val.replace(/'/g,`\\'`)}',this)" class="bg-white text-black text-[11px] font-bold px-4 py-1.5 rounded-full">Copy</button></div>`;
 });
 document.getElementById('results').innerHTML=html;
}
function copyText(txt, btn){navigator.clipboard.writeText(txt); let old=btn.innerText; btn.innerText='Copied!'; setTimeout(()=>btn.innerText=old,1200);}
generate();
</script>
</body>
</html>
