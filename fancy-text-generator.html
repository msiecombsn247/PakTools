<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Fancy Text Generator</title><script src="https://cdn.tailwindcss.com"></script></head><body class="bg-[#0b1220] p-6"><a href="index.html" class="bg-white px-5 py-2 rounded-full font-bold">← Back</a><div class="max-w-2xl mx-auto bg-white rounded-[2rem] p-8 mt-6"><h1 class="text-3xl font-black text-center">Fancy Text Generator</h1><p class="text-center text-gray-500">15+ VIP Styles</p><input id="input" placeholder="Type Your Name / Text here..." class="w-full border-2 p-4 rounded-xl mt-6 font-bold"><div id="list" class="mt-6 space-y-3"></div></div><script>
const normal="ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz";
const styles=[
{name:"Bold",chars:"𝐀𝐁𝐂𝐃𝐄𝐅𝐆𝐇𝐈𝐉𝐊𝐋𝐌𝐍𝐎𝐏𝐐𝐑𝐒𝐓𝐔𝐕𝐖𝐗𝐘𝐙𝐚𝐛𝐜𝐝𝐞𝐟𝐠𝐡𝐢𝐣𝐤𝐥𝐦𝐧𝐨𝐩𝐪𝐫𝐬𝐭𝐮𝐯𝐰𝐱𝐲𝐳"},
{name:"Cursive",chars:"𝒜𝐵𝒞𝒟𝐸𝐹𝒢𝐻𝐼𝒥𝒦𝐿𝑀𝒩𝒪𝒫𝒬𝑅𝒮𝒯𝒰𝒱𝒲𝒳𝒴𝒵𝒶𝒷𝒸𝒹𝑒𝒻𝑔𝒽𝒾𝒿𝓀𝓁𝓂𝓃𝑜𝓅𝓆𝓇𝓈𝓉𝓊𝓋𝓌𝓍𝓎𝓏"},
{name:"Old English",chars:"𝔄𝔅ℭ𝔇𝔈𝔉𝔊ℌℑ𝔍𝔎𝔏𝔐𝔑𝔒𝔓𝔔ℜ𝔖𝔗𝔘𝔙𝔚𝔛𝔜ℨ𝔞𝔟𝔠𝔡𝔢𝔣𝔤𝔥𝔦𝔧𝔨𝔩𝔪𝔫𝔬𝔭𝔮𝔯𝔰𝔱𝔲𝔳𝔴𝔵𝔶𝔷"},
{name:"Bubbles",chars:"ⒶⒷⒸⒹⒺⒻⒼⒽⒾⒿⓀⓁⓂⓃⓄⓅⓆⓇⓈⓉⓊⓋⓌⓍⓎⓏⓐⓑⓒⓓⓔⓕⓖⓗⓘⓙⓚⓛⓜⓝⓞⓟⓠⓡⓢⓣⓤⓥⓦⓧⓨⓩ"},
{name:"Small Caps",chars:"ᴀʙᴄᴅᴇꜰɢʜɪᴊᴋʟᴍɴᴏᴘQʀꜱᴛᴜᴠᴡxʏᴢᴀʙᴄᴅᴇꜰɢʜɪᴊᴋʟᴍɴᴏᴘqʀꜱᴛᴜᴠᴡxʏᴢ"},
{name:"Upside Down",chars:"∀𐐒ƆᗡƎℲפHIſʞ˥WNOԀΌᴚS⟘∩ΛMX⅄Zɐqɔpǝɟƃɥıɾʞʅɯuodbɹsʇnʌʍxʎz"}
];
function fancy(t){let out="";list.innerHTML="";styles.forEach(s=>{let res="";for(let ch of t){let idx=normal.indexOf(ch);if(idx>-1)res+=s.chars[idx];else res+=ch;}let div=document.createElement('div');div.className="flex justify-between items-center border p-3 rounded-xl";div.innerHTML=`<div><p class="text-xs text-gray-400">${s.name}</p><p class="font-bold text-lg">${res}</p></div><button onclick="navigator.clipboard.writeText('${res}');this.innerText='Copied!'" class="bg-black text-white px-4 py-1 rounded-full text-sm">Copy</button>`;list.appendChild(div)});}
input.addEventListener("input",e=>{if(e.target.value)fancy(e.target.value);else list.innerHTML=""})
</script></body></html>
