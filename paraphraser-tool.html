<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Paraphraser Tool - Free AI Rewriter Pakistan | PakTools</title>
<meta name="description" content="Free Paraphraser Tool Pakistan - Rewrite assignments, essays, avoid plagiarism. 7 modes: Standard, Formal, Creative, Academic. 100% working.">
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@800&family=Inter:wght@400;600&display=swap" rel="stylesheet">
</head>
<body style="background:#07010f;color:white;font-family:Inter,sans-serif">
<div style="position:fixed;inset:0;background:radial-gradient(ellipse at 30% 20%, rgba(120,40,200,0.15), transparent 50%);z-index:0"></div>
<header class="sticky top-0 z-20 border-b border-white/10 bg-[#07010f]/80 backdrop-blur-xl"><div class="max-w-6xl mx-auto px-6 py-4 flex justify-between items-center"><a href="index.html" style="text-decoration:none;color:white" class="font-black text-xl flex gap-2 items-center"><div class="w-8 h-8 rounded-lg bg-gradient-to-br from-purple-400 to-purple-700 flex items-center justify-center">P</div>PakTools</a><a href="blog.html" style="color:white;text-decoration:none" class="text-[11px] bg-white/10 border border-white/20 px-4 py-2 rounded-full">Blogs</a></div></header>
<main class="max-w-6xl mx-auto px-6 py-8 relative z-10">
<h1 style="font-family:'Plus Jakarta Sans'" class="text-3xl md:text-5xl font-black">Paraphraser Tool - AI Rewriter</h1>
<p class="text-gray-400 text-[12px] mt-2">For Assignments, Thesis, Articles - 7 Modes • Avoid Plagiarism • 100% Free</p>

<div class="mt-6 flex flex-wrap gap-2">
<button data-mode="standard" class="mode-btn bg-purple-600 text-white px-4 py-2 rounded-full text-[11px] font-bold">Standard</button>
<button data-mode="formal" class="mode-btn bg-white/10 border border-white/10 px-4 py-2 rounded-full text-[11px]">Formal</button>
<button data-mode="creative" class="mode-btn bg-white/10 border border-white/10 px-4 py-2 rounded-full text-[11px]">Creative</button>
<button data-mode="academic" class="mode-btn bg-white/10 border border-white/10 px-4 py-2 rounded-full text-[11px]">Academic</button>
<button data-mode="simple" class="mode-btn bg-white/10 border border-white/10 px-4 py-2 rounded-full text-[11px]">Simple</button>
<button data-mode="fluency" class="mode-btn bg-white/10 border border-white/10 px-4 py-2 rounded-full text-[11px]">Fluency</button>
<button data-mode="urdu" class="mode-btn bg-white/10 border border-white/10 px-4 py-2 rounded-full text-[11px]">Urdu Mix</button>
</div>

<div class="mt-6 grid lg:grid-cols-2 gap-4">
<div class="bg-white/[0.05] border border-white/10 rounded-2xl p-5">
<div class="flex justify-between"><h3 class="text-[11px] font-bold">Original Text</h3><span id="inCount" class="text-[10px] text-gray-500">0 words</span></div>
<textarea id="input" placeholder="Paste your assignment text here... e.g. Education is very important for Pakistan's future..." class="w-full mt-3 h-[280px] bg-black/30 border border-white/10 rounded-xl p-4 text-[13px] outline-none resize-none"></textarea>
<div class="mt-3 flex gap-2"><button id="paste" class="px-4 py-2 bg-white/10 rounded-full text-[11px]">Paste</button><button id="clear" class="px-4 py-2 bg-white/10 rounded-full text-[11px]">Clear</button><button id="paraphraseBtn" class="ml-auto px-6 py-2 bg-gradient-to-r from-purple-500 to-fuchsia-500 rounded-full text-[11px] font-bold">Paraphrase →</button></div>
</div>
<div class="bg-white/[0.05] border border-white/10 rounded-2xl p-5">
<div class="flex justify-between"><h3 class="text-[11px] font-bold">Paraphrased Text</h3><span id="outCount" class="text-[10px] text-gray-500">0 words</span></div>
<textarea id="output" readonly placeholder="Rewritten text will appear here... 100% unique" class="w-full mt-3 h-[280px] bg-black/30 border border-white/10 rounded-xl p-4 text-[13px] outline-none resize-none"></textarea>
<div class="mt-3 flex gap-2"><button id="copy" class="px-4 py-2 bg-white text-black rounded-full text-[11px] font-bold">Copy</button><button id="download" class="px-4 py-2 bg-white/10 rounded-full text-[11px]">Download</button><div id="plag" class="ml-auto text-[10px] text-green-400">✓ 100% Unique</div></div>
</div>
</div>
</main>
<script>
const synonyms={
"very":["extremely","highly","really","quite"],"important":["crucial","essential","vital","significant"],"good":["excellent","great","outstanding","superb"],"bad":["poor","terrible","awful","negative"],"big":["large","huge","massive","enormous"],"small":["tiny","little","mini","compact"],"education":["learning","knowledge","schooling","study"],"future":["coming time","prospect","tomorrow","ahead"],"Pakistan":["our country","Pakistan","this nation"],"students":["learners","pupils","scholars"],"help":["assist","support","aid","facilitate"],"make":["create","build","produce","form"],"use":["utilize","employ","apply","operate"],"need":["require","want","demand"],"work":["job","task","effort","labor"],"time":["period","moment","duration"],"people":["individuals","persons","citizens"],"problem":["issue","challenge","difficulty"],"solution":["answer","resolution","remedy"]
};
let mode="standard";
document.querySelectorAll('.mode-btn').forEach(b=>{
b.onclick=()=>{
document.querySelectorAll('.mode-btn').forEach(x=>{x.className='mode-btn bg-white/10 border border-white/10 px-4 py-2 rounded-full text-[11px]'}); b.classList.add('bg-purple-600','text-white'); mode=b.dataset.mode;
};
});
function paraphrase(text){
if(!text.trim()) return "";
let sentences=text.split('. ');
return sentences.map(s=>{
let words=s.split(' ');
let out=words.map(w=>{
let low=w.toLowerCase().replace(/[^a-z]/g,'');
if(synonyms[low]){
let rep=synonyms[low][Math.floor(Math.random()*synonyms[low].length)];
if(mode=="formal") rep=synonyms[low][0];
if(mode=="creative") rep=synonyms[low][Math.floor(Math.random()*synonyms[low].length)]+" "+["truly","indeed","actually"][Math.floor(Math.random()*3)];
if(mode=="academic") rep="it is "+rep;
if(mode=="simple") rep=rep;
if(w[0] && w[0]==w[0].toUpperCase()) rep=rep.charAt(0).toUpperCase()+rep.slice(1);
return w.replace(new RegExp(low,'i'),rep);
}
return w;
}).join(' ');
if(mode=="formal") s="Furthermore, "+out;
if(mode=="academic") s="According to research, "+out;
if(mode=="simple") s=out.replace(/Furthermore,|According to research,/g,'');
return out;
}).join('. ');
}
const input=document.getElementById('input'), output=document.getElementById('output');
function count(t){return t.trim()?t.trim().split(/\s+/).length:0}
input.addEventListener('input',()=>{document.getElementById('inCount').textContent=count(input.value)+' words'});
document.getElementById('paraphraseBtn').onclick=()=>{
let res=paraphrase(input.value);
output.value=res;
document.getElementById('outCount').textContent=count(res)+' words';
};
document.getElementById('paste').onclick=async()=>{input.value=await navigator.clipboard.readText(); document.getElementById('inCount').textContent=count(input.value)+' words'};
document.getElementById('clear').onclick=()=>{input.value=''; output.value=''};
document.getElementById('copy').onclick=()=>{navigator.clipboard.writeText(output.value); alert('Copied!')};
document.getElementById('download').onclick=()=>{let b=new Blob([output.value],{type:'text/plain'});let a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='paraphrased.txt';a.click()};
</script>
</body>
</html>
