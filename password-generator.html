<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Password Generator - Strong Password 100+ Ideas Pakistan | PakTools</title>
<meta name="description" content="Free Strong Password Generator Pakistan - 100+ ideas, secure, unbreakable. For Gmail, Facebook, Easypaisa. 100% offline secure.">
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@800&family=Inter:wght@400;600&display=swap" rel="stylesheet">
</head>
<body style="background:#07010f;color:white;font-family:Inter,sans-serif">
<div style="position:fixed;inset:0;background:radial-gradient(ellipse at 30% 20%, rgba(120,40,200,0.15), transparent 50%);z-index:0"></div>
<header class="sticky top-0 z-20 border-b border-white/10 bg-[#07010f]/80 backdrop-blur-xl"><div class="max-w-5xl mx-auto px-6 py-4 flex justify-between items-center"><a href="index.html" style="text-decoration:none;color:white" class="font-black text-xl flex gap-2 items-center"><div class="w-8 h-8 rounded-lg bg-gradient-to-br from-purple-400 to-purple-700 flex items-center justify-center">P</div>PakTools</a><a href="blog.html" style="color:white;text-decoration:none" class="text-[11px] bg-white/10 border border-white/20 px-4 py-2 rounded-full">Blogs</a></div></header>
<main class="max-w-5xl mx-auto px-6 py-8 relative z-10">
<h1 style="font-family:'Plus Jakarta Sans'" class="text-3xl md:text-5xl font-black">Password Generator - 100% Secure</h1>
<p class="text-gray-400 text-[12px] mt-2">Strong, Unbreakable, Offline - For Gmail, Facebook, Banking - 100+ Ideas</p>

<div class="mt-6 grid lg:grid-cols-3 gap-6">
<div class="lg:col-span-2 bg-white/[0.05] border border-white/10 rounded-2xl p-6">
<div class="bg-black/40 border border-white/10 rounded-xl p-4 flex justify-between items-center">
<div id="password" class="text-xl font-mono tracking-wider">Click Generate</div><button id="copy" class="px-4 py-2 bg-white text-black rounded-full text-[11px] font-bold">Copy</button>
</div>
<div class="mt-4">
<div class="flex justify-between text-[11px]"><span>Strength</span><span id="strengthText" class="font-bold">-</span></div><div class="mt-2 h-2 bg-white/10 rounded-full overflow-hidden"><div id="strengthBar" class="h-full w-0 bg-gradient-to-r from-red-500 to-green-500 transition-all"></div></div>
</div>
<div class="mt-6 grid grid-cols-2 gap-4">
<div><label class="text-[11px]">Length: <span id="lenVal">16</span></label><input id="length" type="range" min="6" max="64" value="16" class="w-full mt-1"></div>
<div class="space-y-2 text-[11px]"><label class="flex gap-2"><input type="checkbox" id="upper" checked> Uppercase (A-Z)</label><label class="flex gap-2"><input type="checkbox" id="lower" checked> Lowercase (a-z)</label><label class="flex gap-2"><input type="checkbox" id="numbers" checked> Numbers (0-9)</label><label class="flex gap-2"><input type="checkbox" id="symbols" checked> Symbols (!@#$)</label><label class="flex gap-2"><input type="checkbox" id="avoid"> Avoid similar (0O1l)</label></div>
</div>
<button id="generate" class="w-full mt-6 py-3 bg-gradient-to-r from-purple-500 to-fuchsia-500 rounded-full font-bold text-[13px]">🔐 Generate Strong Password</button>
</div>

<div class="bg-white/[0.05] border border-white/10 rounded-2xl p-5">
<h3 class="text-[12px] font-bold">100+ Password Ideas</h3>
<div id="ideas" class="mt-3 space-y-2 max-h-[380px] overflow-y-auto text-[11px]"></div>
</div>
</div>
</main>
<script>
const upper="ABCDEFGHIJKLMNOPQRSTUVWXYZ", lower="abcdefghijklmnopqrstuvwxyz", numbers="0123456789", symbols="!@#$%^&*()_+-=[]{}|;:,.<>?";
function generatePwd(){
let len=+document.getElementById('length').value;
let chars="";
if(document.getElementById('upper').checked) chars+=upper;
if(document.getElementById('lower').checked) chars+=lower;
if(document.getElementById('numbers').checked) chars+=numbers;
if(document.getElementById('symbols').checked) chars+=symbols;
if(!chars) chars=lower+numbers;
let avoid=document.getElementById('avoid').checked;
let pwd="";
let arr=new Uint32Array(len); crypto.getRandomValues(arr);
for(let i=0;i<len;i++){ let c=chars[arr[i]%chars.length]; if(avoid && "0O1l".includes(c)) {i--; continue;} pwd+=c; }
document.getElementById('password').textContent=pwd;
strength(pwd);
generateIdeas(pwd);
}
function strength(p){
let score=0;
if(p.length>=12) score+=25; else if(p.length>=8) score+=15;
if(/[A-Z]/.test(p)) score+=15;
if(/[a-z]/.test(p)) score+=15;
if(/[0-9]/.test(p)) score+=15;
if(/[^A-Za-z0-9]/.test(p)) score+=30;
let bar=document.getElementById('strengthBar'), txt=document.getElementById('strengthText');
bar.style.width=score+'%';
if(score<40){txt.textContent='Weak 🔴'; bar.className='h-full bg-red-500 transition-all';}
else if(score<70){txt.textContent='Medium 🟡'; bar.className='h-full bg-yellow-500 transition-all';}
else {txt.textContent='Strong 🟢 Unbreakable'; bar.className='h-full bg-green-500 transition-all';}
}
function generateIdeas(base){
let ideasDiv=document.getElementById('ideas'); ideasDiv.innerHTML='';
let templates=[
`${base}@PK`,`${base}#2025`,`Pak@${base}123`,`${base}Lahore!`,`${base}_Secure`,`${base}123!@#`,`Love@${base}`,`My${base}2025`,`${base}$Strong`,`${base}_Gmail`,`FB_${base}!`,`Easypaisa_${base}`
];
for(let i=0;i<100;i++){
let idea=templates[i%templates.length]+(i>12?i:'');
ideasDiv.innerHTML+=`<div class="flex justify-between bg-white/[0.03] border border-white/5 rounded-lg px-3 py-2"><span class="font-mono truncate">${idea}</span><button onclick="navigator.clipboard.writeText('${idea}')" class="text-purple-300">Copy</button></div>`;
}
}
document.getElementById('length').oninput=e=>{document.getElementById('lenVal').textContent=e.target.value};
document.getElementById('generate').onclick=generatePwd;
document.getElementById('copy').onclick=()=>{navigator.clipboard.writeText(document.getElementById('password').textContent); alert('Copied!')};
generatePwd();
</script>
</body>
</html>
