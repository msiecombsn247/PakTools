<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Strong Password Generator - PakTools</title>
<script src="https://cdn.tailwindcss.com"></script>
<style>
body{background:#020a1f; color:white; font-family:Inter,sans-serif; overflow-x:hidden;}
.galaxy{position:absolute; width:800px; height:800px; border-radius:50%; filter:blur(90px); opacity:.55; animation:float 20s infinite alternate;}
@keyframes float{0%{transform:translate(-10%,-10%)}100%{transform:translate(10%,10%) scale(1.15)}}
.stars{position:absolute; inset:0; pointer-events:none;}
.star{position:absolute; width:2px; height:2px; background:white; border-radius:50%; animation:twinkle 3s infinite;}
.tool-box{background:linear-gradient(145deg,#10205e 0%,#0a1744 40%,#070f30 100%); border:1px solid rgba(59,130,246,0.4); box-shadow:0 0 30px rgba(37,99,235,0.35), inset 0 1px 0 rgba(150,200,255,0.18); backdrop-filter:blur(15px);}
.pass-box{background:rgba(0,0,0,0.4); border:1px solid rgba(56,189,248,0.4); letter-spacing:1px;}
input[type=range]{accent-color:#22d3ee;}
</style>
</head>
<body class="relative min-h-screen">
<div class="galaxy bg-gradient-to-br from-blue-600 via-indigo-700 to-slate-900 top-[-250px] left-[10%]"></div>
<div class="galaxy bg-gradient-to-br from-cyan-700 via-blue-800 to-[#020a1f] bottom-[-300px] right-[5%]"></div>
<div class="stars" id="stars"></div>

<header class="relative z-20 sticky top-0 border-b border-white/10 bg-[#020a1f]/70 backdrop-blur-xl">
<div class="max-w-7xl mx-auto px-6 py-4 flex justify-between items-center">
<a href="index.html" class="font-black text-xl flex items-center gap-2"><div class="w-9 h-9 rounded-lg bg-gradient-to-br from-cyan-400 to-blue-600 flex items-center justify-center">P</div>PakTools</a>
<a href="index.html" class="text-sm bg-white/10 border border-white/20 px-4 py-2 rounded-lg">← Home</a>
</div>
</header>

<main class="relative z-10 max-w-3xl mx-auto px-6 py-12">
<div class="text-center">
<h1 class="text-4xl md:text-5xl font-black">Password <span class="text-transparent bg-clip-text bg-gradient-to-r from-cyan-300 to-blue-400">Generator</span></h1>
<p class="mt-3 text-gray-400">Generate Strong, Secure & Unbreakable Passwords</p>
</div>

<div class="tool-box rounded-[2rem] p-8 md:p-10 mt-10">
<div class="pass-box rounded-xl p-5 flex justify-between items-center">
<span id="password" class="font-mono text-lg md:text-xl font-bold text-cyan-300 select-all">Click Generate</span>
<button onclick="copyPass()" class="bg-cyan-400 text-black px-4 py-2 rounded-lg font-black text-sm hover:bg-cyan-300">Copy</button>
</div>
<div id="strength" class="mt-3 h-2 bg-white/10 rounded-full overflow-hidden"><div id="strengthBar" class="h-full w-0 bg-gradient-to-r from-red-500 to-green-400 transition-all"></div></div>
<p id="strengthText" class="text-xs text-gray-400 mt-1">Strength: -</p>

<div class="mt-8 space-y-5">
<div><label class="text-sm">Length: <span id="lenLabel" class="text-cyan-300 font-bold">16</span></label><input type="range" id="length" min="6" max="64" value="16" class="w-full mt-2" oninput="document.getElementById('lenLabel').innerText=this.value; generate()"></div>
<div class="grid grid-cols-2 gap-4 text-sm">
<label class="flex items-center gap-2"><input type="checkbox" id="upper" checked class="accent-cyan-400"> Uppercase (A-Z)</label>
<label class="flex items-center gap-2"><input type="checkbox" id="lower" checked class="accent-cyan-400"> Lowercase (a-z)</label>
<label class="flex items-center gap-2"><input type="checkbox" id="numbers" checked class="accent-cyan-400"> Numbers (0-9)</label>
<label class="flex items-center gap-2"><input type="checkbox" id="symbols" checked class="accent-cyan-400"> Symbols (!@#$)</label>
</div>
<button onclick="generate()" class="w-full bg-gradient-to-r from-cyan-400 to-blue-600 text-black font-black py-4 rounded-xl shadow-[0_0_20px_rgba(56,189,248,0.5)]">🔐 Generate Strong Password</button>
</div>
</div>
</main>

<script>
const stars=document.getElementById('stars');
for(let i=0;i<150;i++){let d=document.createElement('div');d.className='star';d.style.left=Math.random()*100+'%';d.style.top=Math.random()*100+'%';d.style.animationDelay=Math.random()*3+'s';stars.appendChild(d);}

function generate(){
let len=parseInt(document.getElementById('length').value);
let upper=document.getElementById('upper').checked, lower=document.getElementById('lower').checked, num=document.getElementById('numbers').checked, sym=document.getElementById('symbols').checked;
let chars=''; if(upper) chars+='ABCDEFGHIJKLMNOPQRSTUVWXYZ'; if(lower) chars+='abcdefghijklmnopqrstuvwxyz'; if(num) chars+='0123456789'; if(sym) chars+='!@#$%^&*()_+-=[]{}|;:,.<>?';
if(!chars){alert('Select at least one option'); return;}
let pass=''; for(let i=0;i<len;i++){pass+=chars.charAt(Math.floor(Math.random()*chars.length));}
document.getElementById('password').innerText=pass;
let score=0; if(len>=12)score+=25; if(len>=16)score+=25; if(upper)score+=10; if(lower)score+=10; if(num)score+=15; if(sym)score+=15;
document.getElementById('strengthBar').style.width=score+'%';
let txt=score<40?'Weak':score<70?'Medium':'Strong'; document.getElementById('strengthText').innerText='Strength: '+txt;
}
function copyPass(){
let p=document.getElementById('password').innerText;
if(p=='Click Generate'){alert('Generate first'); return;}
navigator.clipboard.writeText(p); alert('Password Copied! ✅');
}
generate();
</script>
</body>
</html>
