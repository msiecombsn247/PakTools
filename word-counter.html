<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Word Counter</title><script src="https://cdn.tailwindcss.com"></script></head><body style="background:#0b1220" class="p-6"><a href="index.html" style="background:white" class="px-5 py-2 rounded-full font-bold">← Back</a><div class="max-w-2xl mx-auto bg-white rounded-[2rem] p-8 mt-6"><h1 class="text-3xl font-black text-center">Word Counter</h1><textarea id="txt" class="w-full h-40 border-2 p-4 rounded-xl mt-6" placeholder="Type here..."></textarea><p class="mt-4 font-bold">Words: <span id="w">0</span> | Chars: <span id="c">0</span></p></div><script>txt.addEventListener("input",()=>{w.innerText=txt.value.trim()?txt.value.trim().split(/\s+/).length:0;c.innerText=txt.value.length})</script></body></html>
