<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Word Counter - Character Counter - PakTools</title>
<script src="https://cdn.tailwindcss.com"></script>
<style>
body{background:#020a1f; color:white; font-family:Inter,sans-serif; overflow-x:hidden;}
.galaxy{position:absolute; width:800px; height:800px; border-radius:50%; filter:blur(90px); opacity:.55; animation:float 20s infinite alternate;}
@keyframes float{0%{transform:translate(-10%,-10%)}100%{transform:translate(10%,10%) scale(1.15)}}
.stars{position:absolute; inset:0; pointer-events:none;}
.star{position:absolute; width:2px; height:2px; background:white; border-radius:50%; animation:twinkle 3s infinite;}
.tool-box{background:linear-gradient(145deg,#10205e 0%,#0a1744 40%,#070f30 100%); border:1px solid rgba(59,130,246,0.4); box-shadow:0 0 30px rgba(37,99,235,0.35), inset 0 1px 0 rgba(150,200,255,0.18); backdrop-filter:blur(15px);}
textarea{background:rgba(0,0,0,0.35); border:1px solid rgba(59,130,246,0.3);}
textarea:focus{border-color:#22d3ee; box-shadow:0 0 15px rgba(34,211,238,0.25); outline:none;}
.stat{background:rgba(255,255,255,0.06); border:1px solid rgba(255,255,255,0.08);}
</style>
</head>
<body class="relative min-h-screen">
<div class="galaxy bg-gradient-to-br from-blue-600 via-indigo-700 to-slate-900 top-[-250px] left-[10%]"></div>
<div class="galaxy bg-gradient-to-br from-cyan-700 via-blue-800 to-[#020a1f] bottom-[-300px] right-[5%]"></div>
<div class="stars" id="stars"></div>

<header class="relative z-20 sticky top-0 border-b border-white/10 bg-[#020a1f]/70 backdrop-blur-xl">
<div class="max-w-7xl mx-auto px-6 py-4 flex justify-between items-center">
<a href="index.html" class="font-black text-xl flex items-center gap-2"><div class="w-9 h-9 rounded-lg bg-gradient-to-br from-cyan-400 to-blue-600 flex items-center justify-center">P</div>PakTools</a>
<a href="index.html" class="text-sm bg-white/10 border border-white/20 px-4 py-2 rounded-lg">← Home</a>
</div>
</header>

<main class="relative z-10 max-w-5xl mx-auto px-6 py-12">
<div class="text-center">
<h1 class="text-4xl md:text-5xl font-black">Word <span class="text-transparent bg-clip-text bg-gradient-to-r from-cyan-300 to-blue-400">Counter</span></h1>
<p class="mt-3 text-gray-400">Count Words, Characters, Sentences Instantly</p>
</div>

<div class="tool-box rounded-[2rem] p-8 md:p-10 mt-10">
<div class="grid grid-cols-2 md:grid-cols-4 gap-4 mb-6">
<div class="stat rounded-xl p-4 text-center"><p class="text-2xl font-black text-cyan-300" id="words">0</p><p class="text-xs text-gray-400 mt-1">Words</p></div>
<div class="stat rounded-xl p-4 text-center"><p class="text-2xl font-black text-blue-400" id="chars">0</p><p class="text-xs text-gray-400 mt-1">Characters</p></div>
<div class="stat rounded-xl p-4 text-center"><p class="text-2xl font-black text-indigo-300" id="charsNoSpace">0</p><p class="text-xs text-gray-400 mt-1">No Spaces</p></div>
<div class="stat rounded-xl p-4 text-center"><p class="text-2xl font-black text-cyan-200" id="sentences">0</p><p class="text-xs text-gray-400 mt-1">Sentences</p></div>
</div>

<textarea id="textInput" rows="12" placeholder="Type or paste your text here..." class="w-full rounded-xl p-5 text-sm leading-6" oninput="count()"></textarea>

<div class="flex gap-3 mt-4">
<button onclick="clearText()" class="bg-white/10 border border-white/10 px-5 py-2.5 rounded-xl text-sm">Clear</button>
<button onclick="copyText()" class="bg-white/10 border border-cyan-400/30 px-5 py-2.5 rounded-xl text-sm font-bold">📋 Copy</button>
<button onclick="upper()" class="bg-white/10 border border-white/10 px-5 py-2.5 rounded-xl text-sm">UPPERCASE</button>
<button onclick="lower()" class="bg-white/10 border border-white/10 px-5 py-2.5 rounded-xl text-sm">lowercase</button>
</div>
</div>
</main>

<script>
const stars=document.getElementById('stars');
for(let i=0;i<150;i++){let d=document.createElement('div');d.className='star';d.style.left=Math.random()*100+'%';d.style.top=Math.random()*100+'%';d.style.animationDelay=Math.random()*3+'s';stars.appendChild(d);}

function count(){
let t=document.getElementById('textInput').value;
document.getElementById('words').innerText=t.trim()?t.trim().split(/\s+/).length:0;
document.getElementById('chars').innerText=t.length;
document.getElementById('charsNoSpace').innerText=t.replace(/\s/g,'').length;
document.getElementById('sentences').innerText=t.split(/[.!?]+/).filter(s=>s.trim().length>0).length;
}
function clearText(){document.getElementById('textInput').value=''; count();}
function copyText(){navigator.clipboard.writeText(document.getElementById('textInput').value); alert('Copied!');}
function upper(){let el=document.getElementById('textInput'); el.value=el.value.toUpperCase(); count();}
function lower(){let el=document.getElementById('textInput'); el.value=el.value.toLowerCase(); count();}
</script>
</body>
</html>
