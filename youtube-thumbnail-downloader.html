<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>YT Thumbnail</title><script src="https://cdn.tailwindcss.com"></script></head><body class="bg-[#0b1220] p-6"><a href="index.html" class="bg-white px-5 py-2 rounded-full font-bold">← Back</a><div class="max-w-xl mx-auto bg-white rounded-[2rem] p-8 mt-6 text-center"><h1 class="text-3xl font-black">YT Thumbnail Downloader</h1><p class="text-gray-500">Download HD</p><input id="link" placeholder="Paste Youtube Link here" class="w-full border-2 p-3 rounded-xl mt-6"><button onclick="getThumb()" class="w-full bg-red-600 text-white py-3 rounded-xl mt-4 font-bold">Get Thumbnail</button><img id="img" class="mt-6 rounded-xl w-full hidden"><a id="down" target="_blank" class="hidden bg-black text-white px-6 py-2 rounded-full mt-4 inline-block">Download HD</a></div><script>function getThumb(){let url=link.value;let id=url.split("v=")[1];if(!id)id=url.split("/").pop();if(id.includes("&"))id=id.split("&")[0];if(!id)return alert("Valid Link Paste Karo");let thumb=`https://img.youtube.com/vi/${id}/maxresdefault.jpg`;img.src=thumb;img.classList.remove("hidden");down.href=thumb;down.classList.remove("hidden")}</script></body></html>
