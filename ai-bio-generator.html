<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>AI Bio Generator - 100+ Instagram, TikTok Bio Ideas Pakistan | PakTools</title>
<meta name="description" content="100+ AI Bio Generator Pakistan - Instagram bio, Facebook bio, TikTok bio, PUBG bio, WhatsApp about. Funny, Attitude, Stylish, Professional. 100% working, copy paste.">
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@800&family=Inter:wght@400;600&display=swap" rel="stylesheet">
</head>
<body style="background:#07010f;color:white;font-family:Inter,sans-serif">
<div style="position:fixed;inset:0;background:radial-gradient(ellipse at 30% 20%, rgba(120,40,200,0.15), transparent 50%), radial-gradient(ellipse at 80% 80%, rgba(200,40,120,0.1), transparent 50%);z-index:0"></div>
<header class="sticky top-0 z-20 border-b border-white/10 bg-[#07010f]/80 backdrop-blur-xl"><div class="max-w-6xl mx-auto px-6 py-4 flex justify-between items-center"><a href="index.html" style="text-decoration:none;color:white" class="font-black text-xl flex gap-2 items-center"><div class="w-8 h-8 rounded-lg bg-gradient-to-br from-purple-400 to-purple-700 flex items-center justify-center">P</div>PakTools</a><a href="blog.html" style="color:white;text-decoration:none" class="text-[11px] bg-white/10 border border-white/20 px-4 py-2 rounded-full">Blogs</a></div></header>
<main class="max-w-6xl mx-auto px-6 py-8 relative z-10">
<h1 style="font-family:'Plus Jakarta Sans'" class="text-3xl md:text-5xl font-black">AI Bio Generator - 100+ Bios</h1>
<p class="text-gray-400 text-[12px] mt-2">Instagram | Facebook | TikTok | PUBG | LinkedIn | WhatsApp - Attitude, Funny, Stylish, Sad, Professional</p>

<div class="mt-6 grid lg:grid-cols-4 gap-3 bg-white/[0.04] border border-white/10 rounded-[20px] p-4">
<input id="nameInput" placeholder="Your Name e.g. Ali" class="bg-white/[0.06] border border-white/15 rounded-full px-5 py-3 text-[13px] outline-none">
<input id="interestInput" placeholder="Interest e.g. Cricket, Gaming" class="bg-white/[0.06] border border-white/15 rounded-full px-5 py-3 text-[13px] outline-none">
<select id="platform" class="bg-[#1a0f2e] border border-white/15 rounded-full px-5 py-3 text-[13px] outline-none"><option>Instagram</option><option>Facebook</option><option>TikTok</option><option>PUBG / Free Fire</option><option>LinkedIn</option><option>WhatsApp</option><option>Twitter / X</option></select>
<select id="vibe" class="bg-[#1a0f2e] border border-white/15 rounded-full px-5 py-3 text-[13px] outline-none"><option>Attitude 😎</option><option>Funny 😂</option><option>Stylish ✨</option><option>Sad 💔</option><option>Professional 💼</option><option>Love ❤️</option><option>Islamic ☪️</option><option>Cool 😏</option></select>
</div>
<button id="generateBtn" class="w-full mt-4 py-3 bg-gradient-to-r from-purple-500 to-fuchsia-500 rounded-full font-bold text-[13px]">Generate 100+ Bios →</button>

<div id="biosGrid" class="mt-8 grid md:grid-cols-2 gap-3"></div>
</main>
<script>
const biosData={
"Attitude 😎":["{name} | Rule breaker 😎 | {interest} lover","I don't follow trends, I make them 🔥 {name}","Attitude is my middle name - {name} 💯","Born to express, not to impress - {name}","{name} | Silence is my attitude | {interest}","King {name} 👑 | {interest} addict","No love, only {interest} & goals - {name}","{name} - 100% attitude, 0% fake","I'm not special, I'm limited edition - {name}","{name} | Living life on my own terms"],
"Funny 😂":["{name} | Professional overthinker 😂 | {interest}","My bio is under construction 🚧 - {name}","{name} | {interest} expert (in my dreams)","I followed a diet for 2 weeks, lost 14 days - {name} 😂","{name} | Charging... 1% {interest} 99% laziness","Born to be awesome, forced to study - {name}","{name} | {interest} + Biryani = Life","Error 404: Bio not found - {name}","{name} | Making {interest} funny since 2026","Sarcasm is my superpower - {name} 😜"],
"Stylish ✨":["✨ {name} ✨ | {interest} vibes only","꧁༒ {name} ༒꧂ | {interest}","『{name}』 | Stylish since birth ✨","{name} | 🖤 {interest} 🖤","🌙 {name} | {interest} soul","{name} | 𝕊𝕥𝕪𝕝𝕚𝕤𝕙 𝕜𝕚𝕟𝕘/𝕢𝕦𝕖𝕖𝕟 ✨","{name} | Dream • Believe • {interest}","{name} | Aesthetic + {interest} = Me","{name} | Classy & {interest} obsessed ✨","{name} | Shine like a star ⭐ {interest}"],
"Sad 💔":["{name} | Broken but still breathing 💔 {interest}","Alone but happy with {interest} - {name}","{name} | Trust hurts 💔","Smile in face, tears in heart - {name}","{name} | Lost in {interest}","No feelings, only {interest} - {name} 💔","{name} | Hurt but healing with {interest}","Fake smile, real pain - {name}","{name} | Left alone with {interest}","Heart broken, {interest} not - {name}"],
"Professional 💼":["{name} | {interest} Specialist | Pakistan","Helping brands with {interest} | {name} | DM for collab","{name} | {interest} Enthusiast | Learner","Professional {interest} | {name} | Available for projects","{name} | {interest} | Building future","Entrepreneur | {interest} | {name} | Lahore, PK","{name} | Passionate about {interest} | Open to work","{name} | {interest} Creator | Content | Pakistan","Digital Creator | {interest} | {name}","{name} | {interest} | Growth Mindset 💼"],
"Love ❤️":["{name} | {interest} + Love = Life ❤️","Love {interest}, Live {interest} - {name}","{name} | Heart full of {interest} ❤️","{name} | In love with {interest}","{name} | {interest} is my love language ❤️","{name} | My heart beats for {interest}","{name} | Forever {interest} lover ❤️","{name} | {interest} & Chill ❤️","{name} | Love you {interest}","{name} ❤️ {interest}"],
"Islamic ☪️":["{name} | Alhamdulillah for everything ☪️ {interest}","{name} | Allah is enough for me | {interest}","{name} | Pray • {interest} • Repeat ☪️","{name} | {interest} with Iman","{name} | Ya Allah guide me | {interest}","{name} | Muslim | {interest} lover ☪️","{name} | Deen + {interest} = Life","{name} | Alhamdulillah | {interest}","{name} | Trust Allah | Love {interest}","{name} | ☪️ {interest}"],
"Cool 😏":["{name} | {interest} on my mind 😏","Chill vibes - {name} | {interest}","{name} | Just {interest} things 😏","Too cool for bio - {name} | {interest}","{name} | {interest} mode: ON","{name} | Keep calm & {interest}","{name} | {interest} addict 😏","Vibe with {interest} - {name}","{name} | {interest} is life","{name} | Smooth like {interest} 😎"]
};
function generate(){
const name=document.getElementById('nameInput').value||"Ali";
const interest=document.getElementById('interestInput').value||"Cricket";
const vibe=document.getElementById('vibe').value;
const platform=document.getElementById('platform').value;
const grid=document.getElementById('biosGrid');
grid.innerHTML='';
let templates=biosData[vibe]||biosData["Attitude 😎"];
let allBios=[];
// 10 base + 90 variations = 100+
for(let i=0;i<10;i++){ allBios.push(templates[i].replaceAll('{name}',name).replaceAll('{interest}',interest)); }
// generate 90 more by mixing
for(let i=10;i<110;i++){
let base=templates[i%templates.length];
let extra=[" 🔥"," ✨"," 💯"," | PK"," | Lahore"," | Pakistan"," | Official"," 😎"," 💥","™"];
let bio=base.replaceAll('{name}',name).replaceAll('{interest}',interest)+extra[i%extra.length];
if(platform.includes("LinkedIn")) bio=bio.replace(/🔥|✨|😎|💥/g,'').trim();
if(platform.includes("PUBG")) bio="亗 "+bio+" 亗";
allBios.push(bio);
}
allBios.forEach((bio,idx)=>{
grid.innerHTML+=`<div class="bg-white/[0.05] border border-white/10 rounded-xl p-4 flex justify-between gap-3 hover:border-purple-500/40"><div><div class="text-[10px] text-purple-300 font-bold">BIO ${idx+1} • ${platform}</div><div class="text-[13px] mt-1 leading-6">${bio}</div></div><button onclick="copyBio(\`${bio.replace(/`/g,'')}\`)" class="h-fit px-3 py-1.5 bg-white text-black rounded-full text-[11px] font-bold">Copy</button></div>`;
});
}
document.getElementById('generateBtn').onclick=generate;
window.copyBio=t=>{navigator.clipboard.writeText(t); alert('Copied: '+t)}
generate();
</script>
</body>
</html>
