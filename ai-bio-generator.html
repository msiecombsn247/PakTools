<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>AI Bio Generator - Instagram Bio - PakTools</title>
<script src="https://cdn.tailwindcss.com"></script>
<style>
body{background:#020a1f; color:white; font-family:Inter,sans-serif; overflow-x:hidden;}
.galaxy{position:absolute; width:800px; height:800px; border-radius:50%; filter:blur(90px); opacity:.55; animation:float 20s infinite alternate;}
@keyframes float{0%{transform:translate(-10%,-10%)}100%{transform:translate(10%,10%) scale(1.15)}}
.stars{position:absolute; inset:0; pointer-events:none;}
.star{position:absolute; width:2px; height:2px; background:white; border-radius:50%; animation:twinkle 3s infinite;}
.tool-box{background:linear-gradient(145deg,#10205e 0%,#0a1744 40%,#070f30 100%); border:1px solid rgba(59,130,246,0.4); box-shadow:0 0 30px rgba(37,99,235,0.35), inset 0 1px 0 rgba(150,200,255,0.18); backdrop-filter:blur(15px);}
.input-box{background:rgba(0,0,0,0.35); border:1px solid rgba(59,130,246,0.3);}
.bio-card{background:rgba(255,255,255,0.06); border:1px solid rgba(255,255,255,0.08);}
.bio-card:hover{border-color:rgba(56,189,248,0.5); background:rgba(56,189,248,0.08);}
</style>
</head>
<body class="relative min-h-screen">
<div class="galaxy bg-gradient-to-br from-blue-600 via-indigo-700 to-slate-900 top-[-250px] left-[10%]"></div>
<div class="galaxy bg-gradient-to-br from-cyan-700 via-blue-800 to-[#020a1f] bottom-[-300px] right-[5%]"></div>
<div class="stars" id="stars"></div>

<header class="relative z-20 sticky top-0 border-b border-white/10 bg-[#020a1f]/70 backdrop-blur-xl">
<div class="max-w-7xl mx-auto px-6 py-4 flex justify-between items-center">
<a href="index.html" class="font-black text-xl flex items-center gap-2"><div class="w-9 h-9 rounded-lg bg-gradient-to-br from-cyan-400 to-blue-600 flex items-center justify-center">P</div>PakTools</a>
<a href="index.html" class="text-sm bg-white/10 border border-white/20 px-4 py-2 rounded-lg">← Home</a>
</div>
</header>

<main class="relative z-10 max-w-5xl mx-auto px-6 py-12">
<div class="text-center">
<h1 class="text-4xl md:text-5xl font-black">AI Bio <span class="text-transparent bg-clip-text bg-gradient-to-r from-cyan-300 to-blue-400">Generator</span></h1>
<p class="mt-3 text-gray-400">Generate Viral Instagram, TikTok, LinkedIn Bios with AI</p>
</div>

<div class="tool-box rounded-[2rem] p-8 md:p-10 mt-10">
<div class="grid md:grid-cols-3 gap-4">
<input id="name" type="text" placeholder="Your Name / Profession e.g. Sajid, Developer" class="input-box rounded-xl p-4 text-sm outline-none">
<select id="platform" class="input-box rounded-xl p-4 text-sm outline-none"><option>Instagram</option><option>TikTok</option><option>LinkedIn</option><option>YouTube</option><option>Twitter</option><option>Facebook</option></select>
<select id="vibe" class="input-box rounded-xl p-4 text-sm outline-none"><option>Cool & Stylish 😎</option><option>Professional 💼</option><option>Funny 😂</option><option>Attitude 🔥</option><option>Aesthetic ✨</option><option>Sad / Urdu 🖤</option></select>
</div>
<button onclick="genBio()" class="w-full mt-6 bg-gradient-to-r from-cyan-400 to-blue-600 text-black font-black py-4 rounded-xl shadow-[0_0_20px_rgba(56,189,248,0.5)]">🤖 Generate 6 Bios</button>

<div id="bios" class="hidden grid md:grid-cols-2 gap-4 mt-8"></div>
<p id="placeholder" class="text-center text-gray-500 mt-10 text-sm">Your bios will appear here</p>
</div>
</main>

<script>
const stars=document.getElementById('stars');
for(let i=0;i<150;i++){let d=document.createElement('div');d.className='star';d.style.left=Math.random()*100+'%';d.style.top=Math.random()*100+'%';d.style.animationDelay=Math.random()*3+'s';stars.appendChild(d);}

const templates={
"Cool & Stylish 😎":["{name} | Dreamer | Creator ✨","Living my story 📖 | {platform} vibes","Code. Coffee. Repeat ☕ | {name}","Stay real, stay {vibe} 💫","{name} 🌙 | Night thinker"],
"Professional 💼":["{name} | {platform} Growth Expert | Helping brands grow","Developer | Creator | Entrepreneur - {name}","Building digital future | {name}","{name} | 5+ Years in {platform} Marketing"],
"Funny 😂":["Probably sleeping 😴 | {name}","CEO of doing nothing but still busy | {name}","Battery low, but vibes high 🔋 {name}"],
"Attitude 🔥":["Not lucky, just worth it 👑 {name}","Silent but deadly ⚡ {name}","Legends like {name} never follow trends"],
"Aesthetic ✨":["🌙 moonchild | {name} | {platform} soul","soft heart, sharp mind | {name}","✨ {name} - lost in {platform} world"],
"Sad / Urdu 🖤":["دل میں کچھ تو ہے 🖤 | {name}","تنہائی بہتر ہے | {name}","خاموشیاں بہتر ہیں لفظوں سے | {name}"]
};

function genBio(){
let name=document.getElementById('name').value||'PakTools';
let platform=document.getElementById('platform').value;
let vibe=document.getElementById('vibe').value;
let list=templates[vibe]||templates["Cool & Stylish 😎"];
let container=document.getElementById('bios'); container.innerHTML=''; container.classList.remove('hidden');
document.getElementById('placeholder').classList.add('hidden');
list.forEach(t=>{
let bio=t.replace(/{name}/g,name).replace(/{platform}/g,platform).replace(/{vibe}/g,vibe);
let div=document.createElement('div'); div.className='bio-card rounded-xl p-4 flex justify-between items-start gap-3';
div.innerHTML=`<p class="text-sm leading-6">${bio}</p><button onclick="navigator.clipboard.writeText('${bio.replace(/'/g,"\\'")}'); this.innerText='Copied!'; setTimeout(()=>this.innerText='Copy',1000)" class="text-xs bg-cyan-400 text-black px-3 py-1.5 rounded-lg font-bold shrink-0">Copy</button>`;
container.appendChild(div);
});
}
</script>
</body>
</html>
