<!DOCTYPE html>
<html>
<head>
<title>PakSheet - Simple Excel Clone</title>
<script src="https://cdn.tailwindcss.com"></script>
<style>
table{border-collapse:collapse;width:100%}
td,th{border:1px solid #333;min-width:80px;height:25px}
td{padding:2px}
td input{width:100%;height:100%;border:none;outline:none;background:transparent;color:white;font-size:13px;padding:2px}
th{background:#1a1a2e;color:#a855f7;font-size:12px;position:sticky;top:0}
tr th:first-child{background:#16213e;width:40px}
.selected{background:#2d1b4e!important}
body{background:#07010f;color:white;margin:0;font-family:sans-serif}
</style>
</head>
<body>
<div class="p-3 flex justify-between items-center bg-[#0f0a1e] border-b border-white/10">
<h1 class="font-black text-lg">📊 PakSheet - Excel Clone</h1>
<div class="flex gap-2">
<button onclick="exportCSV()" class="bg-green-600 px-4 py-1.5 rounded-full text-xs font-bold">Export CSV</button>
<button onclick="saveData()" class="bg-purple-600 px-4 py-1.5 rounded-full text-xs font-bold">Save</button>
<button onclick="clearAll()" class="bg-white/10 px-4 py-1.5 rounded-full text-xs">Clear</button>
</div>
</div>
<div class="p-2 text-[11px] text-gray-400">Formula support: =A1+B1, =SUM(A1:A10), =AVG(A1:A5)</div>
<div class="overflow-auto h-[85vh]" id="sheetWrap"></div>

<script>
const ROWS=100, COLS=26;
let data=JSON.parse(localStorage.getItem('paksheet')||'{}');

function colName(n){let s='';while(n>=0){s=String.fromCharCode(n%26+65)+s;n=Math.floor(n/26)-1}return s}

function createSheet(){
let html='<table><tr><th></th>';
for(let c=0;c<COLS;c++) html+=`<th>${colName(c)}</th>`;
html+='</tr>';
for(let r=1;r<=ROWS;r++){
html+=`<tr><th>${r}</th>`;
for(let c=0;c<COLS;c++){
let id=colName(c)+r;
html+=`<td id="td_${id}"><input id="${id}" value="${data[id]||''}" onfocus="sel('${id}')" oninput="calc()"></td>`;
}
html+='</tr>';
}
html+='</table>';
document.getElementById('sheetWrap').innerHTML=html;
}

function sel(id){
document.querySelectorAll('td').forEach(t=>t.classList.remove('selected'));
document.getElementById('td_'+id).classList.add('selected');
}

function getVal(id){
let v=document.getElementById(id)?.value||'';
if(v.startsWith('=')){
try{
v=v.substring(1).replace(/([A-Z]+[0-9]+)/g, m=>{
let el=document.getElementById(m);
return el? (parseFloat(el.value)||0) : 0;
});
if(v.toUpperCase().startsWith('SUM(')){
let range=v.match(/\((.*):(.*)\)/);
if(range){let s=range[1], e=range[2]; /* simple sum logic skip */}
}
return eval(v);
}catch(e){return '#ERR'}
}
return isNaN(v)? v : parseFloat(v);
}

function calc(){
// Auto calc handled in getVal
}

function saveData(){
let obj={};
for(let r=1;r<=ROWS;r++) for(let c=0;c<COLS;c++){
let id=colName(c)+r;
let v=document.getElementById(id)?.value;
if(v) obj[id]=v;
}
localStorage.setItem('paksheet',JSON.stringify(obj));
alert('Saved!');
}

function clearAll(){if(confirm('Clear all?')){localStorage.removeItem('paksheet');location.reload()}}

function exportCSV(){
let csv='';
for(let r=1;r<=ROWS;r++){
let row=[];
for(let c=0;c<COLS;c++){
let id=colName(c)+r;
row.push(document.getElementById(id)?.value||'');
}
if(row.join('').trim()!='') csv+=row.join(',')+'\n';
}
let blob=new Blob([csv],{type:'text/csv'});
let a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='paksheet.csv';a.click();
}

createSheet();
</script>
</body>
</html>
