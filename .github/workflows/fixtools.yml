name: Fix All Tools - Coming Soon Remove
on:
  workflow_dispatch:
jobs:
  fix:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Restore All Tools
        run: |
          cat > word-counter.html << 'EOF'
          <!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Word Counter - PakTools</title><script src="https://cdn.tailwindcss.com"></script><style>body{background:#0b1220;min-height:100vh}</style></head><body class="p-6"><a href="index.html" class="bg-white px-5 py-2 rounded-full font-bold mb-6 inline-block">← Back</a><div class="max-w-2xl mx-auto bg-white rounded-[2rem] p-8 shadow-2xl"><h1 class="text-3xl font-black text-center">Word Counter</h1><textarea id="txt" class="w-full h-40 border-2 p-4 rounded-xl mt-6" placeholder="Type here..."></textarea><div class="grid grid-cols-3 gap-3 mt-4"><div class="bg-blue-50 p-4 rounded-xl text-center"><b id="w">0</b><p class="text-xs">Words</p></div><div class="bg-violet-50 p-4 rounded-xl text-center"><b id="c">0</b><p class="text-xs">Chars</p></div><div class="bg-pink-50 p-4 rounded-xl text-center"><b id="l">0</b><p class="text-xs">Lines</p></div></div></div><script>txt=document.getElementById("txt");txt.addEventListener("input",()=>{let t=txt.value;document.getElementById("w").innerText=t.trim()?t.trim().split(/\s+/).length:0;document.getElementById("c").innerText=t.length;document.getElementById("l").innerText=t?t.split("\n").length:0})</script></body></html>
          EOF
          cat > qr-code-generator.html << 'EOF'
          <!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>QR Generator - PakTools</title><script src="https://cdn.tailwindcss.com"></script><style>body{background:#0b1220;min-height:100vh}</style></head><body class="p-6"><a href="index.html" class="bg-white px-5 py-2 rounded-full font-bold mb-6 inline-block">← Back</a><div class="max-w-2xl mx-auto bg-white rounded-[2rem] p-8 shadow-2xl text-center"><h1 class="text-3xl font-black">QR Generator</h1><input id="qrtext" class="w-full border-2 p-4 rounded-xl mt-6" placeholder="Enter text or link"><button onclick="genQR()" class="w-full mt-4 bg-blue-600 text-white p-4 rounded-xl font-bold">Generate QR</button><div id="qrcode" class="flex justify-center mt-6"></div></div><script>function genQR(){document.getElementById("qrcode").innerHTML="";let s=document.createElement("script");s.src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js";s.onload=()=>{new QRCode(document.getElementById("qrcode"),document.getElementById("qrtext").value)};document.body.appendChild(s)}</script></body></html>
          EOF
          cat > password-generator.html << 'EOF'
          <!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Password - PakTools</title><script src="https://cdn.tailwindcss.com"></script><style>body{background:#0b1220;min-height:100vh}</style></head><body class="p-6"><a href="index.html" class="bg-white px-5 py-2 rounded-full font-bold mb-6 inline-block">← Back</a><div class="max-w-2xl mx-auto bg-white rounded-[2rem] p-8 shadow-2xl"><h1 class="text-3xl font-black text-center">Password Generator</h1><div class="flex gap-2 mt-6"><input id="pass" class="flex-1 border-2 p-4 rounded-xl" readonly><button onclick="navigator.clipboard.writeText(pass.value);alert('Copied')" class="bg-slate-900 text-white px-6 rounded-xl">Copy</button></div><button onclick="genPass()" class="w-full mt-4 bg-violet-600 text-white p-4 rounded-xl font-bold">Generate Strong Password</button></div><script>function genPass(){let c="ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789!@#$%^&*";let p="";for(let i=0;i<16;i++)p+=c[Math.floor(Math.random()*c.length)];document.getElementById("pass").value=p}genPass()</script></body></html>
          EOF
          cat > fancy-text-generator.html << 'EOF'
          <!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Fancy Text - PakTools</title><script src="https://cdn.tailwindcss.com"></script><style>body{background:#0b1220;min-height:100vh}</style></head><body class="p-6"><a href="index.html" class="bg-white px-5 py-2 rounded-full font-bold mb-6 inline-block">← Back</a><div class="max-w-2xl mx-auto bg-white rounded-[2rem] p-8 shadow-2xl"><h1 class="text-3xl font-black text-center">Fancy Text Generator</h1><textarea id="ftxt" class="w-full border-2 p-4 rounded-xl mt-6">Muhammad Sajid</textarea><button onclick="document.getElementById('out').innerHTML=`<div class='p-3 bg-slate-50 rounded-xl mt-2'>${ftxt.value} 🔥</div><div class='p-3 bg-slate-50 rounded-xl mt-2'>𝓜𝓾𝓱𝓪𝓶𝓪𝓭 ${ftxt.value}</div>`" class="w-full mt-4 bg-pink-600 text-white p-4 rounded-xl font-bold">Generate</button><div id="out" class="mt-4"></div></div></body></html>
          EOF
          cat > hashtag-generator.html << 'EOF'
          <!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Hashtag - PakTools</title><script src="https://cdn.tailwindcss.com"></script><style>body{background:#0b1220;min-height:100vh}</style></head><body class="p-6"><a href="index.html" class="bg-white px-5 py-2 rounded-full font-bold mb-6 inline-block">← Back</a><div class="max-w-2xl mx-auto bg-white rounded-[2rem] p-8 shadow-2xl"><h1 class="text-3xl font-black text-center">Hashtag Generator</h1><input id="htag" class="w-full border-2 p-4 rounded-xl mt-6" placeholder="Enter topic e.g cricket"><button onclick="document.getElementById('hout').innerText=`#${htag.value} #${htag.value}viral #${htag.value}love #trending #pakistan #instagood #${htag.value}2026`" class="w-full mt-4 bg-orange-500 text-white p-4 rounded-xl font-bold">Generate</button><div id="hout" class="mt-4 bg-slate-50 p-4 rounded-xl"></div></div></body></html>
          EOF
          cat > ai-bio-generator.html << 'EOF'
          <!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>AI Bio - PakTools</title><script src="https://cdn.tailwindcss.com"></script><style>body{background:#0b1220;min-height:100vh}</style></head><body class="p-6"><a href="index.html" class="bg-white px-5 py-2 rounded-full font-bold mb-6 inline-block">← Back</a><div class="max-w-2xl mx-auto bg-white rounded-[2rem] p-8 shadow-2xl"><h1 class="text-3xl font-black text-center">AI Bio Generator</h1><input id="bioname" class="w-full border-2 p-4 rounded-xl mt-6" placeholder="Your name"><button onclick="document.getElementById('bout').innerText=`✨ ${bioname.value} | Dreamer | Creator | Pakistan ❤️ | ${bioname.value} vibes only | PakTools.pk`" class="w-full mt-4 bg-cyan-600 text-white p-4 rounded-xl font-bold">Generate Bio</button><div id="bout" class="mt-4 bg-slate-50 p-4 rounded-xl"></div></div></body></html>
          EOF
          cat > age-calculator.html << 'EOF'
          <!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Age Calculator - PakTools</title><script src="https://cdn.tailwindcss.com"></script><style>body{background:#0b1220;min-height:100vh}</style></head><body class="p-6"><a href="index.html" class="bg-white px-5 py-2 rounded-full font-bold mb-6 inline-block">← Back</a><div class="max-w-2xl mx-auto bg-white rounded-[2rem] p-8 shadow-2xl text-center"><h1 class="text-3xl font-black">Age Calculator</h1><input id="dob" type="date" class="w-full border-2 p-4 rounded-xl mt-6"><button onclick="let d=new Date(dob.value);let a=new Date(Date.now()-d);document.getElementById('aout').innerText=`You are ${Math.abs(a.getUTCFullYear()-1970)} years old`" class="w-full mt-4 bg-emerald-600 text-white p-4 rounded-xl font-bold">Calculate</button><div id="aout" class="mt-6 text-2xl font-bold"></div></div></body></html>
          EOF
          cat > image-compressor.html << 'EOF'
          <!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Image Compressor - PakTools</title><script src="https://cdn.tailwindcss.com"></script><style>body{background:#0b1220;min-height:100vh}</style></head><body class="p-6"><a href="index.html" class="bg-white px-5 py-2 rounded-full font-bold mb-6 inline-block">← Back</a><div class="max-w-2xl mx-auto bg-white rounded-[2rem] p-8 shadow-2xl"><h1 class="text-3xl font-black text-center">Image Compressor</h1><input type="file" id="imgfile" accept="image/*" class="w-full mt-6 border-2 p-4 rounded-xl"><button onclick="compress()" class="w-full mt-4 bg-amber-500 text-white p-4 rounded-xl font-bold">Compress to 20KB</button><div id="cout" class="mt-4"></div></div><script>function compress(){let f=document.getElementById("imgfile").files[0];let i=new Image();i.onload=()=>{let c=document.createElement("canvas");c.width=i.width*0.6;c.height=i.height*0.6;c.getContext("2d").drawImage(i,0,0,c.width,c.height);let a=document.createElement("a");a.download="paktools-compressed.jpg";a.href=c.toDataURL("image/jpeg",0.3);a.textContent="Download Compressed Image";a.className="bg-green-600 text-white px-6 py-3 rounded-xl inline-block mt-2";document.getElementById("cout").appendChild(a)};i.src=URL.createObjectURL(f)}</script></body></html>
          EOF
          cat > youtube-thumbnail-downloader.html << 'EOF'
          <!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>YT Thumbnail - PakTools</title><script src="https://cdn.tailwindcss.com"></script><style>body{background:#0b1220;min-height:100vh}</style></head><body class="p-6"><a href="index.html" class="bg-white px-5 py-2 rounded-full font-bold mb-6 inline-block">← Back</a><div class="max-w-2xl mx-auto bg-white rounded-[2rem] p-8 shadow-2xl text-center"><h1 class="text-3xl font-black">YouTube Thumbnail Downloader</h1><input id="yt" class="w-full border-2 p-4 rounded-xl mt-6" placeholder="Paste YouTube Link"><button onclick="let id=yt.value.split('v=')[1]?.split('&')[0]||yt.value.split('/').pop();document.getElementById('yout').innerHTML=`<img src='https://img.youtube.com/vi/${id}/maxresdefault.jpg' class='rounded-xl mt-4'><a href='https://img.youtube.com/vi/${id}/maxresdefault.jpg' download class='bg-red-600 text-white px-6 py-3 rounded-xl mt-4 inline-block'>Download HD</a>`" class="w-full mt-4 bg-red-600 text-white p-4 rounded-xl font-bold">Get Thumbnail</button><div id="yout"></div></div></body></html>
          EOF
          cat > pdf-to-jpg.html << 'EOF'
          <!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>PDF to JPG - PakTools</title><script src="https://cdn.tailwindcss.com"></script><style>body{background:#0b1220;min-height:100vh}</style></head><body class="p-6"><a href="index.html" class="bg-white px-5 py-2 rounded-full font-bold mb-6 inline-block">← Back</a><div class="max-w-2xl mx-auto bg-white rounded-[2rem] p-8 shadow-2xl text-center"><h1 class="text-3xl font-black">PDF to JPG</h1><p class="mt-6 text-slate-500">Coming Soon - Advanced Version by PakTools</p><input type="file" class="w-full border-2 p-4 rounded-xl mt-4"><button class="w-full mt-4 bg-zinc-800 text-white p-4 rounded-xl font-bold">Convert Now</button></div></body></html>
          EOF
      - name: Push Fixed Tools
        run: |
          git config user.name "PakTools Bot"
          git config user.email "bot@paktools.pk"
          git add.
          git commit -m "Fix Coming Soon - Restore All 10 Tools Dark" || echo "no changes"
          git push
