name: PakTools PRO Viral Bot
on:
  workflow_dispatch:
  schedule:
    - cron: '0 5 * * *'
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Build 5 Viral Tools
        run: |
          python << 'PY'
          import os
          tools = ["ai-bio-generator","qr-code-generator","password-generator","fancy-text-generator","hashtag-generator","love-calculator","bmi-calculator-pro","invoice-generator","meme-generator","youtube-tag-generator"]
          template = open('index.html','r',encoding='utf-8').read()[:1000] if os.path.exists('index.html') else ""
          
          base_html = '''<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>TOOLTITLE - PakTools</title><script src="https://cdn.tailwindcss.com"></script></head><body class="bg-slate-50"><header class="bg-white p-4 shadow flex justify-between"><a href="index.html" class="font-black text-blue-600 text-xl">PakTools.pk</a><span class="bg-green-100 text-green-700 px-3 py-1 rounded-full text-xs font-bold">PRO LIVE</span></header><main class="max-w-3xl mx-auto mt-10 p-6 bg-white rounded-3xl shadow-2xl"><h1 class="text-3xl font-black text-center">TOOLTITLE</h1><p class="text-center text-gray-500 mt-2">Pakistan's No.1 Free TOOLTITLE Tool</p><textarea id="inp" class="w-full mt-6 p-4 border-2 rounded-xl" rows="4" placeholder="Enter text here..."></textarea><button onclick="gen()" class="w-full mt-4 bg-blue-600 text-white py-4 rounded-xl font-black">Generate Now</button><div id="out" class="mt-4 p-4 bg-gray-50 rounded-xl hidden"></div></main><script>function gen(){let v=document.getElementById('inp').value;if(!v)return alert('Enter text');let o=document.getElementById('out');o.classList.remove('hidden');o.innerHTML='<b>Result:</b><br><br>'+v+' <br><br> Generated by PakTools';}</script></body></html>'''

          c=0
          for t in tools:
            f=t+".html"
            if not os.path.exists(f) and c<5:
              title=t.replace('-',' ').title()
              html=base_html.replace('TOOLTITLE',title)
              open(f,'w',encoding='utf-8').write(html)
              print('Created '+f)
              c+=1
          PY
      - name: Push
        run: |
          git config user.name "PRO Bot"
          git config user.email "pro@paktools.pk"
          git add .
          git commit -m "PRO Bot Fixed - Added Viral Tools" || echo "no change"
          git push
