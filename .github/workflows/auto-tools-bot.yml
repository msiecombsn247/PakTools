name: PakTools ULTRA PRO Bot
on:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Build Real Tools
        run: |
          python3 << 'PY'
          import os
          # QR Code Real Working
          qr_html = "<!DOCTYPE html><html><head><meta charset='UTF-8'><meta name='viewport' content='width=device-width, initial-scale=1.0'><title>QR Code Generator - PakTools</title><script src='https://cdn.tailwindcss.com'></script><script src='https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js'></script></head><body class='bg-slate-50'><header class='bg-white p-4 shadow flex justify-between'><a href='index.html' class='font-black text-blue-600'>PakTools.pk</a><span class='bg-green-100 text-green-700 px-2 py-1 rounded-full text-xs'>REAL WORKING</span></header><main class='max-w-xl mx-auto mt-10 bg-white p-8 rounded-3xl shadow-2xl'><h1 class='text-3xl font-black text-center'>QR Code Generator</h1><input id='t' class='w-full mt-6 p-4 border-2 rounded-xl' placeholder='Enter URL or Text'><button onclick='make()' class='w-full mt-4 bg-blue-600 text-white py-3 rounded-xl font-bold'>Generate QR</button><div id='q' class='flex justify-center mt-6'></div></main><script>function make(){let v=document.getElementById('t').value;if(!v)return alert('Enter text');document.getElementById('q').innerHTML='';new QRCode(document.getElementById('q'),{text:v,width:200,height:200})}</script></body></html>"
          with open('qr-code-generator.html','w',encoding='utf-8') as f:
              f.write(qr_html)

          # Password Real Working
          pass_html = "<!DOCTYPE html><html><head><meta charset='UTF-8'><meta name='viewport' content='width=device-width'><title>Password Generator - PakTools</title><script src='https://cdn.tailwindcss.com'></script></head><body class='bg-slate-50'><header class='bg-white p-4 shadow'><a href='index.html' class='font-black text-blue-600'>PakTools.pk</a></header><main class='max-w-xl mx-auto mt-10 bg-white p-8 rounded-3xl shadow-2xl'><h1 class='text-3xl font-black text-center'>Password Generator</h1><button onclick='gen()' class='w-full mt-6 bg-blue-600 text-white py-3 rounded-xl font-bold'>Generate Strong Password</button><div id='o' class='mt-6 p-4 bg-black text-green-400 rounded-xl text-center font-mono text-xl'></div></main><script>function gen(){let c='ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789!@#$';let p='';for(let i=0;i<16;i++)p+=c[Math.floor(Math.random()*c.length)];document.getElementById('o').innerText=p}</script></body></html>"
          with open('password-generator.html','w',encoding='utf-8') as f:
              f.write(pass_html)

          print('ULTRA PRO Tools Upgraded Successfully')
          PY
      - name: Push
        run: |
          git config user.name "ULTRA Bot"
          git config user.email "ultra@paktools.pk"
          git add .
          git commit -m "ULTRA PRO Fixed - Real QR and Password Working" || echo "no change"
          git push
