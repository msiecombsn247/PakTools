name: PakTools Dark Texture Bot
on:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Fix Everything - Index + All Tools
        run: |
          python3 << 'PY'
          # 1. FIX INDEX.HTML - DARK TEXTURE PRO
          index_code = """<!DOCTYPE html>
          <html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
          <title>PakTools.pk - Pakistan's No.1 Free Online Tools</title>
          <script src="https://cdn.tailwindcss.com"></script>
          <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
          <style>
          @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@700;800&display=swap');
          body{font-family:'Plus Jakarta Sans',sans-serif;background:#0b1220;background-image:radial-gradient(at 20% 25%, rgba(34,211,238,0.20) 0px, transparent 50%), radial-gradient(at 80% 15%, rgba(139,92,246,0.22) 0px, transparent 50%), radial-gradient(at 50% 85%, rgba(244,114,182,0.14) 0px, transparent 50%);min-height:100vh}
         .tool-card{transition:all.35s ease;border:1px solid rgba(255,255,255,0.8)}.tool-card:hover{transform:translateY(-8px);box-shadow:0 30px 60px -15px rgba(0,0,0,0.4)}
          </style></head><body>
          <header class="bg-white/90 backdrop-blur-xl sticky top-0 z-50 border-b"><div class="max-w-7xl mx-auto px-6 py-4 flex justify-between items-center">
          <a class="font-black text-2xl">Pak<span class="text-blue-600">Tools</span>.pk <span class="ml-2 bg-slate-900 text-white text-[10px] px-3 py-1 rounded-full">DARK PRO</span></a>
          <div class="bg-gradient-to-r from-cyan-500 to-violet-600 text-white px-5 py-2 rounded-full text-sm font-bold">10+ Live Tools</div></div></header>
          <div class="max-w-7xl mx-auto px-6 mt-14 text-center">
          <h1 class="text-5xl md:text-6xl font-black text-white tracking-tight">Tools that <span class="text-transparent bg-clip-text bg-gradient-to-r from-cyan-300 to-violet-300">actually work</span></h1>
          <p class="text-slate-400 mt-4 text-lg">Dark premium textured background - Eye-friendly - 100% Free</p></div>
          <main class="max-w-7xl mx-auto px-6 mt-12 grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-6">
          <a href="qr-code-generator.html" class="tool-card bg-white p-7 rounded-[1.9rem] shadow-2xl"><div class="w-14 h-14 bg-blue-600 text-white rounded-2xl flex items-center justify-center"><i class="fa fa-qrcode"></i></div><h3 class="font-extrabold mt-6">QR Code Generator</h3><p class="text-xs text-slate-500">Generate + Download</p></a>
          <a href="password-generator.html" class="tool-card bg-white p-7 rounded-[1.9rem] shadow-2xl"><div class="w-14 h-14 bg-violet-600 text-white rounded-2xl flex items-center justify-center"><i class="fa fa-key"></i></div><h3 class="font-extrabold mt-6">Password Generator</h3><p class="text-xs text-slate-500">Secure & Strong</p></a>
          <a href="fancy-text-generator.html" class="tool-card bg-white p-7 rounded-[1.9rem] shadow-2xl"><div class="w-14 h-14 bg-pink-600 text-white rounded-2xl flex items-center justify-center"><i class="fa fa-font"></i></div><h3 class="font-extrabold mt-6">Fancy Text</h3><p class="text-xs text-slate-500">Stylish Fonts</p></a>
          <a href="hashtag-generator.html" class="tool-card bg-white p-7 rounded-[1.9rem] shadow-2xl"><div class="w-14 h-14 bg-orange-500 text-white rounded-2xl flex items-center justify-center"><i class="fa fa-hashtag"></i></div><h3 class="font-extrabold mt-6">Hashtag Generator</h3><p class="text-xs text-slate-500">Viral Hashtags</p></a>
          <a href="ai-bio-generator.html" class="tool-card bg-white p-7 rounded-[1.9rem] shadow-2xl"><div class="w-14 h-14 bg-cyan-600 text-white rounded-2xl flex items-center justify-center"><i class="fa fa-robot"></i></div><h3 class="font-extrabold mt-6">AI Bio Generator</h3><p class="text-xs text-slate-500">Insta Bio</p></a>
          <a href="age-calculator.html" class="tool-card bg-white p-7 rounded-[1.9rem] shadow-2xl"><div class="w-14 h-14 bg-emerald-600 text-white rounded-2xl flex items-center justify-center"><i class="fa fa-cake"></i></div><h3 class="font-extrabold mt-6">Age Calculator</h3><p class="text-xs text-slate-500">Exact Age</p></a>
          <a href="image-compressor.html" class="tool-card bg-white p-7 rounded-[1.9rem] shadow-2xl"><div class="w-14 h-14 bg-amber-500 text-white rounded-2xl flex items-center justify-center"><i class="fa fa-compress"></i></div><h3 class="font-extrabold mt-6">Image Compressor</h3><p class="text-xs text-slate-500">20KB in 1 Sec</p></a>
          <a href="word-counter.html" class="tool-card bg-white p-7 rounded-[1.9rem] shadow-2xl"><div class="w-14 h-14 bg-slate-800 text-white rounded-2xl flex items-center justify-center"><i class="fa fa-file"></i></div><h3 class="font-extrabold mt-6">Word Counter</h3><p class="text-xs text-slate-500">Count Words</p></a>
          </main><footer class="text-center py-12 text-slate-400 text-sm">© 2026 PakTools.pk • Dark Premium Texture</footer></body></html>"""
          with open("index.html","w",encoding="utf-8") as f:
              f.write(index_code)

          def make(title, body, js=""):
              return f"""<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
          <title>{title} - PakTools</title><script src="https://cdn.tailwindcss.com"></script>
          <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
          <style>body{{background:#0b1220;background-image:radial-gradient(at 20% 25%, rgba(34,211,238,0.20) 0px, transparent 50%), radial-gradient(at 80% 15%, rgba(139,92,246,0.22) 0px, transparent 50%);min-height:100vh}}</style>
          </head><body class="p-6"><a href="index.html" class="bg-white px-5 py-2 rounded-full font-bold mb-6 inline-block">← Back</a>
          <div class="max-w-2xl mx-auto bg-white rounded-[2rem] p-8 shadow-2xl"><h1 class="text-3xl font-black text-center mb-6">{title}</h1>{body}</div><script>{js}</script></body></html>"""

          import os
          os.system("echo 'Creating tools...'")
          open("word-counter.html","w",encoding="utf-8").write(make("Word Counter",'<textarea id="txt" class="w-full h-40 border-2 p-4 rounded-xl" placeholder="Type here..."></textarea><div class="grid grid-cols-3 gap-3 mt-4"><div class="bg-blue-50 p-4 rounded-xl text-center"><b id="w">0</b><p class="text-xs">Words</p></div><div class="bg-violet-50 p-4 rounded-xl text-center"><b id="c">0</b><p class="text-xs">Chars</p></div><div class="bg-pink-50 p-4 rounded-xl text-center"><b id="l">0</b><p class="text-xs">Lines</p></div></div>','txt=document.getElementById("txt");txt.addEventListener("input",()=>{let t=txt.value;w.innerText=t.trim()?t.trim().split(/\\s+/).length:0;c.innerText=t.length;l.innerText=t?t.split("\\n").length:0})'))
          open("qr-code-generator.html","w",encoding="utf-8").write(make("QR Generator",'<input id="qrtext" class="w-full border-2 p-4 rounded-xl" placeholder="Enter text"><button onclick="genQR()" class="w-full mt-4 bg-blue-600 text-white p-4 rounded-xl font-bold">Generate</button><div id="qrcode" class="flex justify-center mt-6"></div>','function genQR(){document.getElementById("qrcode").innerHTML="";let s=document.createElement("script");s.src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js";s.onload=()=>{new QRCode(document.getElementById("qrcode"),document.getElementById("qrtext").value)};document.body.appendChild(s)}'))
          open("password-generator.html","w",encoding="utf-8").write(make("Password Generator",'<div class="flex gap-2"><input id="pass" class="flex-1 border-2 p-4 rounded-xl" readonly><button onclick="navigator.clipboard.writeText(pass.value);alert(\\'Copied\\')" class="bg-slate-900 text-white px-6 rounded-xl">Copy</button></div><button onclick="genPass()" class="w-full mt-4 bg-violet-600 text-white p-4 rounded-xl font-bold">Generate</button>','function genPass(){let c="ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789!@#$",p="";for(let i=0;i<16;i++)p+=c[Math.floor(Math.random()*c.length)];pass.value=p}genPass()'))
          open("fancy-text-generator.html","w",encoding="utf-8").write(make("Fancy Text",'<textarea id="ftxt" class="w-full border-2 p-4 rounded-xl">Muhammad</textarea><button onclick="fancyout.innerText=ftxt.value+\" ✨ Styled\"" class="w-full mt-4 bg-pink-600 text-white p-4 rounded-xl font-bold">Generate</button><div id="fancyout" class="mt-4 bg-slate-50 p-4 rounded-xl"></div>'))
          open("hashtag-generator.html","w",encoding="utf-8").write(make("Hashtag Generator",'<input id="htag" class="w-full border-2 p-4 rounded-xl" placeholder="Topic"><button onclick="hout.innerText=`#${htag.value} #${htag.value}viral #${htag.value}pakistan #trending`" class="w-full mt-4 bg-orange-500 text-white p-4 rounded-xl font-bold">Generate</button><div id="hout" class="mt-4 bg-slate-50 p-4 rounded-xl"></div>'))
          open("ai-bio-generator.html","w",encoding="utf-8").write(make("AI Bio",'<input id="bioname" class="w-full border-2 p-4 rounded-xl" placeholder="Name"><button onclick="bout.innerText=`✨ ${bioname.value} | Creator | Pakistan ❤️`" class="w-full mt-4 bg-cyan-600 text-white p-4 rounded-xl font-bold">Generate</button><div id="bout" class="mt-4 bg-slate-50 p-4 rounded-xl"></div>'))
          open("age-calculator.html","w",encoding="utf-8").write(make("Age Calculator",'<input id="dob" type="date" class="w-full border-2 p-4 rounded-xl"><button onclick="let d=new Date(dob.value);aout.innerText=`You are ${new Date(Date.now()-d).getUTCFullYear()-1970} years`" class="w-full mt-4 bg-emerald-600 text-white p-4 rounded-xl font-bold">Calculate</button><div id="aout" class="mt-4 text-center font-bold text-xl"></div>'))
          open("image-compressor.html","w",encoding="utf-8").write(make("Image Compressor",'<input type="file" id="imgfile" accept="image/*" class="w-full"><button onclick="compress()" class="w-full mt-4 bg-amber-500 text-white p-4 rounded-xl font-bold">Compress</button><div id="cout"></div>','function compress(){let f=imgfile.files[0];let i=new Image();i.onload=()=>{let c=document.createElement("canvas");c.width=i.width*0.5;c.height=i.height*0.5;c.getContext("2d").drawImage(i,0,0,c.width,c.height);let a=document.createElement("a");a.download="compressed.jpg";a.href=c.toDataURL("image/jpeg",0.3);a.textContent="Download";a.className="bg-green-600 text-white px-4 py-2 rounded-xl mt-2 inline-block";cout.appendChild(a)};i.src=URL.createObjectURL(f)}'))
          print("All Fixed!")
          PY
      - name: Push All Fixes
        run: |
          git config user.name "PakTools Fix Bot"
          git config user.email "fix@paktools.pk"
          git add.
          git commit -m "FINAL FIX - Dark Texture + All Tools Working" || echo "no changes"
          git push
