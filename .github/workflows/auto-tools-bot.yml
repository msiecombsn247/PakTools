name: PakTools PRO Bot
on:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      
      - name: Create 5 Viral Tools
        run: |
          python3 << 'PY'
          import os
          tools = ["qr-code-generator", "password-generator", "fancy-text-generator", "hashtag-generator", "ai-bio-generator"]
          html_code = """<!DOCTYPE html><html><head><meta charset='UTF-8'><meta name='viewport' content='width=device-width'><title>TITLE - PakTools</title><script src='https://cdn.tailwindcss.com'></script></head><body class='bg-slate-50'><div class='max-w-2xl mx-auto mt-10 bg-white p-8 rounded-3xl shadow-xl'><h1 class='text-3xl font-black text-center'>TITLE</h1><textarea id='i' class='w-full border-2 p-4 rounded-xl mt-6' placeholder='Enter text'></textarea><button onclick='let v=document.getElementById("i").value;document.getElementById("o").innerHTML=v+" - Generated by PakTools PRO";document.getElementById("o").classList.remove("hidden")' class='w-full bg-blue-600 text-white py-3 rounded-xl mt-4 font-bold'>Generate</button><div id='o' class='hidden mt-4 p-4 bg-gray-100 rounded-xl'></div></div></body></html>"""
          count = 0
          for t in tools:
            fname = t + ".html"
            if not os.path.exists(fname) and count < 5:
              final_html = html_code.replace("TITLE", t.replace("-", " ").title())
              with open(fname, "w", encoding="utf-8") as f:
                f.write(final_html)
              count += 1
              print(f"Created {fname}")
          PY

      - name: Save Tools
        run: |
          git config user.name "PRO Bot"
          git config user.email "bot@paktools.pk"
          git add .
          git commit -m "Fixed PRO Bot - Viral Tools Added" || echo "No change"
          git push
