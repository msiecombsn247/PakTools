name: PakTools Dark Texture Bot
on:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Apply Dark Texture To All Tools
        run: |
          python3 << 'PY'
          import glob
          dark_css = "<style>body{background:#0f172a !important;background-image:radial-gradient(at 20% 30%, rgba(56,189,248,0.18) 0px, transparent 50%), radial-gradient(at 80% 20%, rgba(139,92,246,0.20) 0px, transparent 50%), radial-gradient(at 50% 90%, rgba(236,72,153,0.15) 0px, transparent 50%) !important; min-height:100vh;}</style>"
          for file in glob.glob("*.html"):
              if file == "index.html":
                  continue
              try:
                  with open(file, 'r', encoding='utf-8', errors='ignore') as f:
                      content = f.read()
                  if '0f172a' in content:
                      continue
                  if '</head>' in content:
                      new_content = content.replace('</head>', dark_css + '</head>')
                      with open(file, 'w', encoding='utf-8') as f:
                          f.write(new_content)
                      print(f"Updated {file}")
              except:
                  pass
          PY
      - name: Push Changes
        run: |
          git config user.name "Dark Bot"
          git config user.email "dark@paktools.pk"
          git add .
          git commit -m "Apply Dark Texture to all tools - Eye Friendly" || echo "no changes"
          git push
