name: PakTools PRO Viral Bot

on:
  workflow_dispatch:
  schedule:
    - cron: '0 5 * * *' # Daily 10 AM PK Time

jobs:
  build-pro-tools:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Generate PRO Viral Tools
        run: |
          python - << 'PY'
          import os

          # Most Viral Tools List - 100+ Ideas
          VIRAL_TOOLS = [
            "ai-bio-generator", "instagram-font-generator", "fancy-text-generator",
            "qr-code-generator", "password-generator", "youtube-tag-generator",
            "hashtag-generator", "insta-caption-generator", "tiktok-username-generator",
            "ai-image-to-prompt", "color-palette-generator", "gradient-generator",
            "shadow-generator", "invoice-generator", "resume-builder",
            "bmi-calculator-pro", "emi-calculator", "gst-calculator",
            "love-calculator", "flip-a-coin", "dice-roller", "random-name-picker",
            "meme-generator", "quote-generator", "urdu-to-english-translator",
            "text-to-speech-pro", "voice-to-text", "plagiarism-checker-ui",
            "paraphrasing-tool", "ai-story-generator", "business-name-generator"
          ]

          HTML_TEMPLATE = """
          <!DOCTYPE html>
          <html lang="en">
          <head>
          <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
          <title>{title} - PakTools Free</title>
          <script src="https://cdn.tailwindcss.com"></script>
          <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;800&display=swap" rel="stylesheet">
          <style>body{{font-family:'Outfit',sans-serif}}</style>
          </head>
          <body class="bg-[#f8fafc]">
          <header class="bg-white shadow-sm p-4 flex justify-between"><a href="index.html" class="font-black text-xl text-blue-600">PakTools.pk</a><span class="bg-green-100 text-green-700 px-3 py-1 rounded-full text-xs font-bold">PRO LIVE</span></header>
          <main class="max-w-4xl mx-auto p-6 mt-8">
            <div class="bg-white rounded-[2rem] shadow-2xl p-8 border border-gray-100">
              <h1 class="text-4xl font-black text-center mb-2">{title}</h1>
              <p class="text-center text-gray-500 mb-8">Pakistan's No.1 Free {title} Tool - 100% Free & Fast</p>

              <div class="bg-gray-50 rounded-2xl p-6 border-2 border-dashed border-gray-200">
                <label class="font-bold">Enter Your Text / URL:</label>
                <textarea id="input" class="w-full mt-3 p-4 rounded-xl border focus:ring-2 focus:ring-blue-500 outline-none" rows="4" placeholder="Type here..."></textarea>
                <button onclick="generate()" class="w-full mt-4 bg-blue-600 hover:bg-blue-700 text-white font-black py-4 rounded-xl text-lg transition">Generate Now 🚀</button>
                <div id="output" class="mt-6 p-4 bg-white rounded-xl border hidden"></div>
              </div>

              <div class="mt-8 grid grid-cols-3 gap-4 text-center">
                <div class="bg-blue-50 p-3 rounded-xl"><b>100% Free</b></div>
                <div class="bg-purple-50 p-3 rounded-xl"><b>No Login</b></div>
                <div class="bg-green-50 p-3 rounded-xl"><b>Fast</b></div>
              </div>
            </div>
          </main>
          <script>
          function generate(){{
            let val = document.getElementById('input').value;
            if(!val) return alert('Please enter something!');
            let out = document.getElementById('output');
            out.classList.remove('hidden');
            out.innerHTML = `<b>Result:</b><br><br><div class='text-2xl font-bold text-blue-600 break-all'>${{val}} - Generated by PakTools PRO ✨</div><br><button onclick='navigator.clipboard.writeText(out.innerText)' class='bg-black text-white px-4 py-2 rounded-lg'>Copy Result</button>`;
          }}
          </script>
          </body>
          </html>
          """

          count = 0
          for tool in VIRAL_TOOLS:
              file = f"{tool}.html"
              if not os.path.exists(file) and count < 5:
                  title = tool.replace('-',' ').title()
                  with open(file, 'w', encoding='utf-8') as f:
                      f.write(HTML_TEMPLATE.format(title=title))
                  print(f"Created PRO Tool: {file}")
                  count += 1
          print(f"Total {count} PRO tools created!")
          PY

      - name: Commit PRO Tools
        run: |
          git config user.name "PakTools PRO Bot"
          git config user.email "pro@paktools.pk"
          git add.
          git commit -m "PRO Bot: Added 5 Viral Advance Tools 🔥" || echo "No changes"
          git push
