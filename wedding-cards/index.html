<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Wedding Card Maker - PakTools</title>
<style>
body{font-family:Arial;background:#fdf2f8;margin:0;padding:20px;text-align:center}
h1{color:#7c2d5e}
.tabs{display:flex;justify-content:center;gap:10px;margin:20px 0}
.tab{padding:12px 25px;border-radius:25px;border:none;cursor:pointer;font-weight:bold}
.active{background:#c0266b;color:#fff}
.inactive{background:#fff;border:1px solid #c0266b;color:#c0266b}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:15px;max-width:900px;margin:auto}
.card{background:#fff;border-radius:15px;padding:15px;box-shadow:0 2px 10px #0001}
.card img{width:100%;border-radius:10px}
.card button{background:#c0266b;color:#fff;border:none;padding:10px 20px;border-radius:20px;cursor:pointer;margin-top:10px}
</style>
</head>
<body>
<h1>💍 Wedding Card Maker</h1>
<p>Free Wedding Invitation Card Banayein</p>

<div class="tabs">
<button class="tab active" onclick="showTab('normal',this)">Normal FREE</button>
<button class="tab inactive" onclick="showTab('premium',this)">Premium 40 Designs</button>
</div>

<div id="normal" class="grid">
  <div class="card">
    <h3>Design 01 - Golden Arch</h3>
    <p>Gold + Pink Floral | Mehndi Barat Walima</p>
    <a href="normal/builder.html?design=01"><button>Use This Design</button></a>
  </div>
  <div class="card"><h3>Design 02 - Coming Soon</h3><p>Same Setting</p><button>Use This Design</button></div>
  <!-- Isi tarah 20 designs tak copy karna hai -->
</div>

<div id="premium" class="grid" style="display:none">
  <div class="card"><h3>Premium Design 01</h3><p>40 Premium Designs</p><button>Use This Design</button></div>
</div>

<script>
function showTab(id,btn){
 document.getElementById('normal').style.display = id=='normal'?'grid':'none';
 document.getElementById('premium').style.display = id=='premium'?'grid':'none';
 document.querySelectorAll('.tab').forEach(b=>{b.className='tab inactive'});
 btn.className='tab active';
}
</script>
</body>
</html>
