<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>JPG to PNG Converter - Batch, Transparent, Free Pakistan | PakTools</title>
<meta name="description" content="Free JPG to PNG converter Pakistan - Batch convert, transparent background, high quality. 100% working, offline, secure.">
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@800&family=Inter:wght@400;600&display=swap" rel="stylesheet">
</head>
<body style="background:#07010f;color:white;font-family:Inter,sans-serif">
<div style="position:fixed;inset:0;background:radial-gradient(ellipse at 30% 20%, rgba(120,40,200,0.15), transparent 50%);z-index:0"></div>
<header class="sticky top-0 z-20 border-b border-white/10 bg-[#07010f]/80 backdrop-blur-xl"><div class="max-w-6xl mx-auto px-6 py-4 flex justify-between items-center"><a href="index.html" style="text-decoration:none;color:white" class="font-black text-xl flex gap-2 items-center"><div class="w-8 h-8 rounded-lg bg-gradient-to-br from-purple-400 to-purple-700 flex items-center justify-center">P</div>PakTools</a><a href="blog.html" style="color:white;text-decoration:none" class="text-[11px] bg-white/10 border border-white/20 px-4 py-2 rounded-full">Blogs</a></div></header>
<main class="max-w-5xl mx-auto px-6 py-8 relative z-10">
<h1 style="font-family:'Plus Jakarta Sans'" class="text-3xl md:text-5xl font-black">JPG to PNG Converter - Batch</h1>
<p class="text-gray-400 text-[12px] mt-2">Convert 100 Images at once • High Quality • Keep Transparency • 100% Offline</p>

<div id="drop" class="mt-6 border-2 border-dashed border-purple-500/40 bg-white/[0.04] rounded-[24px] p-10 text-center cursor-pointer">
<div class="text-5xl">🖼️➡️🖼️</div><h3 class="mt-3 font-bold text-[14px]">Drop JPG Images or Click (Batch)</h3><p class="text-[11px] text-gray-400 mt-1">JPG, JPEG, WEBP, BMP → PNG • Unlimited • Secure</p><input id="file" type="file" accept="image/*" multiple class="hidden">
</div>

<div class="mt-4 flex gap-2"><select id="quality" class="bg-[#1a0f2e] border border-white/15 rounded-full px-4 py-2 text-[11px]"><option value="1">Maximum Quality</option><option value="0.9">High Quality (90%)</option></select><button id="convertAll" class="px-5 py-2 bg-gradient-to-r from-purple-500 to-fuchsia-500 rounded-full text-[11px] font-bold">Convert All → PNG</button><button id="downloadAll" class="px-5 py-2 bg-white text-black rounded-full text-[11px] font-bold hidden">Download All ZIP</button><button id="clear" class="px-4 py-2 bg-white/10 rounded-full text-[11px]">Clear</button></div>

<div id="list" class="mt-6 grid md:grid-cols-3 gap-4"></div>
<canvas id="canvas" class="hidden"></canvas>
</main>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<script>
const drop=document.getElementById('drop'), file=document.getElementById('file'), list=document.getElementById('list'), canvas=document.getElementById('canvas'), ctx=canvas.getContext('2d');
let filesData=[];
drop.onclick=()=>file.click();
drop.ondragover=e=>{e.preventDefault();drop.classList.add('border-purple-400')};
drop.ondragleave=()=>drop.classList.remove('border-purple-400');
drop.ondrop=e=>{e.preventDefault();handle([...e.dataTransfer.files])};
file.onchange=e=>handle([...e.target.files]);
function handle(files){
files.forEach(f=>{
if(!f.type.startsWith('image/')) return;
let url=URL.createObjectURL(f);
filesData.push({file:f,url,name:f.name.replace(/\.[^.]+$/,'')+'.png'});
let div=document.createElement('div');
div.className='bg-white/[0.05] border border-white/10 rounded-xl p-3';
div.innerHTML=`<img src="${url}" class="w-full h-32 object-cover rounded-lg"><div class="mt-2 text-[11px] font-bold truncate">${f.name}</div><div class="text-[10px] text-gray-400">${(f.size/1024).toFixed(1)} KB → PNG</div><button class="mt-2 w-full py-1.5 bg-white/10 rounded-full text-[10px] convert-one">Convert</button>`;
div.querySelector('.convert-one').onclick=()=>convertOne(filesData.length-1,div);
list.appendChild(div);
});
}
async function convertOne(idx, card){
let data=filesData[idx];
let img=new Image(); img.src=data.url;
await new Promise(r=>img.onload=r);
canvas.width=img.width; canvas.height=img.height;
ctx.clearRect(0,0,canvas.width,canvas.height);
ctx.drawImage(img,0,0);
let pngUrl=canvas.toDataURL('image/png');
let a=document.createElement('a'); a.href=pngUrl; a.download=data.name; a.click();
if(card) card.querySelector('.convert-one').textContent='Downloaded ✓';
}
document.getElementById('convertAll').onclick=async()=>{
for(let i=0;i<filesData.length;i++){await convertOne(i)}
if(filesData.length>1) document.getElementById('downloadAll').classList.remove('hidden');
};
document.getElementById('downloadAll').onclick=async()=>{
let zip=new JSZip();
for(let i=0;i<filesData.length;i++){
let img=new Image(); img.src=filesData[i].url; await new Promise(r=>img.onload=r);
canvas.width=img.width; canvas.height=img.height; ctx.drawImage(img,0,0);
let dataUrl=canvas.toDataURL('image/png'); let base64=dataUrl.split(',')[1];
zip.file(filesData[i].name,base64,{base64:true});
}
let content=await zip.generateAsync({type:'blob'});
let a=document.createElement('a'); a.href=URL.createObjectURL(content); a.download='converted-png.zip'; a.click();
};
document.getElementById('clear').onclick=()=>{filesData=[];list.innerHTML=''};
</script>
</body>
</html>
