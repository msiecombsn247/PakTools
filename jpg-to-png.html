<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>JPG to PNG Converter - Free High Quality | PakTools</title>
<meta name="description" content="Free JPG to PNG Converter - Convert JPG to PNG, PNG to JPG in high quality. No Upload, 100% Secure, Fast.">
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@800;900&display=swap" rel="stylesheet">
<style>
*{font-family:'Inter',sans-serif}
body{margin:0;background:#05020a;color:white}
.glass{background:rgba(255,255,255,0.08);backdrop-filter:blur(18px);border:1px solid rgba(255,255,255,0.15)}
.tool-icon{width:78px;height:78px;margin:0 auto 12px;border-radius:20px;background:linear-gradient(135deg,#22d3ee,#a855f7);display:flex;align-items:center;justify-content:center;font-size:38px;box-shadow:0 0 20px rgba(168,85,247,0.6), inset 0 1px 3px rgba(255,255,255,0.9)}
.hero-bg{position:relative;background:#05020a;overflow:hidden}
.hero-bg::before{content:'';position:absolute;inset:0;background:radial-gradient(ellipse 600px 250px at 20% 50%, rgba(180,70,255,0.8) 0%, transparent 60%),radial-gradient(ellipse 500px 200px at 70% 55%, rgba(120,40,200,0.6) 0%, transparent 60%)}
</style>
</head>
<body>
<header class="relative z-20 max-w-7xl mx-auto px-3 md:px-4 pt-4">
<div class="glass rounded-full px-4 md:px-6 py-3 flex justify-between items-center">
<a href="index.html" style="text-decoration:none;color:white" class="font-black text-xl flex items-center gap-2"><div class="w-8 h-8 rounded-lg bg-gradient-to-br from-cyan-400 to-purple-500 flex items-center justify-center text-black">P</div> PakTools</a>
<div class="flex gap-2 items-center"><a href="index.html" style="text-decoration:none;color:white" class="hidden md:block text-sm text-gray-300">Home</a><a href="index.html#tools" style="text-decoration:none" class="bg-white text-black font-bold px-5 py-2 rounded-full text-sm whitespace-nowrap">All Tools</a></div>
</div>
</header>

<div class="hero-bg"><div class="relative z-10 max-w-5xl mx-auto px-4 py-10">
<div class="text-center">
<div class="tool-icon">🔄</div>
<h1 class="text-4xl md:text-5xl font-black mt-3">JPG to PNG Converter</h1>
<p class="text-gray-400 mt-3 text-sm">Convert JPG to PNG & PNG to JPG - High Quality, No Loss</p>
</div>

<div class="glass rounded-[22px] p-5 md:p-7 mt-8">
<div id="dropArea" class="border-2 border-dashed border-white/20 rounded-2xl p-8 md:p-12 text-center cursor-pointer hover:border-cyan-400">
<input type="file" id="fileInput" accept="image/*" class="hidden">
<div id="uploadPrompt"><div class="text-5xl mb-2">📸</div><p class="font-bold">Click or Drag JPG / PNG Here</p><p class="text-xs text-gray-400 mt-1">Auto Convert</p></div>
<img id="preview" class="hidden max-h-[320px] mx-auto rounded-xl">
<p id="fileName" class="hidden text-xs text-cyan-300 mt-3"></p>
</div>

<div class="grid grid-cols-2 gap-3 mt-6">
<button id="toPngBtn" class="glass border border-cyan-400/50 rounded-full py-3 text-sm font-bold bg-gradient-to-r from-cyan-400/20 to-purple-500/20">To PNG</button>
<button id="toJpgBtn" class="glass rounded-full py-3 text-sm font-bold">To JPG</button>
</div>

<div class="mt-4">
<label class="text-xs text-gray-400">Output Quality (JPG only)</label>
<input id="quality" type="range" min="0.5" max="1" step="0.05" value="0.92" class="w-full accent-cyan-400">
</div>

<button id="downloadBtn" class="w-full mt-6 bg-gradient-to-r from-cyan-400 to-purple-500 text-white font-black py-4 rounded-full shadow-[0_0_30px_rgba(168,85,247,0.6)] opacity-50 pointer-events-none">Upload Image First</button>
<p id="info" class="text-center text-xs text-gray-500 mt-3">100% Browser Based - No Upload to Server</p>
<canvas id="canvas" class="hidden"></canvas>
</div>
</div></div>

<footer class="text-center py-6 text-xs text-gray-500">© 2026 PakTools</footer>

<script>
let img=null, currentFileName='';
const fileInput=document.getElementById('fileInput'), dropArea=document.getElementById('dropArea'), preview=document.getElementById('preview'), uploadPrompt=document.getElementById('uploadPrompt');
let targetFormat='image/png';
const toPngBtn=document.getElementById('toPngBtn'), toJpgBtn=document.getElementById('toJpgBtn'), downloadBtn=document.getElementById('downloadBtn');

dropArea.addEventListener('click',()=>fileInput.click());
fileInput.addEventListener('change',e=>handle(e.target.files[0]));
dropArea.addEventListener('dragover',e=>{e.preventDefault();dropArea.style.borderColor='#22d3ee'});
dropArea.addEventListener('drop',e=>{e.preventDefault();handle(e.dataTransfer.files[0])});

function handle(file){
 if(!file)return;
 currentFileName=file.name.split('.')[0];
 const r=new FileReader();r.onload=e=>{
   img=new Image();img.onload=()=>{
     preview.src=e.target.result;preview.classList.remove('hidden');uploadPrompt.classList.add('hidden');
     document.getElementById('fileName').innerText=file.name+` (${img.width}x${img.height})`;document.getElementById('fileName').classList.remove('hidden');
     downloadBtn.classList.remove('opacity-50','pointer-events-none');downloadBtn.innerText='Convert & Download →';
   };img.src=e.target.result;
 };r.readAsDataURL(file);
}

toPngBtn.onclick=()=>{targetFormat='image/png';toPngBtn.classList.add('border-cyan-400/50','bg-gradient-to-r','from-cyan-400/20','to-purple-500/20');toJpgBtn.classList.remove('border-cyan-400/50','bg-gradient-to-r','from-cyan-400/20','to-purple-500/20');};
toJpgBtn.onclick=()=>{targetFormat='image/jpeg';toJpgBtn.classList.add('border-cyan-400/50','bg-gradient-to-r','from-cyan-400/20','to-purple-500/20');toPngBtn.classList.remove('border-cyan-400/50','bg-gradient-to-r','from-cyan-400/20','to-purple-500/20');};

downloadBtn.addEventListener('click',()=>{
 if(!img)return;
 const c=document.getElementById('canvas');c.width=img.width;c.height=img.height;const ctx=c.getContext('2d');
 if(targetFormat==='image/jpeg'){ctx.fillStyle='#fff';ctx.fillRect(0,0,c.width,c.height);}
 ctx.drawImage(img,0,0);
 const ext=targetFormat==='image/png'?'png':'jpg';
 const a=document.createElement('a');a.download=`PakTools-${currentFileName}.${ext}`;
 a.href=c.toDataURL(targetFormat,parseFloat(document.getElementById('quality').value));
 a.click();
 document.getElementById('info').innerText=`✅ Downloaded as ${ext.toUpperCase()}`;
});
</script>
</body>
</html>
