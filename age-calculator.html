<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Age Calculator</title><script src="https://cdn.tailwindcss.com"></script></head><body class="bg-[#0b1220] p-6"><a href="index.html" class="bg-white px-5 py-2 rounded-full font-bold">← Back</a><div class="max-w-xl mx-auto bg-white rounded-[2rem] p-8 mt-6 text-center"><h1 class="text-3xl font-black">Age Calculator</h1><p class="text-gray-500 mt-2">Exact Age</p><input type="date" id="dob" class="w-full border-2 p-3 rounded-xl mt-6"><button onclick="calc()" class="w-full bg-black text-white py-3 rounded-xl mt-4 font-bold">Calculate Age</button><p id="out" class="mt-6 font-bold text-xl text-green-600"></p></div><script>function calc(){if(!dob.value)return alert("Date select karo");let b=new Date(dob.value);let t=new Date();let a=t.getFullYear()-b.getFullYear();let m=t.getMonth()-b.getMonth();if(m<0||(m==0&&t.getDate()<b.getDate()))a--;out.innerText=`You are ${a} Years Old 🎉`}</script></body></html>
