<!DOCTYPE html>
<html lang="ur">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Premium Luxury Biodata Builder</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
<style>
*{box-sizing:border-box; font-family:'Segoe UI', Arial, sans-serif}
body{margin:0; background:#f5f1e8; display:flex; flex-direction:column; height:100vh}
.top{background:linear-gradient(90deg,#5a3e1b,#d4af37); color:white; text-align:center; padding:12px; font-weight:bold; font-size:17px}
.main{display:flex; flex:1; overflow:hidden}
@media(max-width:900px){ .main{flex-direction:column; overflow:auto} }
.left{width:380px; background:white; overflow-y:auto; padding:14px; border-right:2px solid #e8d9a8}
.left h3{margin:10px 0 5px; color:#5a3e1b; font-size:13px; border-left:4px solid #d4af37; padding-left:8px}
.left input, .left textarea{width:100%; padding:9px; margin:5px 0; border:1.5px solid #d4af37; border-radius:8px; font-size:13px}
.grid{ display:grid; grid-template-columns:repeat(3,1fr); gap:7px; margin:8px 0 }
.grid div{height:85px; border-radius:8px; overflow:hidden; border:2px solid transparent; cursor:pointer; position:relative}
.grid div.active{border-color:#d4af37; box-shadow:0 0 12px gold}
.grid img{width:100%; height:100%; object-fit:cover}
.grid span{position:absolute; bottom:0; left:0; right:0; background:rgba(0,0,0,0.6); color:white; font-size:8px; text-align:center; padding:2px}
.photo-mini{width:80px; height:95px; border:2px dashed #d4af37; border-radius:8px; object-fit:cover; display:block; margin:6px auto}
.btn{width:100%; padding:12px; border:none; border-radius:10px; font-weight:bold; font-size:15px; cursor:pointer; margin-top:10px}
.gold{background:linear-gradient(90deg,#d4af37,#8b5a2b); color:white}
.right{flex:1; background:#e9e1c8; overflow:auto; padding:20px; display:flex; justify-content:center}
#a4{width:210mm; min-height:297mm; background:#fffef8; background-size:cover; background-position:center; padding:18mm 20mm; position:relative; box-shadow:0 10px 40px rgba(0,0,0,0.3); flex-shrink:0}
.photo-box{position:absolute; top:22mm; right:20mm; width:35mm; height:43mm; border:3px solid #d4af37; border-radius:10px; overflow:hidden; background:white}
.photo-box img{width:100%; height:100%; object-fit:cover}
.title{text-align:center; font-size:24px; font-weight:bold; color:#5a3e1b; border-bottom:3px double #d4af37; padding-bottom:3mm; margin-bottom:4mm}
.sec{margin-bottom:3.5mm}
.sec h4{margin:0 0 1mm; background:linear-gradient(90deg,#d4af37,#b8941f); color:white; display:inline-block; padding:1mm 3mm; border-radius:4px; font-size:11px}
.sec p{margin:0; font-size:11.5px; line-height:1.5; color:#222; white-space:pre-line}
</style>
</head>
<body>
<div class="top">PREMIUM BUILDER - Photo + Text Auto Fit - 12 Luxury Borders</div>
<div class="main">
<div class="left">
<h3>1. Border Select</h3><div class="grid" id="grid"></div>
<h3>2. Photo</h3><input type="file" id="photoIn" accept="image/*"><img id="mini" class="photo-mini" style="display:none">
<h3>3. Details</h3>
<input id="f_name" placeholder="Full Name">
<textarea id="f_personal" rows="3" placeholder="Personal: Age, Height, City, Cast"></textarea>
<textarea id="f_family" rows="2" placeholder="Family Details"></textarea>
<textarea id="f_edu" rows="2" placeholder="Education & Job"></textarea>
<textarea id="f_deen" rows="2" placeholder="Deen / Maslak"></textarea>
<textarea id="f_req" rows="2" placeholder="Requirements"></textarea>
<textarea id="f_contact" rows="1" placeholder="Contact"></textarea>
<button class="btn gold" onclick="downloadPDF()">📄 HD PDF Download</button>
<button class="btn" style="background:#222; color:#d4af37" onclick="location.href='./index.html'">← Back to Premium List</button>
</div>
<div class="right"><div id="a4">
<div class="photo-box"><img id="a4Photo"></div>
<div style="width:65%">
<div class="title">Rishta Biodata</div>
<div id="a4_name" style="font-weight:bold; font-size:15px; color:#8b5a2b; margin-bottom:2mm"></div>
<div class="sec"><h4>Personal Information</h4><p id="a4_personal"></p></div>
<div class="sec"><h4>Family Details</h4><p id="a4_family"></p></div>
<div class="sec"><h4>Education & Job</h4><p id="a4_edu"></p></div>
<div class="sec"><h4>Deeni Maloomat</h4><p id="a4_deen"></p></div>
<div class="sec"><h4>Requirements</h4><p id="a4_req"></p></div>
<div class="sec"><h4>Rabta</h4><p id="a4_contact"></p></div>
</div>
</div></div>
</div>

<script>
const files=[]; for(let i=1;i<=12;i++) files.push(`./borders/border_a4_${i}.jpg`);
const names=["Cream Baroque","Navy Gold","Maroon","Damask","Rose Gold","Black Marble","Pearl Silver","Emerald","Champagne","Purple","Gold Hearts","Gold Marble"];
const grid=document.getElementById('grid'); const a4=document.getElementById('a4');

files.forEach((src,i)=>{
  const d=document.createElement('div');
  if(i==0) d.className='active';
  d.innerHTML=`<img src="${src}" onerror="this.src='${src.replace('.jpg','.webp')}'"><span>${i+1}. ${names[i]}</span>`;
  d.onclick=()=>{
    document.querySelectorAll('.grid div').forEach(x=>x.classList.remove('active'));
    d.classList.add('active'); a4.style.backgroundImage=`url('${src}')`; localStorage.setItem('premium_border',src);
  };
  grid.appendChild(d);
});

// URL se border
const params=new URLSearchParams(location.search);
const bid=params.get('border');
let startFile = files[0];
if(bid){ startFile = files[parseInt(bid)-1] || files[0]; }
const saved=localStorage.getItem('premium_border');
a4.style.backgroundImage=`url('${saved || startFile}')`;

function bind(inp,out){ document.getElementById(inp).addEventListener('input',e=>{ document.getElementById(out).innerText=e.target.value; }); }
bind('f_name','a4_name'); bind('f_personal','a4_personal'); bind('f_family','a4_family'); bind('f_edu','a4_edu'); bind('f_deen','a4_deen'); bind('f_req','a4_req'); bind('f_contact','a4_contact');

document.getElementById('photoIn').addEventListener('change',e=>{
  const f=e.target.files[0]; if(!f) return;
  const r=new FileReader(); r.onload=ev=>{
    document.getElementById('a4Photo').src=ev.target.result;
    const m=document.getElementById('mini'); m.src=ev.target.result; m.style.display='block';
  }; r.readAsDataURL(f);
});

function downloadPDF(){
  const opt={margin:0, filename:`${document.getElementById('f_name').value || 'Premium_Biodata'}.pdf`, image:{type:'jpeg', quality:1}, html2canvas:{scale:3, useCORS:true}, jsPDF:{unit:'mm', format:'a4', orientation:'portrait'}};
  html2pdf().set(opt).from(a4).save();
}
</script>
</body>
</html>
