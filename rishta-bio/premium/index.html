<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Premium - Choose Design | PakTools</title>
<script src="https://cdn.tailwindcss.com"></script>
<style>body{background:#07010f;color:#fff}.glass{background:rgba(255,255,255,0.06);border:1px solid rgba(212,175,55,0.15);backdrop-filter:blur(10px)}</style>
</head>
<body class="p-4">
<header class="flex justify-between items-center max-w-[1200px] mx-auto mb-6"><a href="../index.html" class="font-black">← Back</a><h1 class="font-black text-xl">💎 Choose Premium Design - 12 Luxury Royal</h1></header>
<div class="max-w-[1200px] mx-auto grid grid-cols-2 md:grid-cols-4 gap-4" id="grid"></div>
<script>
const names=["Cream Gold Baroque","Navy Blue Gold","Maroon Bridal Velvet","Damask Glitter Luxury","Rose Gold Love","Black Marble Gold","Pearl Silver Royal","Emerald Green Gold","Champagne Silk","Purple Velvet Gold","Gold Hearts Luxury","White Gold Marble"];
const grid=document.getElementById('grid');
for(let i=1;i<=12;i++){
  let div=document.createElement('div');
  div.className='glass rounded-[16px] overflow-hidden cursor-pointer hover:scale-[1.03] transition group';
  div.innerHTML=`<div class='bg-white p-2'><img src='./borders/border_a4_${i}.jpg' onerror="this.src='./borders/border_a4_${i}.webp'" class='w-full h-[280px] object-cover'></div><div class='p-3 text-center'><p class='text-[12px] font-bold'>Design ${String(i).padStart(2,'0')}</p><p class='text-[10px] text-[#d4af37] mt-1'>${names[i-1]}</p><button class='mt-2 w-full bg-gradient-to-r from-[#d4af37] to-[#8b5a2b] py-2 rounded-full text-[11px] font-bold'>Use This Design →</button></div>`;
  div.onclick=()=>location.href=`builder.html?d=${i}`;
  grid.appendChild(div);
}
</script>
</body>
</html>
