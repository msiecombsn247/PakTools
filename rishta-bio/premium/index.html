<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Premium Borders - 12 Luxury Designs</title>
<style>
*{box-sizing:border-box}
body{margin:0; font-family:Arial; background:#faf6ef;}
.header{background:linear-gradient(90deg,#5a3e1b,#d4af37); color:white; padding:14px; text-align:center; font-weight:bold; font-size:18px; position:sticky; top:0; z-index:10;}
.container{max-width:1000px; margin:0 auto; padding:15px;}
.grid{display:grid; grid-template-columns:repeat(2,1fr); gap:15px;}
@media(min-width:700px){ .grid{grid-template-columns:repeat(3,1fr);} }
.card{background:white; border-radius:14px; overflow:hidden; box-shadow:0 4px 15px rgba(0,0,0,0.1); border:3px solid transparent; cursor:pointer; transition:0.3s; position:relative;}
.card:hover{transform:translateY(-5px); box-shadow:0 8px 25px rgba(212,175,55,0.4);}
.card.active{border-color:#d4af37; box-shadow:0 0 20px gold;}
.card img{width:100%; height:260px; object-fit:cover; display:block; background:#eee;}
.badge-top{position:absolute; top:8px; left:8px; background:linear-gradient(90deg,#d4af37,#8b5a2b); color:white; font-size:10px; padding:5px 10px; border-radius:20px; font-weight:bold;}
.info{padding:10px; display:flex; justify-content:space-between; align-items:center;}
.info span{font-size:13px; font-weight:bold; color:#5a3e1b;}
.btn-use{width:100%; background:linear-gradient(90deg,#d4af37,#8b5a2b); color:white; border:none; padding:11px; font-weight:bold; cursor:pointer;}
.preview-bar{position:fixed; bottom:0; left:0; right:0; background:white; padding:12px 15px; box-shadow:0 -5px 25px rgba(0,0,0,0.2); display:flex; gap:12px; align-items:center; transform:translateY(100%); transition:0.3s; z-index:99;}
.preview-bar.show{transform:translateY(0);}
.preview-bar img{width:60px; height:80px; object-fit:cover; border-radius:8px; border:2px solid #d4af37;}
</style>
</head>
<body>
<div class="header">✨ PREMIUM LUXURY - 12 Royal Designs ✨</div>
<div class="container"><div class="grid" id="grid"></div></div>

<div class="preview-bar" id="bar">
  <img id="barImg" src="">
  <div style="flex:1"><div id="barName" style="font-weight:bold"></div><div style="font-size:11px; color:gray">Ready to use in builder</div></div>
  <button onclick="goBuilder()" style="background:#d4af37; border:none; padding:12px 22px; border-radius:25px; color:white; font-weight:bold; cursor:pointer;">USE IN BUILDER →</button>
</div>

<script>
const borders = [
  {id:1, name:"Cream Gold Baroque", file:"./borders/border_a4_1.jpg"},
  {id:2, name:"Navy Blue Gold", file:"./borders/border_a4_2.jpg"},
  {id:3, name:"Maroon Bridal", file:"./borders/border_a4_3.jpg"},
  {id:4, name:"Damask Glitter", file:"./borders/border_a4_4.jpg"},
  {id:5, name:"Rose Gold Love", file:"./borders/border_a4_5.jpg"},
  {id:6, name:"Black Marble Gold", file:"./borders/border_a4_6.jpg"},
  {id:7, name:"White Pearl Silver", file:"./borders/border_a4_7.jpg"},
  {id:8, name:"Emerald Green Gold", file:"./borders/border_a4_8.jpg"},
  {id:9, name:"Champagne Silk Gold", file:"./borders/border_a4_9.jpg"},
  {id:10, name:"Royal Purple Velvet", file:"./borders/border_a4_10.jpg"},
  {id:11, name:"Gold Hearts Love", file:"./borders/border_a4_11.jpg"},
  {id:12, name:"White Gold Marble", file:"./borders/border_a4_12.jpg"},
];
let selected = null;
const grid = document.getElementById('grid');

borders.forEach(b=>{
  const card = document.createElement('div');
  card.className='card';
  card.innerHTML=`<div class="badge-top">PREMIUM</div><img src="${b.file}" onerror="this.src='${b.file.replace('.jpg','.webp')}'" alt="${b.name}"><div class="info"><span>${b.id}. ${b.name}</span><span style="background:#eee; padding:2px 6px; border-radius:10px; font-size:10px">HD</span></div><button class="btn-use">SELECT</button>`;
  card.onclick=()=>{
    document.querySelectorAll('.card').forEach(c=>c.classList.remove('active'));
    card.classList.add('active');
    selected=b;
    document.getElementById('barImg').src=b.file;
    document.getElementById('barName').innerText=b.name;
    document.getElementById('bar').classList.add('show');
    localStorage.setItem('premium_border', b.file);
    localStorage.setItem('premium_id', b.id);
  };
  grid.appendChild(card);
});

function goBuilder(){ if(!selected) return; window.location.href=`./builder.html?border=${selected.id}`; }
</script>
</body>
</html>
