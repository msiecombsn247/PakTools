<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Free CV Maker Pakistan - Professional Resume PDF | PakTools</title>
<meta name="description" content="Create Professional CV / Resume Free for Pakistan Jobs. ATS Friendly, Download PDF Instantly. No Signup Needed.">
<meta name="keywords" content="cv maker pakistan, free resume maker, cv banane wala, professional cv pdf">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;800;900&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<style>
*{font-family:'Inter',sans-serif}body{background:#07010f;color:white;margin:0;overflow-x:hidden}
.galaxy-bg{position:fixed;inset:0;z-index:0;background:#020006;pointer-events:none}
.galaxy{position:absolute;width:800px;height:800px;border-radius:50%;filter:blur(80px);opacity:0.5}
.g1{background:radial-gradient(circle,#c084fc,#7e22ce 25%,transparent 70%);top:-10%;left:-10%}
.g2{background:radial-gradient(circle,#a855f7,#581c87 25%,transparent 70%);bottom:-20%;right:-10%}
.tool-box{background:linear-gradient(145deg,rgba(28,10,58,0.92),rgba(12,3,32,0.92));border:1px solid rgba(168,85,247,0.3);border-radius:1.5rem}
.input{width:100%;background:rgba(0,0,0,0.5);border:1px solid rgba(255,255,255,0.15);border-radius:12px;padding:10px 14px;font-size:13px;outline:none;color:white;margin-top:6px}
.input:focus{border-color:#a855f7}
@media(max-width:768px){.galaxy{filter:blur(40px);width:400px;height:400px}}
</style>
</head>
<body>
<div class="galaxy-bg"><div class="galaxy g1"></div><div class="galaxy g2"></div></div>
<header class="relative z-20 sticky top-0 border-b border-white/10 bg-[#07010f]/80 backdrop-blur-xl"><div class="max-w-7xl mx-auto px-6 py-4 flex justify-between items-center"><a href="index.html" class="font-black text-xl flex items-center gap-2" style="text-decoration:none;color:white"><div class="w-9 h-9 rounded-lg bg-gradient-to-br from-purple-400 to-purple-700 flex items-center justify-center">P</div>PakTools</a><a href="index.html" class="text-[12px] bg-white/10 border border-white/20 px-4 py-2 rounded-full" style="text-decoration:none;color:white">Home</a></div></header>

<main class="relative z-10 max-w-6xl mx-auto px-6 py-8">
<div class="text-center"><h1 class="text-3xl md:text-5xl font-black">Free CV Maker <span class="text-transparent bg-clip-text bg-gradient-to-r from-purple-300 to-fuchsia-300">Pakistan</span></h1><p class="text-gray-400 text-sm mt-2">Professional ATS Resume - Download PDF Free</p></div>

<div class="grid md:grid-cols-2 gap-6 mt-8">
<div class="tool-box p-6 space-y-4">
<h3 class="font-bold">Your Details</h3>
<input id="name" class="input" placeholder="Full Name e.g. Muhammad Sajid">
<input id="title" class="input" placeholder="Job Title e.g. Graphic Designer">
<div class="grid grid-cols-2 gap-3"><input id="phone" class="input" placeholder="Phone e.g. 0300-1234567"><input id="email" class="input" placeholder="Email"></div>
<input id="address" class="input" placeholder="Address e.g. Lahore, Pakistan">
<textarea id="summary" class="input h-20" placeholder="Professional Summary..."></textarea>
<textarea id="education" class="input h-16" placeholder="Education e.g. BS Computer Science - Punjab University (2020-2024)"></textarea>
<textarea id="experience" class="input h-20" placeholder="Experience e.g. Graphic Designer at XYZ Company - 2 Years"></textarea>
<textarea id="skills" class="input h-16" placeholder="Skills e.g. Photoshop, MS Office, English Typing"></textarea>
<button onclick="makeCV()" class="w-full bg-gradient-to-r from-purple-500 to-fuchsia-500 font-bold py-3 rounded-full text-sm">Generate CV PDF</button>
</div>

<div class="tool-box p-6">
<h3 class="font-bold mb-3">Live Preview</h3>
<div id="preview" class="bg-white text-black rounded-xl p-6 text-[12px] leading-6 min-h-[500px]">
<p class="text-center text-gray-400 mt-20">Fill details to see preview...</p>
</div>
<button onclick="downloadPDF()" class="w-full mt-4 bg-white text-black font-bold py-3 rounded-full text-sm">Download PDF Now</button>
</div>
</div>
</main>

<script>
function makeCV(){
 const n=document.getElementById('name').value||'Your Name';
 const t=document.getElementById('title').value||'Job Title';
 const p=document.getElementById('phone').value, e=document.getElementById('email').value, a=document.getElementById('address').value;
 const s=document.getElementById('summary').value, ed=document.getElementById('education').value, ex=document.getElementById('experience').value, sk=document.getElementById('skills').value;
 document.getElementById('preview').innerHTML=`
 <h2 style="font-size:20px;font-weight:900">${n}</h2><p style="color:#7e22ce;font-weight:700">${t}</p><p style="font-size:11px;color:#555">${p} | ${e} | ${a}</p><hr style="margin:12px 0">
 <h4 style="font-weight:800">Professional Summary</h4><p>${s||'Write your summary...'}</p><br>
 <h4 style="font-weight:800">Education</h4><p>${ed||'-'}</p><br>
 <h4 style="font-weight:800">Experience</h4><p>${ex||'-'}</p><br>
 <h4 style="font-weight:800">Skills</h4><p>${sk||'-'}</p>
 `;
}
async function downloadPDF(){
 const {jsPDF}=window.jspdf; const doc=new jsPDF();
 const n=document.getElementById('name').value||'CV';
 const t=document.getElementById('title').value;
 const p=document.getElementById('phone').value, em=document.getElementById('email').value, ad=document.getElementById('address').value;
 const s=document.getElementById('summary').value, ed=document.getElementById('education').value, ex=document.getElementById('experience').value, sk=document.getElementById('skills').value;
 doc.setFont('helvetica','bold'); doc.setFontSize(22); doc.text(n,20,20);
 doc.setFontSize(12); doc.setTextColor(126,34,206); doc.text(t,20,28);
 doc.setTextColor(0,0,0); doc.setFontSize(10); doc.setFont('helvetica','normal'); doc.text(`${p} | ${em} | ${ad}`,20,35);
 doc.line(20,38,190,38);
 let y=48;
 doc.setFont('helvetica','bold'); doc.text('Professional Summary',20,y); y+=7; doc.setFont('helvetica','normal'); doc.text(doc.splitTextToSize(s,170),20,y); y+=15+Math.ceil(s.length/70)*5;
 doc.setFont('helvetica','bold'); doc.text('Education',20,y); y+=7; doc.setFont('helvetica','normal'); doc.text(doc.splitTextToSize(ed,170),20,y); y+=15;
 doc.setFont('helvetica','bold'); doc.text('Experience',20,y); y+=7; doc.setFont('helvetica','normal'); doc.text(doc.splitTextToSize(ex,170),20,y); y+=20;
 doc.setFont('helvetica','bold'); doc.text('Skills',20,y); y+=7; doc.setFont('helvetica','normal'); doc.text(doc.splitTextToSize(sk,170),20,y);
 doc.save(`PakTools-CV-${n}.pdf`);
}
</script>
</body>
</html>
