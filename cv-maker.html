<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>CV Maker Pakistan PRO - ATS Resume Builder | PakTools</title>
<meta name="description" content="Free ATS CV Maker Pakistan - PPSC, FPSC, Rozee.pk jobs. HD PDF export, no watermark, offline.">
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&family=Plus+Jakarta+Sans:wght@600;700;800&display=swap" rel="stylesheet">
<style>
*{font-family:'Inter',sans-serif}
body{background:#07010f;color:white}
.cv-page{width:794px;min-height:1123px;background:white;color:#111827;padding:0;margin:0 auto;position:relative}
@media(max-width:900px){.cv-page{width:100%;transform-origin:top left;}}
.input-field{width:100%;background:rgba(255,255,255,0.06);border:1px solid rgba(255,255,255,0.1);border-radius:10px;padding:10px 12px;color:white;font-size:12px;outline:none}
.input-field:focus{border-color:#a855f7}
.label{font-size:10px;font-weight:700;letter-spacing:0.08em;color:#9ca3af;text-transform:uppercase;margin-bottom:6px;display:block}
</style>
</head>
<body>
<!-- HEADER -->
<header class="sticky top-0 z-50 border-b border-white/10 bg-[#07010f]/90 backdrop-blur-xl">
<div class="max-w-[1600px] mx-auto px-6 py-3 flex justify-between items-center">
<a href="index.html" class="font-black text-[16px] flex items-center gap-2" style="text-decoration:none;color:white"><div class="w-8 h-8 rounded-lg bg-gradient-to-br from-purple-400 to-purple-700 flex items-center justify-center">P</div>PakTools</a>
<div class="flex items-center gap-2">
<button id="templateBtn" class="text-[11px] bg-white/10 px-4 py-2 rounded-full">Templates</button>
<button id="downloadBtn" class="text-[11px] bg-gradient-to-r from-purple-600 to-fuchsia-600 px-5 py-2.5 rounded-full font-bold">📄 Download PDF</button>
</div>
</div>
</header>

<div class="max-w-[1600px] mx-auto grid lg:grid-cols-[380px_1fr] gap-0 min-h-screen">
<!-- LEFT FORM -->
<div class="bg-[#0c031c] border-r border-white/10 p-6 overflow-y-auto h-[calc(100vh-60px)] lg:sticky top-[60px]">
<h2 class="text-[13px] font-black tracking-widest text-purple-300">1. PERSONAL INFO (Pakistan Format)</h2>
<div class="mt-4 grid gap-3">
<div class="grid grid-cols-2 gap-2">
<div><label class="label">Full Name</label><input id="inName" class="input-field" value="Muhammad Ali"></div>
<div><label class="label">Father Name</label><input id="inFather" class="input-field" value="Muhammad Aslam"></div>
</div>
<div><label class="label">Photo Upload</label><input type="file" id="inPhoto" accept="image/*" class="input-field"></div>
<div class="grid grid-cols-2 gap-2">
<div><label class="label">CNIC (Optional)</label><input id="inCnic" class="input-field" placeholder="35202-1234567-1"></div>
<div><label class="label">Domicile</label><input id="inDomicile" class="input-field" placeholder="Lahore, Punjab"></div>
</div>
<div class="grid grid-cols-2 gap-2">
<div><label class="label">Phone</label><input id="inPhone" class="input-field" value="0300-1234567"></div>
<div><label class="label">Email</label><input id="inEmail" class="input-field" value="ali@gmail.com"></div>
</div>
<div><label class="label">Address</label><input id="inAddress" class="input-field" value="House 123, Lahore"></div>
<div><label class="label">Professional Summary</label><textarea id="inSummary" class="input-field h-[80px]">Motivated and hardworking professional seeking PPSC/FPSC position. Strong computer skills, MS Office, and communication.</textarea></div>
</div>

<h2 class="text-[13px] font-black tracking-widest text-purple-300 mt-8">2. EDUCATION</h2>
<div id="eduList" class="mt-3 grid gap-2"></div>
<button onclick="addEdu()" class="mt-2 text-[11px] border border-white/20 px-3 py-1.5 rounded-full w-full">+ Add Education</button>

<h2 class="text-[13px] font-black tracking-widest text-purple-300 mt-8">3. EXPERIENCE & SKILLS</h2>
<div class="mt-3 grid gap-3">
<label class="label">Experience (One per line)</label><textarea id="inExp" class="input-field h-[70px]">Computer Operator - XYZ Company (2022-2024)
Intern - Punjab Govt (2021)</textarea>
<label class="label">Skills (Comma separated)</label><input id="inSkills" class="input-field" value="MS Office, Typing 40 WPM, Photoshop, Communication">
</div>
<p class="text-[10px] text-gray-500 mt-8">100% Offline • No data sent to server • ATS Approved for Rozee.pk</p>
</div>

<!-- RIGHT PREVIEW -->
<div class="bg-[#1a0a35] p-4 lg:p-8 overflow-auto">
<div class="flex justify-center gap-2 mb-4">
<button onclick="setTemplate(1)" class="text-[10px] px-3 py-1 rounded-full bg-white text-black font-bold">Template 1 - PPSC</button>
<button onclick="setTemplate(2)" class="text-[10px] px-3 py-1 rounded-full bg-white/10 border">Template 2 - Modern</button>
<button onclick="setTemplate(3)" class="text-[10px] px-3 py-1 rounded-full bg-white/10 border">Template 3 - Simple</button>
</div>

<div id="cvPreview" class="cv-page shadow-2xl">
<!-- CV CONTENT WILL BE RENDERED HERE BY JS -->
</div>
<p class="text-center text-[10px] text-white/40 mt-4">Preview is HD • Download will be 300 DPI PDF</p>
</div>
</div>

<script>
let template = 1;
let education = [
{degree:"BS Computer Science", institute:"University of Punjab", year:"2020-2024"},
{degree:"FSc Pre-Engineering", institute:"Punjab College Lahore", year:"2018-2020"}
];
let photoData = "";

function addEdu(){education.push({degree:"",institute:"",year:""});renderEdu();updateCV()}
function renderEdu(){
const list = document.getElementById('eduList');
list.innerHTML = education.map((e,i)=>`
<div class="bg-white/5 border border-white/10 p-3 rounded-xl grid gap-2">
<input class="input-field" placeholder="Degree" value="${e.degree}" oninput="education[${i}].degree=this.value;updateCV()">
<input class="input-field" placeholder="Institute" value="${e.institute}" oninput="education[${i}].institute=this.value;updateCV()">
<input class="input-field" placeholder="Year" value="${e.year}" oninput="education[${i}].year=this.value;updateCV()">
</div>`).join('');
}
document.getElementById('inPhoto').addEventListener('change', function(e){
const reader = new FileReader();
reader.onload = function(ev){photoData = ev.target.result; updateCV();}
reader.readAsDataURL(e.target.files[0]);
});

function setTemplate(n){template=n;updateCV();}

function updateCV(){
const name=document.getElementById('inName').value;
const father=document.getElementById('inFather').value;
const cnic=document.getElementById('inCnic').value;
const domicile=document.getElementById('inDomicile').value;
const phone=document.getElementById('inPhone').value;
const email=document.getElementById('inEmail').value;
const address=document.getElementById('inAddress').value;
const summary=document.getElementById('inSummary').value;
const exp=document.getElementById('inExp').value.split('\n');
const skills=document.getElementById('inSkills').value.split(',');

let html = '';
if(template===1){
html=`<div style="display:grid;grid-template-columns:200px 1fr;min-height:1123px">
<div style="background:#1e293b;color:white;padding:28px 20px">
${photoData?`<img src="${photoData}" style="width:110px;height:130px;object-fit:cover;border-radius:8px;border:3px solid white;margin-bottom:20px">`:''}
<div style="font-size:11px;opacity:0.7;text-transform:uppercase;letter-spacing:1px;font-weight:700;margin-bottom:8px">Contact</div>
<div style="font-size:11px;line-height:1.7">📞 ${phone}<br>✉️ ${email}<br>📍 ${address}<br>${cnic?'🪪 '+cnic+'<br>':''}${domicile?'🏠 '+domicile:''}</div>
<div style="margin-top:24px;font-size:11px;opacity:0.7;text-transform:uppercase;letter-spacing:1px;font-weight:700;margin-bottom:8px">Skills</div>
<div style="font-size:11px;line-height:1.9">${skills.map(s=>`• ${s.trim()}`).join('<br>')}</div>
<div style="margin-top:24px;font-size:11px;opacity:0.7;text-transform:uppercase;letter-spacing:1px;font-weight:700;margin-bottom:8px">Father Name</div><div style="font-size:11px">${father}</div>
</div>
<div style="padding:32px 28px">
<h1 style="font-size:28px;font-weight:900;letter-spacing:-1px;margin:0">${name}</h1>
<p style="font-size:12px;color:#64748b;margin-top:2px">Applicant for Government / Private Jobs</p>
<div style="margin-top:24px"><div style="font-size:12px;font-weight:800;text-transform:uppercase;letter-spacing:1px;border-bottom:2px solid #111;padding-bottom:4px">Professional Summary</div><p style="font-size:11.5px;line-height:1.6;margin-top:8px;color:#334155">${summary}</p></div>
<div style="margin-top:20px"><div style="font-size:12px;font-weight:800;text-transform:uppercase;letter-spacing:1px;border-bottom:2px solid #111;padding-bottom:4px">Education</div><div style="margin-top:8px">${education.map(e=>`<div style="margin-bottom:10px"><div style="font-size:12px;font-weight:700">${e.degree}</div><div style="font-size:11px;color:#475569">${e.institute} | ${e.year}</div></div>`).join('')}</div></div>
<div style="margin-top:20px"><div style="font-size:12px;font-weight:800;text-transform:uppercase;letter-spacing:1px;border-bottom:2px solid #111;padding-bottom:4px">Experience</div><div style="margin-top:8px;font-size:11.5px;line-height:1.7;color:#334155">${exp.map(e=>`• ${e}`).join('<br>')}</div></div>
</div></div>`;
}
document.getElementById('cvPreview').innerHTML=html;
}
renderEdu();updateCV();
['inName','inFather','inCnic','inDomicile','inPhone','inEmail','inAddress','inSummary','inExp','inSkills'].forEach(id=>{
document.getElementById(id).addEventListener('input',updateCV);
});

// PDF DOWNLOAD
document.getElementById('downloadBtn').addEventListener('click', async()=>{
const {jsPDF} = window.jspdf;
const element = document.getElementById('cvPreview');
const canvas = await html2canvas(element,{scale:3,useCORS:true});
const imgData = canvas.toDataURL('image/png');
const pdf = new jsPDF('p','mm','a4');
const pdfW = pdf.internal.pageSize.getWidth();
const pdfH = (canvas.height * pdfW) / canvas.width;
pdf.addImage(imgData,'PNG',0,0,pdfW,pdfH);
pdf.save(`${document.getElementById('inName').value.replace(/\s+/g,'_')}_CV_PakTools.pdf`);
});
</script>
</body>
</html>
