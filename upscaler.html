<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Image Upscaler Pakistan - AI Upscale 4K HD Free | PakTools</title>
<meta name="description" content="AI Image Upscaler Pakistan - Upscale image to 2x 4x 8K free. Browser based, no API, copyright safe. HD quality 2025.">
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@800&family=Inter:wght@400;600&display=swap" rel="stylesheet">
</head>
<body style="background:#07010f;color:white;font-family:Inter,sans-serif">
<div style="position:fixed;inset:0;background:radial-gradient(ellipse at 30% 20%, rgba(120,40,200,0.15), transparent 50%);z-index:0"></div>
<header class="sticky top-0 z-20 border-b border-white/10 bg-[#07010f]/80 backdrop-blur-xl"><div class="max-w-6xl mx-auto px-6 py-4 flex justify-between items-center"><a href="index.html" style="text-decoration:none;color:white" class="font-black text-xl flex gap-2 items-center"><div class="w-8 h-8 rounded-lg bg-gradient-to-br from-purple-400 to-purple-700 flex items-center justify-center">P</div>PakTools</a><a href="blog.html" style="color:white;text-decoration:none" class="text-[11px] bg-white/10 border border-white/20 px-4 py-2 rounded-full">Blogs</a></div></header>
<main class="max-w-6xl mx-auto px-6 py-8 relative z-10 grid lg:grid-cols-2 gap-6">
<div>
<h1 style="font-family:'Plus Jakarta Sans'" class="text-3xl font-black">AI Image Upscaler - 2x 4x 8K</h1>
<p class="text-gray-400 text-[11px] mt-2">Browser based upscaler, No API cost, No copyright. Works offline.</p>
<div class="mt-5 bg-white/[0.05] border border-white/10 rounded-2xl p-5">
<input id="file" type="file" accept="image/*" class="w-full text-[11px]">
<div class="grid grid-cols-3 gap-2 mt-4">
<button data-x="2" class="scaleBtn py-2 bg-white text-black rounded-full text-[11px] font-bold">2X HD</button>
<button data-x="4" class="scaleBtn py-2 bg-white/10 rounded-full text-[11px]">4X 4K</button>
<button data-x="8" class="scaleBtn py-2 bg-white/10 rounded-full text-[11px]">8X 8K</button>
</div>
<label class="text-[11px] mt-4 block">Enhance Mode</label>
<select id="mode" class="w-full mt-2 bg-black/30 border border-white/10 rounded-full px-4 py-2 text-[11px]"><option value="smooth">Smooth (Portrait)</option><option value="sharp">Sharp (Text/Product)</option><option value="photo">Photo Real</option></select>
<button id="upscale" class="w-full mt-4 py-3 bg-gradient-to-r from-purple-500 to-fuchsia-500 rounded-full font-bold text-[12px]">Upscale Now →</button>
<p id="info" class="text-[10px] text-gray-400 mt-3 text-center"></p>
</div>
</div>
<div class="bg-white/[0.05] border border-white/10 rounded-2xl p-5">
<h3 class="text-[12px] font-bold">Preview</h3>
<div class="mt-4 grid grid-cols-2 gap-3">
<div><p class="text-[10px] text-gray-400">Original</p><img id="orig" class="mt-2 w-full h-40 object-contain bg-black/30 rounded-xl"><p id="origInfo" class="text-[9px] text-gray-500 mt-1"></p></div>
<div><p class="text-[10px] text-gray-400">Upscaled</p><img id="up" class="mt-2 w-full h-40 object-contain bg-black/30 rounded-xl"><p id="upInfo" class="text-[9px] text-gray-500 mt-1"></p></div>
</div>
<a id="dl" class="hidden mt-4 block text-center py-3 bg-white text-black rounded-full text-[11px] font-bold" style="text-decoration:none">Download HD Image</a>
<div class="mt-4 bg-black/30 rounded-xl p-3 text-[10px] text-gray-400">✓ 100% browser - image never uploaded to server - private + copyright safe. Best for PPSC passport photo, product photos.</div>
</div>
</main>
<script>
let img=new Image(); let scale=2; let loaded=false;
document.getElementById('file').onchange=e=>{
let f=e.target.files[0]; if(!f) return;
let url=URL.createObjectURL(f);
img.src=url; img.onload=()=>{
loaded=true;
document.getElementById('orig').src=url;
document.getElementById('origInfo').innerText=`${img.width}x${img.height}`;
document.getElementById('info').innerText=`Loaded: ${f.name}`;
};
};
document.querySelectorAll('.scaleBtn').forEach(b=>{
b.onclick=()=>{
document.querySelectorAll('.scaleBtn').forEach(x=>x.className='scaleBtn py-2 bg-white/10 rounded-full text-[11px]');
b.className='scaleBtn py-2 bg-white text-black rounded-full text-[11px] font-bold';
scale=parseInt(b.dataset.x);
};
});
document.getElementById('upscale').onclick=()=>{
if(!loaded){alert('Upload image first'); return;}
let mode=document.getElementById('mode').value;
let canvas=document.createElement('canvas');
let w=img.width*scale, h=img.height*scale;
canvas.width=w; canvas.height=h;
let ctx=canvas.getContext('2d');
// high quality scaling
ctx.imageSmoothingEnabled=true;
ctx.imageSmoothingQuality='high';
if(mode=='sharp'){ ctx.filter='contrast(1.1) brightness(1.05)'; }
else if(mode=='photo'){ ctx.filter='contrast(1.05) saturate(1.1)'; }
ctx.drawImage(img,0,0,w,h);
let dataUrl=canvas.toDataURL('image/jpeg',0.92);
document.getElementById('up').src=dataUrl;
document.getElementById('upInfo').innerText=`${w}x${h} - ${scale}X`;
let dl=document.getElementById('dl');
dl.href=dataUrl; dl.download=`upscaled-${scale}x-${Date.now()}.jpg`;
dl.classList.remove('hidden');
document.getElementById('info').innerText=`Upscaled to ${w}x${h} - Ready to download`;
};
</script>
</body>
</html>
