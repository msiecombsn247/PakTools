<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Image Compressor 20KB - PakTools</title>
<script src="https://cdn.tailwindcss.com"></script>
<style>
body{background:#020a1f; color:white; font-family:Inter,sans-serif; overflow-x:hidden;}
.galaxy{position:absolute; width:800px; height:800px; border-radius:50%; filter:blur(90px); opacity:.55; animation:float 20s infinite alternate;}
@keyframes float{0%{transform:translate(-10%,-10%)}100%{transform:translate(10%,10%) scale(1.15)}}
.stars{position:absolute; inset:0; pointer-events:none;}
.star{position:absolute; width:2px; height:2px; background:white; border-radius:50%; animation:twinkle 3s infinite;}
.tool-box{background:linear-gradient(145deg,#10205e 0%,#0a1744 40%,#070f30 100%); border:1px solid rgba(59,130,246,0.4); box-shadow:0 0 30px rgba(37,99,235,0.35), inset 0 1px 0 rgba(150,200,255,0.18); backdrop-filter:blur(15px);}
.upload-area{background:rgba(255,255,255,0.06); border:2px dashed rgba(56,189,248,0.5);}
input[type=range]{accent-color:#22d3ee;}
</style>
</head>
<body class="relative min-h-screen">
<div class="galaxy bg-gradient-to-br from-blue-600 via-indigo-700 to-slate-900 top-[-250px] left-[10%]"></div>
<div class="galaxy bg-gradient-to-br from-cyan-700 via-blue-800 to-[#020a1f] bottom-[-300px] right-[5%]"></div>
<div class="stars" id="stars"></div>

<header class="relative z-20 sticky top-0 border-b border-white/10 bg-[#020a1f]/70 backdrop-blur-xl">
<div class="max-w-7xl mx-auto px-6 py-4 flex justify-between items-center">
<a href="index.html" class="font-black text-xl flex items-center gap-2"><div class="w-9 h-9 rounded-lg bg-gradient-to-br from-cyan-400 to-blue-600 flex items-center justify-center">P</div>PakTools</a>
<a href="index.html" class="text-sm bg-white/10 border border-white/20 px-4 py-2 rounded-lg">← Home</a>
</div>
</header>

<main class="relative z-10 max-w-5xl mx-auto px-6 py-12">
<div class="text-center">
<h1 class="text-4xl md:text-5xl font-black">Image Compressor <span class="text-transparent bg-clip-text bg-gradient-to-r from-cyan-300 to-blue-400">20KB</span></h1>
<p class="mt-3 text-gray-400">Compress Image to 20KB, 50KB, 100KB - 100% Free</p>
</div>

<div class="tool-box rounded-[2rem] p-8 md:p-10 mt-10">
<div class="grid md:grid-cols-2 gap-8">
<div>
<div id="dropZone" class="upload-area rounded-2xl p-10 text-center cursor-pointer">
<input type="file" id="fileInput" accept="image/*" class="hidden">
<div class="text-5xl">🗜️</div>
<p class="mt-4 font-bold">Click to Upload Image</p>
<p class="text-xs text-gray-400 mt-1">JPG, PNG, WEBP</p>
</div>

<div class="mt-6 space-y-4">
<div><label class="text-sm text-gray-300">Target Size: <span id="sizeLabel" class="text-cyan-300 font-bold">20KB</span></label>
<select id="sizeSelect" onchange="updateLabel()" class="w-full mt-2 bg-black/40 border border-white/10 rounded-lg p-3 text-sm outline-none">
<option value="20">20KB (For Forms)</option>
<option value="50">50KB</option>
<option value="100">100KB</option>
<option value="200">200KB</option>
<option value="custom">Custom</option>
</select></div>
<div><label class="text-sm text-gray-300">Quality: <span id="qualityLabel" class="text-cyan-300">70%</span></label>
<input type="range" id="quality" min="10" max="100" value="70" class="w-full mt-2" oninput="document.getElementById('qualityLabel').innerText=this.value+'%'"></div>
<button id="compressBtn" class="w-full bg-gradient-to-r from-cyan-400 to-blue-600 text-black font-black py-4 rounded-xl shadow-[0_0_20px_rgba(56,189,248,0.5)]">⚡ Compress Now</button>
</div>
</div>

<div class="bg-black/30 rounded-2xl border border-white/10 p-4">
<div id="stats" class="hidden flex justify-between text-xs mb-4">
<span class="text-gray-400">Original: <b id="origSize" class="text-white"></b></span>
<span class="text-cyan-300">Compressed: <b id="compSize"></b></span>
</div>
<div class="min-h-[300px] flex items-center justify-center">
<img id="preview" class="hidden max-w-full rounded-xl">
<p id="placeholder" class="text-gray-500 text-sm">Compressed image preview</p>
</div>
<a id="downloadBtn" class="hidden mt-4 block text-center bg-white/10 border border-cyan-400/30 py-3 rounded-xl font-bold hover:bg-cyan-400 hover:text-black">⬇️ Download Compressed Image</a>
</div>
</div>
</div>
</main>

<script>
const stars=document.getElementById('stars');
for(let i=0;i<150;i++){let d=document.createElement('div');d.className='star';d.style.left=Math.random()*100+'%';d.style.top=Math.random()*100+'%';d.style.animationDelay=Math.random()*3+'s';stars.appendChild(d);}

const fileInput=document.getElementById('fileInput'), dropZone=document.getElementById('dropZone'), preview=document.getElementById('preview'), placeholder=document.getElementById('placeholder'), compressBtn=document.getElementById('compressBtn'), downloadBtn=document.getElementById('downloadBtn');
let file=null;
dropZone.onclick=()=>fileInput.click();
fileInput.onchange=e=>{file=e.target.files[0]; showFile();};
function showFile(){if(!file)return; preview.src=URL.createObjectURL(file); preview.classList.remove('hidden'); placeholder.classList.add('hidden'); document.getElementById('origSize').innerText=(file.size/1024).toFixed(1)+'KB'; document.getElementById('stats').classList.remove('hidden');}
function updateLabel(){let v=document.getElementById('sizeSelect').value; document.getElementById('sizeLabel').innerText=v=='custom'?'Custom':v+'KB';}

compressBtn.onclick=async()=>{
if(!file){alert('Upload image first'); return;}
let quality=document.getElementById('quality').value/100;
let targetKB=parseInt(document.getElementById('sizeSelect').value)||20;
compressBtn.innerText='⏳ Compressing...';
let img=new Image(); img.src=URL.createObjectURL(file);
await new Promise(r=>img.onload=r);
let canvas=document.createElement('canvas'); let ctx=canvas.getContext('2d');
let scale=1;
if(file.size/1024>targetKB*2){scale=Math.sqrt(targetKB/(file.size/1024))*0.9;}
canvas.width=img.width*scale; canvas.height=img.height*scale;
ctx.drawImage(img,0,0,canvas.width,canvas.height);
let q=quality;
let blob=await new Promise(r=>canvas.toBlob(r,'image/jpeg',q));
let attempts=0;
while(blob.size/1024>targetKB && q>0.1 && attempts<15){q-=0.05; blob=await new Promise(r=>canvas.toBlob(r,'image/jpeg',q)); attempts++;}
preview.src=URL.createObjectURL(blob); document.getElementById('compSize').innerText=(blob.size/1024).toFixed(1)+'KB';
downloadBtn.classList.remove('hidden'); downloadBtn.href=preview.src; downloadBtn.download='compressed-'+file.name;
compressBtn.innerText='⚡ Compress Now';
}
</script>
</body>
</html>
