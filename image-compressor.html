<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width"><title>Image Compressor</title><script src="https://cdn.tailwindcss.com"></script></head><body class="bg-[#0b1220] p-6"><a href="index.html" class="bg-white px-5 py-2 rounded-full font-bold">← Back</a><div class="max-w-xl mx-auto bg-white rounded-[2rem] p-8 mt-6 text-center"><h1 class="text-3xl font-black">Image Compressor</h1><input type="file" id="file" class="mt-6"><br><img id="img" class="mt-4 max-w-full mx-auto"><br><a id="down" class="hidden bg-black text-white px-6 py-2 rounded-full mt-4 inline-block">Download 20KB</a></div><script>file.onchange=e=>{let f=e.target.files[0];let r=new FileReader();r.onload=()=>{img.src=r.result;let c=document.createElement('canvas');let im=new Image();im.onload=()=>{c.width=im.width;c.height=im.height;c.getContext('2d').drawImage(im,0,0);let q=0.7;let d=c.toDataURL('image/jpeg',q);down.href=d;down.download='compressed.jpg';down.classList.remove('hidden')}};im.src=r.result};r.readAsDataURL(f)}</script></body></html>
