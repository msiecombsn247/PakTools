<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>YouTube Tags Generator Pakistan - SEO Tags Extractor Free | PakTools</title>
<meta name="description" content="YouTube Tags Generator Pakistan - Generate SEO tags, hashtags from title. 100% working, no API, copyright safe. For Pakistani YouTubers 2025.">
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@800&family=Inter:wght@400;600&display=swap" rel="stylesheet">
</head>
<body style="background:#07010f;color:white;font-family:Inter,sans-serif">
<div style="position:fixed;inset:0;background:radial-gradient(ellipse at 30% 20%, rgba(120,40,200,0.15), transparent 50%);z-index:0"></div>
<header class="sticky top-0 z-20 border-b border-white/10 bg-[#07010f]/80 backdrop-blur-xl"><div class="max-w-6xl mx-auto px-6 py-4 flex justify-between items-center"><a href="index.html" style="text-decoration:none;color:white" class="font-black text-xl flex gap-2 items-center"><div class="w-8 h-8 rounded-lg bg-gradient-to-br from-purple-400 to-purple-700 flex items-center justify-center">P</div>PakTools</a><a href="blog.html" style="color:white;text-decoration:none" class="text-[11px] bg-white/10 border border-white/20 px-4 py-2 rounded-full">Blogs</a></div></header>
<main class="max-w-6xl mx-auto px-6 py-8 relative z-10 grid lg:grid-cols-2 gap-6">
<div>
<h1 style="font-family:'Plus Jakarta Sans'" class="text-3xl font-black">YouTube Tags Generator - SEO</h1>
<p class="text-gray-400 text-[11px] mt-2">No API, No scraping - 100% copyright safe. Generates tags from your title.</p>
<div class="mt-5 bg-white/[0.05] border border-white/10 rounded-2xl p-5">
<label class="text-[11px]">Video Title / Topic</label>
<input id="title" type="text" placeholder="How to make biryani at home in Pakistan" class="w-full mt-2 bg-black/30 border border-white/10 rounded-full px-4 py-3 text-[12px]">
<label class="text-[11px] mt-4 block">Category</label>
<select id="cat" class="w-full mt-2 bg-black/30 border border-white/10 rounded-full px-4 py-3 text-[12px]"><option>Cooking</option><option>Vlog</option><option>Tech</option><option>Education</option><option>Gaming</option><option>Islamic</option><option>Comedy</option><option>Business Pakistan</option></select>
<button id="gen" class="w-full mt-4 py-3 bg-gradient-to-r from-purple-500 to-fuchsia-500 rounded-full font-bold text-[12px]">Generate Tags →</button>
</div>
</div>
<div class="bg-white/[0.05] border border-white/10 rounded-2xl p-5">
<h3 class="text-[12px] font-bold">Generated Tags</h3>
<div id="tags" class="mt-4 flex flex-wrap gap-2"></div>
<div class="mt-4 grid grid-cols-2 gap-3">
<div class="bg-black/30 rounded-xl p-3"><p class="text-[10px] text-gray-400">Hashtags for Description</p><p id="hashtags" class="text-[11px] mt-2"></p></div>
<div class="bg-black/30 rounded-xl p-3"><p class="text-[10px] text-gray-400">Title Variations</p><p id="titles" class="text-[11px] mt-2"></p></div>
</div>
<button id="copy" class="w-full mt-4 py-2 bg-white text-black rounded-full text-[11px] font-bold">Copy All Tags</button>
<div class="mt-4 text-[10px] text-gray-500">Safe: We generate original tags, don't copy others' tags (copyright issue). 100% YouTube SEO safe.</div>
</div>
</main>
<script>
document.getElementById('gen').onclick=()=>{
let t=document.getElementById('title').value.toLowerCase().trim(); if(!t) return;
let cat=document.getElementById('cat').value;
let base=t.split(' ').filter(w=>w.length>2);
let tags=new Set();
base.forEach(w=>tags.add(w));
tags.add(t); tags.add(t+' pakistan'); tags.add(t+' urdu'); tags.add(t+' hindi');
tags.add(cat+' '+t); tags.add('how to '+t); tags.add(t+' tutorial');
if(cat=='Cooking'){tags.add('pakistani cooking'); tags.add('food street'); tags.add('recipe in urdu');}
if(cat=='Tech'){tags.add('tech in pakistan'); tags.add('mobile price pakistan');}
tags.add('pakistan'); tags.add('urdu'); tags.add(cat.toLowerCase());
let arr=[...tags].slice(0,30);
document.getElementById('tags').innerHTML=arr.map(x=>`<span class="px-3 py-1 bg-white/10 border border-white/10 rounded-full text-[10px]">${x}</span>`).join('');
document.getElementById('hashtags').innerText='#'+base.slice(0,3).join(' #')+' #'+cat.replace(' ','')+' #Pakistan';
document.getElementById('titles').innerText=`1. ${t} - Best Method\n2. ${t} in Pakistan 2025\n3. How to ${t} - Urdu`;
};
document.getElementById('copy').onclick=()=>{
let txt=[...document.querySelectorAll('#tags span')].map(s=>s.innerText).join(', ');
navigator.clipboard.writeText(txt); alert('Tags Copied!');
};
</script>
</body>
</html>
