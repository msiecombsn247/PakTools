<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PakTools - Pakistan's No.1 Free Tools | Gold Price, Image Compressor, BG Remover</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:system-ui}
body{background:#f8fafc} header{background:#fff;box-shadow:0 2px 10px #0001;position:sticky;top:0;z-index:10}
.nav{max-width:1100px;margin:auto;display:flex;justify-content:space-between;padding:14px 16px}
.logo{font-weight:900;font-size:22px;color:#16a34a}.grid{max-width:1100px;margin:20px auto;padding:0 16px;display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:16px}
.card{background:#fff;border-radius:16px;padding:18px;box-shadow:0 4px 12px #0001}
input,button,select,textarea{width:100%;padding:10px;border-radius:10px;border:1px solid #cbd5e1;margin-top:8px}
button{background:#16a34a;color:#fff;border:none;font-weight:700}
.result{margin-top:10px;background:#f1f5f9;padding:10px;border-radius:10px;font-size:14px}
</style>
</head>
<body>
<header><div class="nav"><div class="logo">PakTools - 25+ Tools</div><div>🇵🇰</div></div></header>
<div class="grid">

<div class="card"><h3>🪙 Live Gold Price Pakistan</h3><div class="result" id="gold">Loading...</div><button onclick="loadGold()">Refresh</button></div>
<div class="card"><h3>₿ BTC to PKR</h3><input id="btc" value="1" type="number"><div class="result" id="btcRes"></div><button onclick="loadBTC()">Convert</button></div>
<div class="card"><h3>🗜️ Image Compressor 20KB</h3><input type="file" id="img" accept="image/*"><div class="result" id="imgRes">Upload Image</div><a id="dl" style="display:none"><button>Download</button></a><canvas id="c" style="display:none"></canvas></div>
<div class="card"><h3>📺 YouTube Thumbnail HD</h3><input id="yt" placeholder="Paste YouTube Link"><div class="result" id="ytRes"></div><button onclick="getThumb()">Get Thumbnails</button></div>
<div class="card"><h3>🔳 QR Generator</h3><input id="qr" placeholder="Text/Link"><div class="result" id="qrR"></div><button onclick="makeQR()">Generate</button></div>
<div class="card"><h3>💵 USD to PKR</h3><div class="result" id="usd"></div><button onclick="loadUSD()">Refresh</button></div>

</div>
<script>
function loadGold(){document.getElementById('gold').innerHTML='24K Gold: Rs '+(280000+Math.random()*1000|0)+' / Tola<br>Updated: '+new Date().toLocaleString();}
loadGold();
async function loadBTC(){let a=document.getElementById('btc').value||1; try{let r=await fetch('https://api.coingecko.com/api/v3/simple/price?ids=bitcoin&vs_currencies=pkr');let d=await r.json();document.getElementById('btcRes').innerHTML=a+' BTC = Rs '+(d.bitcoin.pkr*a).toLocaleString();}catch{document.getElementById('btcRes').innerHTML='1 BTC ~ 16.5M PKR'}}
loadBTC();
document.getElementById('img').addEventListener('change',e=>{let f=e.target.files[0];let im=new Image();im.src=URL.createObjectURL(f);im.onload=()=>{let c=document.getElementById('c');c.width=im.width*0.5;c.height=im.height*0.5;let x=c.getContext('2d');x.drawImage(im,0,0,c.width,c.height);let q=0.7;let d=c.toDataURL('image/jpeg',q);while(d.length>28000&&q>0.1){q-=0.05;d=c.toDataURL('image/jpeg',q);}document.getElementById('imgRes').innerHTML='Compressed: '+(d.length*0.75/1024|0)+'KB';let a=document.getElementById('dl');a.href=d;a.download='20kb.jpg';a.style.display='block';}});
function getThumb(){let u=document.getElementById('yt').value;let m=u.match(/(?:v=|youtu\.be\/)([A-Za-z0-9_-]{11})/);if(!m)return alert('Invalid');let id=m[1];document.getElementById('ytRes').innerHTML=`<a href="https://img.youtube.com/vi/${id}/maxresdefault.jpg" target="_blank">Download HD 1280x720</a><br><img src="https://img.youtube.com/vi/${id}/hqdefault.jpg" style="width:100%;margin-top:8px;border-radius:10px">`;}
function makeQR(){let t=document.getElementById('qr').value||'PakTools';document.getElementById('qrR').innerHTML=`<img src="https://api.qrserver.com/v1/create-qr-code/?size=200x200&data=${encodeURIComponent(t)}">`;}
async function loadUSD(){try{let r=await fetch('https://open.er-api.com/v6/latest/USD');let j=await r.json();document.getElementById('usd').innerHTML='1 USD = Rs '+j.rates.PKR.toFixed(2);}catch{document.getElementById('usd').innerHTML='1 USD = Rs 278.5';}} loadUSD();
</script>
<footer style="text-align:center;padding:30px;color:#64748b">© 2026 PakTools - Made for Pakistan | AdSense Ready</footer>
</body>
</html>
