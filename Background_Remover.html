<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Background Remover</title><script src="https://cdn.tailwindcss.com"></script></head><body class="bg-[#0b1220] p-6"><a href="index.html" class="bg-white px-5 py-2 rounded-full font-bold">← Back</a><div class="max-w-xl mx-auto bg-white rounded-[2rem] p-8 mt-6 text-center"><h1 class="text-3xl font-black">AI Background Remover</h1><p class="text-gray-500 text-sm mt-1">Upload Image - Auto Remove</p><input type="file" id="file" accept="image/*" class="w-full border-2 border-dashed p-4 rounded-xl mt-6"><p id="status" class="mt-4 font-bold"></p><div id="preview" class="mt-4"></div></div><script>
document.getElementById('file').addEventListener('change', function(e){
  let file = e.target.files[0];
  if(!file) return;
  document.getElementById('status').innerText = "⏳ Processing... Please wait 5 sec";
  let img = new Image();
  img.onload = function(){
    let canvas = document.createElement('canvas');
    canvas.width = img.width;
    canvas.height = img.height;
    let ctx = canvas.getContext('2d');
    ctx.drawImage(img,0,0);
    // Simple Smart BG Remove - White BG to Transparent
    let imageData = ctx.getImageData(0,0,canvas.width,canvas.height);
    let data = imageData.data;
    for(let i=0;i<data.length;i+=4){
      if(data[i]>230 && data[i+1]>230 && data[i+2]>230){ data[i+3]=0; }
    }
    ctx.putImageData(imageData,0,0);
    let out = document.getElementById('preview');
    out.innerHTML = "";
    out.appendChild(canvas);
    canvas.style.maxWidth="100%";
    canvas.style.borderRadius="16px";
    let a = document.createElement('a');
    a.innerText="Download PNG (Transparent)";
    a.href=canvas.toDataURL("image/png");
    a.download="paktools-bg-removed.png";
    a.className="bg-black text-white px-6 py-3 rounded-full mt-4 inline-block font-bold";
    out.appendChild(document.createElement('br'));
    out.appendChild(a);
    document.getElementById('status').innerText="✅ Done! White Background Removed (For HD AI, use remove.bg API later)";
  };
  img.src = URL.createObjectURL(file);
});
</script></body></html>
