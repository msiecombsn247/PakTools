<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Image to PDF Converter - Merge JPG to PDF Free | PakTools</title>
<meta name="description" content="Convert Multiple JPG, PNG Images to Single PDF Free. Merge Images to PDF, High Quality. Offline, No Upload.">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;800;900&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>
<style>
*{font-family:'Inter',sans-serif}body{background:#07010f;color:white;margin:0}
.galaxy-bg{position:fixed;inset:0;z-index:0;background:#020006;pointer-events:none}
.galaxy{position:absolute;width:800px;height:800px;border-radius:50%;filter:blur(80px);opacity:0.5}
.g1{background:radial-gradient(circle,#c084fc,#7e22ce 25%,transparent 70%);top:-10%;left:-10%}
.g2{background:radial-gradient(circle,#a855f7,#581c87 25%,transparent 70%);bottom:-20%;right:-10%}
.tool-box{background:linear-gradient(145deg,rgba(28,10,58,0.92),rgba(12,3,32,0.92));border:1px solid rgba(168,85,247,0.3);border-radius:1.5rem}
.drop{border:2px dashed rgba(168,85,247,0.4);border-radius:1.5rem;padding:30px;text-align:center;background:rgba(0,0,0,0.3);transition:0.2s}
.drop.dragover{border-color:#c084fc;background:rgba(168,85,247,0.1)}
.thumb{width:80px;height:80px;object-fit:cover;border-radius:10px;border:1px solid rgba(255,255,255,0.2)}
@media(max-width:768px){.galaxy{filter:blur(40px);width:400px;height:400px}}
</style>
</head>
<body>
<div class="galaxy-bg"><div class="galaxy g1"></div><div class="galaxy g2"></div></div>
<header class="relative z-20 sticky top-0 border-b border-white/10 bg-[#07010f]/80 backdrop-blur-xl"><div class="max-w-7xl mx-auto px-6 py-4 flex justify-between items-center"><a href="index.html" class="font-black text-xl flex items-center gap-2" style="text-decoration:none;color:white"><div class="w-9 h-9 rounded-lg bg-gradient-to-br from-purple-400 to-purple-700 flex items-center justify-center">P</div>PakTools</a><a href="index.html" class="text-[12px] bg-white/10 border border-white/20 px-4 py-2 rounded-full" style="text-decoration:none;color:white">Home</a></div></header>

<main class="relative z-10 max-w-5xl mx-auto px-6 py-8">
<div class="text-center"><h1 class="text-3xl md:text-5xl font-black">Image to PDF <span class="text-transparent bg-clip-text bg-gradient-to-r from-purple-300 to-fuchsia-300">Merger PRO</span></h1><p class="text-gray-400 text-sm mt-2">Merge Multiple JPG/PNG to One PDF - Offline & Free</p></div>

<div class="tool-box p-6 mt-8">
<div id="drop" class="drop"><p class="text-3xl">📁</p><p class="font-bold mt-2 text-sm">Drag & Drop Images Here or Click to Upload</p><p class="text-[11px] text-gray-500 mt-1">JPG, PNG, WEBP - Up to 50 Images</p><input type="file" id="fileInput" accept="image/*" multiple hidden><button onclick="document.getElementById('fileInput').click()" class="mt-4 bg-white/10 border border-white/20 px-6 py-2 rounded-full text-xs">Select Images</button></div>

<div id="previewArea" class="hidden mt-6">
<div class="flex justify-between items-center mb-3"><p class="font-bold text-sm"><span id="count">0</span> Images Selected</p><button onclick="clearAll()" class="text-[11px] text-red-400">Clear All</button></div>
<div id="thumbs" class="flex flex-wrap gap-3 max-h-52 overflow-auto p-2 bg-black/30 rounded-xl"></div>
<div class="grid grid-cols-2 md:grid-cols-4 gap-3 mt-4">
<select id="orientation" class="bg-black/50 border border-white/20 rounded-full px-4 py-2.5 text-xs"><option value="p">Portrait</option><option value="l">Landscape</option></select>
<select id="pageSize" class="bg-black/50 border border-white/20 rounded-full px-4 py-2.5 text-xs"><option value="a4">A4</option><option value="letter">Letter</option><option value="fit">Fit to Image</option></select>
<select id="margin" class="bg-black/50 border border-white/20 rounded-full px-4 py-2.5 text-xs"><option value="10">Small Margin</option><option value="0">No Margin</option><option value="20">Large Margin</option></select>
<button onclick="convertToPDF()" class="bg-gradient-to-r from-purple-500 to-fuchsia-500 font-bold py-2.5 rounded-full text-xs">Convert to PDF</button>
</div>
<p id="status" class="text-xs text-center mt-3 text-gray-400"></p>
</div>
</div>
</main>

<script>
let images=[];
const drop=document.getElementById('drop'), input=document.getElementById('fileInput');
drop.addEventListener('dragover',e=>{e.preventDefault(); drop.classList.add('dragover')});
drop.addEventListener('dragleave',()=>drop.classList.remove('dragover'));
drop.addEventListener('drop',e=>{e.preventDefault(); drop.classList.remove('dragover'); handleFiles(e.dataTransfer.files)});
input.addEventListener('change',e=>handleFiles(e.target.files));

function handleFiles(files){
 for(let f of files){ if(!f.type.startsWith('image/')) continue;
  const reader=new FileReader();
  reader.onload=ev=>{images.push({src:ev.target.result, name:f.name}); render();};
  reader.readAsDataURL(f);
 }
}
function render(){
 document.getElementById('previewArea').classList.remove('hidden');
 document.getElementById('count').innerText=images.length;
 const thumbs=document.getElementById('thumbs'); thumbs.innerHTML='';
 images.forEach((img,i)=>{
  const d=document.createElement('div'); d.className='relative';
  d.innerHTML=`<img src="${img.src}" class="thumb"><button onclick="removeImg(${i})" class="absolute -top-1 -right-1 bg-red-500 text-white w-5 h-5 rounded-full text-[10px]">x</button>`;
  thumbs.appendChild(d);
 });
}
function removeImg(i){images.splice(i,1); render(); if(images.length==0) clearAll();}
function clearAll(){images=[]; document.getElementById('previewArea').classList.add('hidden'); document.getElementById('thumbs').innerHTML='';}

async function convertToPDF(){
 if(images.length==0){alert('Add images first');return;}
 const status=document.getElementById('status'); status.innerText='⏳ Creating PDF...';
 const {jsPDF}=window.jspdf;
 const orient=document.getElementById('orientation').value;
 const size=document.getElementById('pageSize').value;
 const margin=parseInt(document.getElementById('margin').value);
 let doc;
 if(size==='fit'){
   // first image size
   const img=new Image(); img.src=images[0].src; await new Promise(r=>img.onload=r);
   doc=new jsPDF({orientation: img.width>img.height?'l':'p', unit:'px', format:[img.width+margin*2, img.height+margin*2]});
 } else {
   doc=new jsPDF({orientation:orient, unit:'mm', format:size});
 }
 for(let i=0;i<images.length;i++){
  if(i>0) doc.addPage();
  const imgData=images[i].src;
  const props=doc.internal.pageSize;
  const pw=props.getWidth(), ph=props.getHeight();
  // fit image
  doc.addImage(imgData,'JPEG',margin,margin,pw-margin*2,ph-margin*2,undefined,'FAST');
  status.innerText=`⏳ Adding ${i+1}/${images.length}...`;
 }
 doc.save(`PakTools-Images-to-PDF-${Date.now()}.pdf`);
 status.innerText=`✅ PDF Ready - ${images.length} images merged!`;
}
</script>
</body>
</html>
