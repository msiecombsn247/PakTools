<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>PDF to JPG</title><script src="https://cdn.tailwindcss.com"></script><script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.11.338/pdf.min.js"></script></head><body class="bg-[#0b1220] p-6"><a href="index.html" class="bg-white px-5 py-2 rounded-full font-bold">← Back</a><div class="max-w-xl mx-auto bg-white rounded-[2rem] p-8 mt-6 text-center"><h1 class="text-3xl font-black">PDF to JPG</h1><p class="text-gray-500">Convert Fast</p><input type="file" id="pdf" accept="application/pdf" class="mt-6 w-full"><div id="preview" class="mt-6"></div><p class="text-xs text-gray-400 mt-4">Note: First page will be converted to JPG</p></div><script>pdf.onchange=async(e=>{let file=e.target.files[0];let reader=new FileReader();reader.onload=async()=>{let pdfjs=window['pdfjs-dist/build/pdf'];pdfjs.GlobalWorkerOptions.workerSrc='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.11.338/pdf.worker.min.js';let doc=await pdfjs.getDocument(reader.result).promise;let page=await doc.getPage(1);let viewport=page.getViewport({scale:2});let canvas=document.createElement('canvas');canvas.width=viewport.width;canvas.height=viewport.height;await page.render({canvasContext:canvas.getContext('2d'),viewport}).promise;preview.innerHTML="";preview.appendChild(canvas);let a=document.createElement('a');a.innerText="Download JPG";a.href=canvas.toDataURL("image/jpeg");a.download="converted.jpg";a.className="bg-black text-white px-6 py-2 rounded-full mt-4 inline-block font-bold";preview.appendChild(a)};reader.readAsArrayBuffer(file)}</script></body></html>
