<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>PDF to JPG Converter - Free Batch Pakistan | PakTools</title>
<meta name="description" content="Free PDF to JPG converter Pakistan - Batch convert PDF pages to JPG images. High quality, offline, secure.">
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script>pdfjsLib.GlobalWorkerOptions.workerSrc='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js'</script>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@800&family=Inter:wght@400;600&display=swap" rel="stylesheet">
</head>
<body style="background:#07010f;color:white;font-family:Inter,sans-serif">
<div style="position:fixed;inset:0;background:radial-gradient(ellipse at 30% 20%, rgba(120,40,200,0.15), transparent 50%);z-index:0"></div>
<header class="sticky top-0 z-20 border-b border-white/10 bg-[#07010f]/80 backdrop-blur-xl"><div class="max-w-6xl mx-auto px-6 py-4 flex justify-between items-center"><a href="index.html" style="text-decoration:none;color:white" class="font-black text-xl flex gap-2 items-center"><div class="w-8 h-8 rounded-lg bg-gradient-to-br from-purple-400 to-purple-700 flex items-center justify-center">P</div>PakTools</a><a href="blog.html" style="color:white;text-decoration:none" class="text-[11px] bg-white/10 border border-white/20 px-4 py-2 rounded-full">Blogs</a></div></header>
<main class="max-w-6xl mx-auto px-6 py-8 relative z-10">
<h1 style="font-family:'Plus Jakarta Sans'" class="text-3xl md:text-5xl font-black">PDF to JPG - Batch Converter</h1>
<p class="text-gray-400 text-[12px] mt-2">Convert PDF Pages to High Quality JPG • Batch • 100% Offline Secure</p>

<div id="drop" class="mt-6 border-2 border-dashed border-purple-500/40 bg-white/[0.04] rounded-[24px] p-10 text-center cursor-pointer"><div class="text-5xl">📄➡️🖼️</div><h3 class="mt-3 font-bold text-[14px]">Drop PDF or Click</h3><p class="text-[11px] text-gray-400 mt-1">PDF • Max 50MB • All pages to JPG</p><input id="file" type="file" accept="application/pdf" class="hidden"></div>

<div class="mt-4 flex gap-2"><select id="quality" class="bg-[#1a0f2e] border border-white/15 rounded-full px-4 py-2 text-[11px]"><option value="2">High Quality (2x)</option><option value="1.5">Medium Quality (1.5x)</option><option value="1">Low Quality (Fast)</option></select><button id="downloadAll" class="hidden px-5 py-2 bg-white text-black rounded-full text-[11px] font-bold">Download All ZIP</button><button id="clear" class="px-4 py-2 bg-white/10 rounded-full text-[11px]">Clear</button></div>

<div id="progress" class="hidden mt-4 text-[11px] text-purple-300">Converting Page <span id="cur">0</span> / <span id="total">0</span>...</div>
<div id="grid" class="mt-6 grid md:grid-cols-3 gap-4"></div>
</main>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<script>
const drop=document.getElementById('drop'), file=document.getElementById('file'), grid=document.getElementById('grid'), progress=document.getElementById('progress'), cur=document.getElementById('cur'), total=document.getElementById('total');
let images=[];
drop.onclick=()=>file.click();
drop.ondragover=e=>{e.preventDefault()};
drop.ondrop=e=>{e.preventDefault();handle(e.dataTransfer.files[0])};
file.onchange=e=>handle(e.target.files[0]);
async function handle(f){
if(!f) return;
grid.innerHTML=''; images=[]; progress.classList.remove('hidden');
let buf=await f.arrayBuffer();
let pdf=await pdfjsLib.getDocument(buf).promise;
total.textContent=pdf.numPages;
for(let i=1;i<=pdf.numPages;i++){
cur.textContent=i;
let page=await pdf.getPage(i);
let scale=parseFloat(document.getElementById('quality').value);
let viewport=page.getViewport({scale});
let canvas=document.createElement('canvas'); canvas.width=viewport.width; canvas.height=viewport.height;
let ctx=canvas.getContext('2d');
await page.render({canvasContext:ctx,viewport}).promise;
let jpgUrl=canvas.toDataURL('image/jpeg',0.92);
images.push({url:jpgUrl,name:`page-${i}.jpg`});
let div=document.createElement('div'); div.className='bg-white/[0.05] border border-white/10 rounded-xl p-3';
div.innerHTML=`<img src="${jpgUrl}" class="w-full rounded-lg"><div class="mt-2 text-[11px] font-bold">Page ${i}</div><button class="mt-2 w-full py-1 bg-white/10 rounded-full text-[10px] download-one">Download JPG</button>`;
div.querySelector('.download-one').onclick=()=>{let a=document.createElement('a'); a.href=jpgUrl; a.download=`page-${i}.jpg`; a.click();};
grid.appendChild(div);
}
progress.classList.add('hidden');
document.getElementById('downloadAll').classList.remove('hidden');
}
document.getElementById('downloadAll').onclick=async()=>{
let zip=new JSZip();
for(let img of images){ let b64=img.url.split(',')[1]; zip.file(img.name,b64,{base64:true}); }
let content=await zip.generateAsync({type:'blob'}); let a=document.createElement('a'); a.href=URL.createObjectURL(content); a.download='pdf-pages-jpg.zip'; a.click();
};
document.getElementById('clear').onclick=()=>{grid.innerHTML=''; images=[]; progress.classList.add('hidden')};
</script>
</body>
</html>
