<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Color Palette Generator - 100+ Palettes for Designers Pakistan | PakTools</title>
<meta name="description" content="100+ Color Palette Generator Pakistan - For logo, wedding, brand, Instagram. Copy HEX, RGB, export PNG. 100% free for designers.">
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@800&family=Inter:wght@400;600&display=swap" rel="stylesheet">
</head>
<body style="background:#07010f;color:white;font-family:Inter,sans-serif">
<div style="position:fixed;inset:0;background:radial-gradient(ellipse at 30% 20%, rgba(120,40,200,0.15), transparent 50%);z-index:0"></div>
<header class="sticky top-0 z-20 border-b border-white/10 bg-[#07010f]/80 backdrop-blur-xl"><div class="max-w-6xl mx-auto px-6 py-4 flex justify-between items-center"><a href="index.html" style="text-decoration:none;color:white" class="font-black text-xl flex gap-2 items-center"><div class="w-8 h-8 rounded-lg bg-gradient-to-br from-purple-400 to-purple-700 flex items-center justify-center">P</div>PakTools</a><a href="blog.html" style="color:white;text-decoration:none" class="text-[11px] bg-white/10 border border-white/20 px-4 py-2 rounded-full">Blogs</a></div></header>
<main class="max-w-6xl mx-auto px-6 py-8 relative z-10">
<h1 style="font-family:'Plus Jakarta Sans'" class="text-3xl md:text-5xl font-black">Color Palette Generator - 100+ Palettes</h1>
<p class="text-gray-400 text-[12px] mt-2">For Logo, Brand, Wedding Cards, Instagram, YouTube Thumbnail - One Click Copy HEX</p>

<div class="mt-6 flex flex-wrap gap-2">
<button data-cat="all" class="cat-btn bg-purple-600 text-white px-4 py-2 rounded-full text-[11px] font-bold">All 100+</button>
<button data-cat="brand" class="cat-btn bg-white/10 border border-white/10 px-4 py-2 rounded-full text-[11px]">Brand</button>
<button data-cat="wedding" class="cat-btn bg-white/10 border border-white/10 px-4 py-2 rounded-full text-[11px]">Wedding</button>
<button data-cat="instagram" class="cat-btn bg-white/10 border border-white/10 px-4 py-2 rounded-full text-[11px]">Instagram</button>
<button data-cat="nature" class="cat-btn bg-white/10 border border-white/10 px-4 py-2 rounded-full text-[11px]">Nature</button>
<button data-cat="dark" class="cat-btn bg-white/10 border border-white/10 px-4 py-2 rounded-full text-[11px]">Dark Mode</button>
<button id="randomBtn" class="bg-gradient-to-r from-purple-500 to-fuchsia-500 px-5 py-2 rounded-full text-[11px] font-bold">🎨 Generate Random</button>
</div>

<div id="palettesGrid" class="mt-8 grid md:grid-cols-2 lg:grid-cols-3 gap-4"></div>
</main>
<script>
const palettes=[
{c:"brand",n:"Pakistani Brand - Trust Blue",colors:["#0F172A","#1E40AF","#3B82F6","#93C5FD","#EFF6FF"]},
{c:"brand",n:"Rozee.pk - Job Portal",colors:["#7C3AED","#A78BFA","#DDD6FE","#F5F3FF","#1F2937"]},
{c:"wedding",n:"Mehndi - Green Gold",colors:["#14532D","#16A34A","#FACC15","#FEF9C3","#A16207"]},
{c:"wedding",n:"Baraat - Royal Red",colors:["#7F1D1D","#DC2626","#FBBF24","#FFF7ED","#92400E"]},
{c:"instagram",n:"Sunset Vibes",colors:["#FF6B6B","#FFE66D","#4ECDC4","#1A535C","#F7FFF7"]},
{c:"nature",n:"Thar Desert",colors:["#D97706","#F59E0B","#FDE68A","#FEF3C7","#78350F"]},
{c:"dark",n:"Galaxy - Your Theme",colors:["#07010F","#2D1B69","#7C3AED","#E879F9","#FFFFFF"]},
];
function addMore(){
for(let i=palettes.length;i<105;i++){
let cat=["brand","wedding","instagram","nature","dark"][i%5];
let baseH=Math.floor(Math.random()*360);
let colors=[`hsl(${baseH},70%,20%)`,`hsl(${(baseH+30)%360},80%,50%)`,`hsl(${(baseH+60)%360},90%,65%)`,`hsl(${(baseH+90)%360},70%,85%)`,`hsl(${(baseH+120)%360},20%,95%)`];
palettes.push({c:cat,n:`${cat.toUpperCase()} Palette #${i+1}`,colors});
}
}
addMore();
function render(filter="all"){
const grid=document.getElementById('palettesGrid'); grid.innerHTML='';
palettes.filter(p=>filter=="all"||p.c==filter).forEach((p,idx)=>{
let html=`<div class="bg-white/[0.05] border border-white/10 rounded-2xl overflow-hidden hover:border-purple-500/40 transition"><div class="flex h-20">`+p.colors.map(col=>`<div style="background:${col}" class="flex-1 relative group cursor-pointer" onclick="copyColor('${col}')"><span class="absolute bottom-1 left-1 text-[9px] bg-black/60 px-1 rounded opacity-0 group-hover:opacity-100">${col}</span></div>`).join('')+`</div><div class="p-4 flex justify-between items-center"><div><div class="text-[11px] font-bold">${p.n}</div><div class="text-[10px] text-gray-400">${p.c.toUpperCase()} • ${p.colors.join(' • ')}</div></div><button onclick="copyPalette('${p.colors.join(',')}')" class="px-3 py-1 bg-white text-black rounded-full text-[10px] font-bold">Copy All</button></div></div>`;
grid.innerHTML+=html;
});
}
function copyColor(c){navigator.clipboard.writeText(c);alert('Copied '+c)}
function copyPalette(cs){navigator.clipboard.writeText(cs);alert('Palette Copied: '+cs)}
document.querySelectorAll('.cat-btn').forEach(b=>b.onclick=()=>{document.querySelectorAll('.cat-btn').forEach(x=>x.classList.remove('bg-purple-600','text-white'));document.querySelectorAll('.cat-btn').forEach(x=>{if(!x.id)x.className='cat-btn bg-white/10 border border-white/10 px-4 py-2 rounded-full text-[11px]'});b.classList.add('bg-purple-600','text-white');render(b.dataset.cat)});
document.getElementById('randomBtn').onclick=()=>{addMore();render();window.scrollTo({top:0,behavior:'smooth'})}
render();
window.copyColor=copyColor; window.copyPalette=copyPalette;
</script>
</body>
</html>
