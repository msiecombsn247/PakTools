<!DOCTYPE html>
<html lang="ur" dir="rtl">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>College Chutti Application - English / Urdu Mein Bol Kar Banao | PakTools</title>
<meta name="description" content="College ki chutti ki application English ya Urdu mein bol kar banao. Mic se bolo, PDF ready.">
<link rel="canonical" href="https://www.paktoolsonline.com/chitthi/college.html">
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Noto+Nastaliq+Urdu:wght@400;600;700&family=Inter:wght@400;700;900&display=swap" rel="stylesheet">
<style>
.urdu{font-family:'Noto Nastaliq Urdu',serif;line-height:2.6}
body{background:#07010f;color:#fff}
.glass{background:rgba(255,255,255,0.05);border:1px solid rgba(255,255,255,0.1);backdrop-filter:blur(12px)}
.lang-active{background:white !important;color:black !important;font-weight:900}
.en-input{direction:ltr;text-align:left;font-family:'Inter',sans-serif}
.ur-input{direction:rtl;text-align:right;font-family:'Noto Nastaliq Urdu',serif}
</style>
</head>
<body>
<div style="position:fixed;inset:0;z-index:-1;background:#07010f"><div style="position:absolute;width:1200px;height:1200px;background:radial-gradient(circle,#d946ef,#07010f 70%);filter:blur(90px);opacity:0.3"></div></div>
<header class="sticky top-0 z-20 border-b border-white/10 bg-[#07010f]/90 backdrop-blur-xl p-4 flex justify-between"><a href="../index.html" class="font-black text-white no-underline">← PakTools</a><a href="index.html" class="text-xs bg-white/10 px-3 py-1 rounded-full text-white no-underline">✉️ Chitthi Home</a></header>
<main class="max-w-4xl mx-auto px-5 py-8">
<h1 class="text-3xl font-black text-center">🎓 کالج چھٹی - <span class="text-fuchsia-300">بول کر بنائیں</span></h1>

<div class="mt-6 flex justify-center gap-2 p-1 bg-white/10 rounded-full w-fit mx-auto border border-white/10">
<button id="btnEn" onclick="setLang('en')" class="lang-active px-6 py-2 rounded-full text-sm">English</button>
<button id="btnUr" onclick="setLang('ur')" class="px-6 py-2 rounded-full text-sm text-gray-300">اردو</button>
</div>
<p id="langNote" class="text-center text-[11px] text-fuchsia-300 mt-2">English mode: Speak in ENGLISH, Application will be in English</p>

<div class="mt-6 glass rounded-[24px] p-6">
<div class="grid md:grid-cols-2 gap-4">
<div><label id="lName" class="text-[11px] text-gray-400">1. Name</label><div class="flex gap-2 mt-1"><input id="cName" class="en-input w-full bg-black/50 border border-white/10 rounded-full px-4 py-3 text-sm" placeholder="Ali Ahmed"><button onclick="startMic('cName')" class="bg-fuchsia-600 px-5 rounded-full">🎤</button></div></div>
<div><label id="lRoll" class="text-[11px] text-gray-400">2. Roll No</label><div class="flex gap-2 mt-1"><input id="cRoll" class="en-input w-full bg-black/50 border border-white/10 rounded-full px-4 py-3 text-sm" placeholder="1234"><button onclick="startMic('cRoll')" class="bg-fuchsia-600 px-5 rounded-full">🎤</button></div></div>
<div><label id="lClass" class="text-[11px] text-gray-400">3. Class / Semester</label><div class="flex gap-2 mt-1"><input id="cClass" class="en-input w-full bg-black/50 border border-white/10 rounded-full px-4 py-3 text-sm" placeholder="BS 4th Semester"><button onclick="startMic('cClass')" class="bg-fuchsia-600 px-5 rounded-full">🎤</button></div></div>
<div><label id="lDays" class="text-[11px] text-gray-400">4. Days of Leave</label><div class="flex gap-2 mt-1"><input id="cDays" class="en-input w-full bg-black/50 border border-white/10 rounded-full px-4 py-3 text-sm" placeholder="2 Days"><button onclick="startMic('cDays')" class="bg-fuchsia-600 px-5 rounded-full">🎤</button></div></div>
<div class="md:col-span-2"><label id="lReason" class="text-[11px] text-gray-400">5. Reason</label><div class="flex gap-2 mt-1"><input id="cReason" class="en-input w-full bg-black/50 border border-white/10 rounded-full px-4 py-3 text-sm" placeholder="Fever"><button onclick="startMic('cReason')" class="bg-gradient-to-r from-purple-600 to-fuchsia-600 px-6 rounded-full font-bold">🎤 Speak</button></div></div>
<div class="md:col-span-2"><label id="lCollege" class="text-[11px] text-gray-400">6. College Name</label><div class="flex gap-2 mt-1"><input id="cCollege" class="en-input w-full bg-black/50 border border-white/10 rounded-full px-4 py-3 text-sm" placeholder="Govt. College Lahore"><button onclick="startMic('cCollege')" class="bg-fuchsia-600 px-5 rounded-full">🎤</button></div></div>
</div>
<button onclick="generate()" class="mt-6 w-full bg-gradient-to-r from-purple-600 to-fuchsia-600 py-4 rounded-full font-black text-sm">✨ Generate / درخواست بنائیں</button>
<div id="resultBox" class="hidden mt-6"><div id="appOutput" class="bg-white text-black p-8 rounded-[20px] whitespace-pre-line text-[14px] leading-7"></div><div class="flex gap-2 mt-3"><button onclick="copyText()" class="flex-1 bg-white/10 border border-white/20 py-3 rounded-full text-xs font-bold">📋 Copy / کاپی</button><button onclick="window.print()" class="flex-1 bg-white text-black py-3 rounded-full text-xs font-bold">🖨️ PDF</button></div></div>
<p id="micStatus" class="text-center text-[11px] text-fuchsia-300 mt-3"></p>
</div>
</main>
<script>
let currentLang='en';
function setLang(l){
  currentLang=l;
  document.getElementById('btnEn').classList.remove('lang-active');
  document.getElementById('btnUr').classList.remove('lang-active');
  const ids=['cName','cRoll','cClass','cDays','cReason','cCollege'];
  if(l==='en'){
    document.getElementById('btnEn').classList.add('lang-active');
    document.getElementById('langNote').innerText='English mode: Please speak in ENGLISH';
    document.getElementById('lName').innerText='1. Name'; document.getElementById('lRoll').innerText='2. Roll No'; document.getElementById('lClass').innerText='3. Class / Semester'; document.getElementById('lDays').innerText='4. Days of Leave'; document.getElementById('lReason').innerText='5. Reason'; document.getElementById('lCollege').innerText='6. College Name';
    document.getElementById('cName').placeholder='Ali Ahmed'; document.getElementById('cRoll').placeholder='1234'; document.getElementById('cClass').placeholder='BS 4th Semester'; document.getElementById('cDays').placeholder='2 Days'; document.getElementById('cReason').placeholder='Fever'; document.getElementById('cCollege').placeholder='Govt. College Lahore';
    ids.forEach(id=>{ document.getElementById(id).className='en-input w-full bg-black/50 border border-white/10 rounded-full px-4 py-3 text-sm'; });
  }else{
    document.getElementById('btnUr').classList.add('lang-active');
    document.getElementById('langNote').innerText='اردو موڈ: براہ کرم اردو میں بولیں';
    document.getElementById('lName').innerText='1. نام'; document.getElementById('lRoll').innerText='2. رول نمبر'; document.getElementById('lClass').innerText='3. کلاس / سمسٹر'; document.getElementById('lDays').innerText='4. کتنے دن کی چھٹی؟'; document.getElementById('lReason').innerText='5. وجہ'; document.getElementById('lCollege').innerText='6. کالج کا نام';
    document.getElementById('cName').placeholder='علی احمد'; document.getElementById('cRoll').placeholder='1234'; document.getElementById('cClass').placeholder='بی ایس چوتھا سمسٹر'; document.getElementById('cDays').placeholder='دو دن'; document.getElementById('cReason').placeholder='بخار کی وجہ سے'; document.getElementById('cCollege').placeholder='گورنمنٹ کالج لاہور';
    ids.forEach(id=>{ document.getElementById(id).className='ur-input w-full bg-black/50 border border-white/10 rounded-full px-4 py-3 text-sm'; });
  }
}
function startMic(id){
  const Rec=window.SpeechRecognition||window.webkitSpeechRecognition;
  if(!Rec){ alert('Mic only in Chrome'); return; }
  const rec=new Rec(); rec.lang=currentLang==='ur'?'ur-PK':'en-US';
  document.getElementById('micStatus').innerText=currentLang==='ur'?'🎤 سن رہا ہوں...':'🎤 Listening...';
  rec.onresult=e=>{ document.getElementById(id).value=e.results[0][0].transcript; document.getElementById('micStatus').innerText='✅ '+e.results[0][0].transcript; };
  rec.start();
}
function toUrduDays(input){
  if(!input) return currentLang==='ur'?'ایک دن':'One Day';
  let t=input.toLowerCase().trim();
  if(currentLang==='ur'){
    if(t.includes('1')||t.includes('ایک')||t.includes('one')) return 'ایک دن';
    if(t.includes('2')||t.includes('دو')||t.includes('two')) return 'دو دن';
    if(t.includes('3')||t.includes('تین')) return 'تین دن';
    if(t.includes('4')||t.includes('چار')) return 'چار دن';
    if(t.includes('5')||t.includes('پانچ')) return 'پانچ دن';
    if(t.includes('دن')) return input;
  }
  return input;
}
function generate(){
  let name=document.getElementById('cName').value.trim()||(currentLang==='ur'?'طالب علم':'Student');
  let roll=document.getElementById('cRoll').value.trim()||'';
  let cls=document.getElementById('cClass').value.trim()||(currentLang==='ur'?'بی ایس':'BS');
  let daysRaw=document.getElementById('cDays').value.trim()||(currentLang==='ur'?'ایک دن':'One Day');
  let reason=document.getElementById('cReason').value.trim()||(currentLang==='ur'?'بخار':'Fever');
  let college=document.getElementById('cCollege').value.trim()||(currentLang==='ur'?'گورنمنٹ کالج':'Govt. College');
  let days=toUrduDays(daysRaw);
  let date=new Date().toLocaleDateString('en-GB');
  let out=document.getElementById('appOutput');
  let app='';

  if(currentLang==='en'){
    app=`To,
The Principal,
${college}

Subject: Application for ${days} Leave

Respected Sir,

I beg to state that I am ${name}${roll? ', Roll No. '+roll : ''} of Class ${cls}. I am writing to request ${days} leave as I am suffering from ${reason}. Therefore, I will not be able to attend college.

Kindly grant me ${days} leave. I shall be highly obliged.

Yours obediently,
${name}
${roll? 'Roll No: '+roll+'\n':''}Class: ${cls}
Date: ${date}`;
    out.style.direction='ltr'; out.style.textAlign='left'; out.style.fontFamily="'Inter',sans-serif"; out.style.fontSize='14px'; out.style.lineHeight='1.8';
    out.innerText=app;
  }else{
    app=`بخدمت جناب پرنسپل صاحب،<br>${college}<br><br>موضوع: ${days} کی چھٹی کی درخواست<br><br>جناب عالی!<br><br>گزارش ہے کہ میرا نام ${name} ${roll? 'اور رول نمبر '+roll+' ہے' : 'ہے'} اور میں ${cls} کا طالب علم ہوں۔ گزارش ہے کہ ${reason} کی وجہ سے میں ${days} کالج حاضر نہیں ہو سکوں گا۔<br><br>برائے مہربانی مجھے ${days} کی چھٹی دے کر شکرگزار ہونے کا موقع دیں۔<br><br>آپ کا شاگرد،<br>${name}<br>${roll? 'رول نمبر: '+roll+'<br>':''}کلاس: ${cls}<br>تاریخ: ${date}`;
    out.style.direction='rtl'; out.style.textAlign='right'; out.style.fontFamily="'Noto Nastaliq Urdu',serif"; out.style.fontSize='20px'; out.style.lineHeight='2.7';
    out.innerHTML=app;
  }
  document.getElementById('resultBox').classList.remove('hidden');
  window.scrollTo({top: document.getElementById('resultBox').offsetTop - 20, behavior:'smooth'});
}
function copyText(){ navigator.clipboard.writeText(document.getElementById('appOutput').innerText).then(()=>alert(currentLang==='ur'?'کاپی ہو گئی!':'Copied!')); }
setLang('en');
</script>
</body>
</html>
